name: aggregator-backend

x-log: &log {driver: local, options: {max-size: "20m", max-file: "5"}}
x-secure: &secure
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 256
  stop_grace_period: 30s
  networks: [backend]
  logging: *log
x-api: &api
  <<: *secure
  restart: unless-stopped
  networks: [backend, egress]
  cpus: "0.75"
  mem_limit: 512m
x-worker: &worker
  <<: *secure
  restart: unless-stopped
  cpus: "1.0"
  mem_limit: 768m
  healthcheck: {test: [CMD-SHELL, 'test "$(cat /proc/1/comm)" = dotnet'], interval: 15s, timeout: 5s, retries: 4, start_period: 15s}
x-job: &job
  <<: *secure
  restart: "no"
  cpus: "1.0"
  mem_limit: 512m
x-build: &build {context: ., dockerfile: deploy/Dockerfile.dotnet-service}
x-sdk: &sdk {DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'}
x-runtime: &runtime {DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'}
x-aspnet: &aspnet {DOTNET_RUNTIME_IMAGE: '${DOTNET_ASPNET_IMAGE:?DOTNET_ASPNET_IMAGE is required}'}
x-api-env: &api-env
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: '${ASPNETCORE_ENVIRONMENT:-Development}'
  Authentication__Authority: '${AUTHENTICATION_AUTHORITY:?AUTHENTICATION_AUTHORITY is required}'
  Authentication__RequireHttpsMetadata: '${AUTHENTICATION_REQUIRE_HTTPS_METADATA:-true}'
  OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
  DOTNET_EnableDiagnostics: "0"
x-worker-env: &worker-env {OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}', DOTNET_EnableDiagnostics: "0"}
x-api-health: &api-health {test: [CMD, dotnet, /health/HealthProbe.dll, 'http://127.0.0.1:8080/health/ready'], interval: 10s, timeout: 6s, retries: 12, start_period: 15s}
x-media-store: &media-store
  CatalogMedia__ObjectStorage__ServiceUrl: http://seaweedfs:8333
  CatalogMedia__ObjectStorage__Region: '${OBJECT_STORAGE_REGION:-us-east-1}'
  CatalogMedia__ObjectStorage__Bucket: '${CATALOG_MEDIA_BUCKET:-catalog-media}'
  CatalogMedia__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}'
  CatalogMedia__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}'
  CatalogMedia__ObjectStorage__ForcePathStyle: "true"
x-grant: &grant
  image: '${POSTGIS_IMAGE:?POSTGIS_IMAGE is required}'
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  entrypoint: [/bin/bash, /grants/grant-context.sh]
  volumes: [./deploy/postgres:/grants:ro]
  networks: [backend]
  logging: *log

services:
  postgres:
    image: '${POSTGIS_IMAGE:?POSTGIS_IMAGE is required}'
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: '${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}'
      CATALOG_APP_PASSWORD: '${CATALOG_APP_PASSWORD:?CATALOG_APP_PASSWORD is required}'
      CATALOG_MIGRATOR_PASSWORD: '${CATALOG_MIGRATOR_PASSWORD:?CATALOG_MIGRATOR_PASSWORD is required}'
      QUERY_APP_PASSWORD: '${QUERY_APP_PASSWORD:?QUERY_APP_PASSWORD is required}'
      QUERY_MIGRATOR_PASSWORD: '${QUERY_MIGRATOR_PASSWORD:?QUERY_MIGRATOR_PASSWORD is required}'
      INGESTION_APP_PASSWORD: '${INGESTION_APP_PASSWORD:?INGESTION_APP_PASSWORD is required}'
      INGESTION_MIGRATOR_PASSWORD: '${INGESTION_MIGRATOR_PASSWORD:?INGESTION_MIGRATOR_PASSWORD is required}'
      ANALYTICS_APP_PASSWORD: '${ANALYTICS_APP_PASSWORD:?ANALYTICS_APP_PASSWORD is required}'
      ANALYTICS_MIGRATOR_PASSWORD: '${ANALYTICS_MIGRATOR_PASSWORD:?ANALYTICS_MIGRATOR_PASSWORD is required}'
      PROMOTION_APP_PASSWORD: '${PROMOTION_APP_PASSWORD:?PROMOTION_APP_PASSWORD is required}'
      PROMOTION_MIGRATOR_PASSWORD: '${PROMOTION_MIGRATOR_PASSWORD:?PROMOTION_MIGRATOR_PASSWORD is required}'
    healthcheck: {test: [CMD-SHELL, 'pg_isready --username platform_admin --dbname postgres'], interval: 5s, timeout: 5s, retries: 30}
    volumes: [postgres-data:/var/lib/postgresql, ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro]
    shm_size: 256m
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 2g
    stop_grace_period: 60s
    networks: [backend]
    logging: *log
  rabbitmq:
    image: '${RABBITMQ_IMAGE:?RABBITMQ_IMAGE is required}'
    hostname: rabbitmq
    restart: unless-stopped
    environment: {RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:?RABBITMQ_USER is required}', RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}'}
    healthcheck: {test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 30}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    pids_limit: 512
    cpus: "1.0"
    mem_limit: 1g
    stop_grace_period: 60s
    networks: [backend]
    logging: *log
  seaweedfs:
    image: '${SEAWEEDFS_IMAGE:?SEAWEEDFS_IMAGE is required}'
    hostname: seaweedfs
    restart: unless-stopped
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: '${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}'
      AWS_SECRET_ACCESS_KEY: '${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}'
      S3_BUCKET: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts},${CATALOG_MEDIA_BUCKET:-catalog-media},${INGESTION_BUCKET:-ingestion-packages}'
    healthcheck: {test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8333/'], interval: 5s, timeout: 5s, retries: 30, start_period: 10s}
    volumes: [seaweedfs-data:/data]
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1g
    stop_grace_period: 60s
    networks: [backend]
    logging: *log
  clamav:
    image: '${CLAMAV_IMAGE:?CLAMAV_IMAGE is required}'
    hostname: clamav
    restart: unless-stopped
    healthcheck: {test: [CMD-SHELL, 'clamdscan --ping=1 >/dev/null 2>&1'], interval: 15s, timeout: 10s, retries: 20, start_period: 120s}
    volumes: [clamav-signatures:/var/lib/clamav]
    pids_limit: 512
    cpus: "2.0"
    mem_limit: 2g
    stop_grace_period: 60s
    networks: [backend]
    logging: *log

  catalog-migrations:
    <<: *job
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Catalog/Catalog.Migrations/Catalog.Migrations.csproj, APP_DLL: Catalog.Migrations.dll}}
    environment: {CATALOG_MIGRATOR_CONNECTION_STRING: 'Host=postgres;Database=catalog_db;Username=catalog_migrator;Password=${CATALOG_MIGRATOR_PASSWORD};Include Error Detail=true', DOTNET_EnableDiagnostics: "0"}
    depends_on: {postgres: {condition: service_healthy}}
  query-migrations:
    <<: *job
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Query/Query.Migrations/Query.Migrations.csproj, APP_DLL: Query.Migrations.dll}}
    environment: {QUERY_MIGRATOR_CONNECTION_STRING: 'Host=postgres;Database=query_db;Username=query_migrator;Password=${QUERY_MIGRATOR_PASSWORD};Include Error Detail=true', DOTNET_EnableDiagnostics: "0"}
    depends_on: {postgres: {condition: service_healthy}}
  ingestion-migrations:
    <<: *job
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Ingestion/Ingestion.Migrations/Ingestion.Migrations.csproj, APP_DLL: Ingestion.Migrations.dll}}
    environment: {INGESTION_MIGRATOR_CONNECTION_STRING: 'Host=postgres;Database=ingestion_db;Username=ingestion_migrator;Password=${INGESTION_MIGRATOR_PASSWORD};Include Error Detail=true', DOTNET_EnableDiagnostics: "0"}
    depends_on: {postgres: {condition: service_healthy}}
  analytics-migrations:
    <<: *job
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj, APP_DLL: Analytics.Migrations.dll}}
    environment: {ANALYTICS_MIGRATOR_CONNECTION_STRING: 'Host=postgres;Database=analytics_db;Username=analytics_migrator;Password=${ANALYTICS_MIGRATOR_PASSWORD};Include Error Detail=true', DOTNET_EnableDiagnostics: "0"}
    depends_on: {postgres: {condition: service_healthy}}
  promotion-migrations:
    <<: *job
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Promotion/Promotion.Migrations/Promotion.Migrations.csproj, APP_DLL: Promotion.Migrations.dll}}
    environment: {PROMOTION_MIGRATOR_CONNECTION_STRING: 'Host=postgres;Database=promotion_db;Username=promotion_migrator;Password=${PROMOTION_MIGRATOR_PASSWORD};Include Error Detail=true', DOTNET_EnableDiagnostics: "0"}
    depends_on: {postgres: {condition: service_healthy}}

  catalog-grants:
    <<: *grant
    environment: {PGHOST: postgres, PGPORT: "5432", PGDATABASE: catalog_db, PGUSER: catalog_migrator, PGPASSWORD: '${CATALOG_MIGRATOR_PASSWORD:?CATALOG_MIGRATOR_PASSWORD is required}', APP_ROLE: catalog_app}
    depends_on: {catalog-migrations: {condition: service_completed_successfully}}
  query-grants:
    <<: *grant
    environment: {PGHOST: postgres, PGPORT: "5432", PGDATABASE: query_db, PGUSER: query_migrator, PGPASSWORD: '${QUERY_MIGRATOR_PASSWORD:?QUERY_MIGRATOR_PASSWORD is required}', APP_ROLE: query_app}
    depends_on: {query-migrations: {condition: service_completed_successfully}}
  ingestion-grants:
    <<: *grant
    environment: {PGHOST: postgres, PGPORT: "5432", PGDATABASE: ingestion_db, PGUSER: ingestion_migrator, PGPASSWORD: '${INGESTION_MIGRATOR_PASSWORD:?INGESTION_MIGRATOR_PASSWORD is required}', APP_ROLE: ingestion_app}
    depends_on: {ingestion-migrations: {condition: service_completed_successfully}}
  analytics-grants:
    <<: *grant
    environment: {PGHOST: postgres, PGPORT: "5432", PGDATABASE: analytics_db, PGUSER: analytics_migrator, PGPASSWORD: '${ANALYTICS_MIGRATOR_PASSWORD:?ANALYTICS_MIGRATOR_PASSWORD is required}', APP_ROLE: analytics_app}
    depends_on: {analytics-migrations: {condition: service_completed_successfully}}
  promotion-grants:
    <<: *grant
    environment: {PGHOST: postgres, PGPORT: "5432", PGDATABASE: promotion_db, PGUSER: promotion_migrator, PGPASSWORD: '${PROMOTION_MIGRATOR_PASSWORD:?PROMOTION_MIGRATOR_PASSWORD is required}', APP_ROLE: promotion_app}
    depends_on: {promotion-migrations: {condition: service_completed_successfully}}

  catalog-api:
    <<: *api
    build: {<<: *build, args: {<<: [*sdk, *aspnet], PROJECT_PATH: src/Catalog/Catalog.Api/Catalog.Api.csproj, APP_DLL: Catalog.Api.dll}}
    environment:
      <<: [*api-env, *media-store]
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD};Include Error Detail=true'
      Catalog__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Catalog__ObjectStorage__Bucket: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Catalog__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Catalog__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Catalog__ObjectStorage__ForcePathStyle: "true"
      Catalog__ObjectStorage__MaximumPublicationBytes: "67108864"
    depends_on: {catalog-grants: {condition: service_completed_successfully}, seaweedfs: {condition: service_healthy}}
    healthcheck: *api-health
  catalog-worker:
    <<: *worker
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Catalog/Catalog.Worker/Catalog.Worker.csproj, APP_DLL: Catalog.Worker.dll}}
    environment:
      <<: *worker-env
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD};Include Error Detail=true'
      Messaging__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Messaging__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      CatalogWorker__DispatcherIdentity: catalog-outbox
      CatalogWorker__OutboxBatchSize: "50"
      CatalogWorker__MaximumDeliveryAttempts: "8"
      CatalogWorker__LeaseDurationSeconds: "120"
      CatalogWorker__EmptyDelayMilliseconds: "2000"
      CatalogWorker__MaximumPublicationAttempts: "5"
      CatalogWorker__PublicationLeaseDurationSeconds: "300"
      Catalog__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Catalog__ObjectStorage__Bucket: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Catalog__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Catalog__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Catalog__ObjectStorage__ForcePathStyle: "true"
      Catalog__ObjectStorage__MaximumPublicationBytes: "67108864"
    depends_on: {catalog-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}, seaweedfs: {condition: service_healthy}}
  catalog-media-worker:
    <<: *worker
    cpus: "2.0"
    mem_limit: 1536m
    build:
      context: .
      dockerfile: deploy/Dockerfile.catalog-media-worker
      args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Catalog/Catalog.Media.Worker/Catalog.Media.Worker.csproj, APP_DLL: Catalog.Media.Worker.dll}
    environment:
      <<: [*worker-env, *media-store]
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD};Include Error Detail=true'
      Messaging__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Messaging__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      CatalogMediaWorker__WorkerIdentity: catalog-media-worker
      CatalogMediaWorker__SystemActorId: '${CATALOG_MEDIA_SYSTEM_ACTOR_ID:?CATALOG_MEDIA_SYSTEM_ACTOR_ID is required}'
      CatalogMediaWorker__MaximumAttempts: "8"
      CatalogMediaWorker__OutboxBatchSize: "50"
      CatalogMediaWorker__LeaseDurationSeconds: "300"
      CatalogMediaWorker__EmptyDelayMilliseconds: "2000"
    depends_on: {catalog-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}, seaweedfs: {condition: service_healthy}, clamav: {condition: service_healthy}}
  query-api:
    <<: *api
    build: {<<: *build, args: {<<: [*sdk, *aspnet], PROJECT_PATH: src/Query/Query.Api/Query.Api.csproj, APP_DLL: Query.Api.dll}}
    environment:
      <<: *api-env
      ConnectionStrings__Query: 'Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD};Include Error Detail=true'
    depends_on: {query-grants: {condition: service_completed_successfully}}
    healthcheck: *api-health
  query-worker:
    <<: *worker
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Query/Query.Worker/Query.Worker.csproj, APP_DLL: Query.Worker.dll}}
    environment:
      <<: *worker-env
      ConnectionStrings__Query: 'Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD};Include Error Detail=true'
      Query__Worker__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Query__Worker__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Query__Worker__Queue: query.catalog-publication-projection
      Query__Worker__RoutingKey: catalog.publication.activated
      Query__Worker__PrefetchCount: "8"
      Query__PromotionWorker__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Query__PromotionWorker__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Query__PromotionWorker__Queue: query.promotion-placement-projection
      Query__PromotionWorker__DeadLetterExchange: aggregator.dead-letter
      Query__PromotionWorker__DeadLetterQueue: query.promotion-placement-projection.dead-letter
      Query__PromotionWorker__RoutingKey: promotion.placement.changed
      Query__PromotionWorker__PrefetchCount: "8"
      Query__PromotionWorker__DeliveryLimit: "8"
      Query__PromotionWorker__RetryDelayMilliseconds: "500"
      Query__VisibilityWorker__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Query__VisibilityWorker__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Query__VisibilityWorker__Queue: query.catalog-visibility-safety
      Query__VisibilityWorker__DeadLetterExchange: aggregator.dead-letter
      Query__VisibilityWorker__DeadLetterQueue: query.catalog-visibility-safety.dead-letter
      Query__VisibilityWorker__RoutingKey: catalog.public-visibility-suppression.changed
      Query__VisibilityWorker__PrefetchCount: "4"
      Query__VisibilityWorker__DeliveryLimit: "8"
      Query__VisibilityWorker__RetryDelayMilliseconds: "500"
      Query__Outbox__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Query__Outbox__DispatcherIdentity: query-public-read-outbox
      Query__Outbox__BatchSize: "50"
      Query__Outbox__MaximumDeliveryAttempts: "8"
      Query__Outbox__LeaseDurationSeconds: "120"
      Query__Outbox__EmptyDelayMilliseconds: "2000"
      Query__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Query__ObjectStorage__Region: '${OBJECT_STORAGE_REGION:-us-east-1}'
      Query__ObjectStorage__Bucket: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Query__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Query__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Query__ObjectStorage__ForcePathStyle: "true"
      Query__PublicationArtifact__AllowedObjectPrefix: catalog/
      Query__PublicationArtifact__MaximumArtifactBytes: "67108864"
    depends_on: {query-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}, seaweedfs: {condition: service_healthy}}
  ingestion-api:
    <<: *api
    build: {<<: *build, args: {<<: [*sdk, *aspnet], PROJECT_PATH: src/Ingestion/Ingestion.Api/Ingestion.Api.csproj, APP_DLL: Ingestion.Api.dll}}
    environment:
      <<: *api-env
      ConnectionStrings__Ingestion: 'Host=postgres;Database=ingestion_db;Username=ingestion_app;Password=${INGESTION_APP_PASSWORD};Include Error Detail=true'
      Ingestion__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Ingestion__ObjectStorage__Region: '${OBJECT_STORAGE_REGION:-us-east-1}'
      Ingestion__ObjectStorage__Bucket: '${INGESTION_BUCKET:-ingestion-packages}'
      Ingestion__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Ingestion__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Ingestion__ObjectStorage__ForcePathStyle: "true"
    depends_on: {ingestion-grants: {condition: service_completed_successfully}, seaweedfs: {condition: service_healthy}}
    healthcheck: *api-health
  ingestion-worker:
    <<: *worker
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Ingestion/Ingestion.Worker/Ingestion.Worker.csproj, APP_DLL: Ingestion.Worker.dll}}
    environment:
      <<: *worker-env
      ConnectionStrings__Ingestion: 'Host=postgres;Database=ingestion_db;Username=ingestion_app;Password=${INGESTION_APP_PASSWORD};Include Error Detail=true'
      IngestionWorker__WorkerIdentity: ingestion-validation-worker
      IngestionWorker__ValidationBatchSize: "10"
      IngestionWorker__LeaseDuration: "00:05:00"
      IngestionWorker__EmptyDelay: "00:00:02"
      IngestionWorker__CatalogDeliveryWorkerIdentity: ingestion-catalog-delivery-worker
      IngestionWorker__CatalogDeliveryBatchSize: "20"
      IngestionWorker__CatalogDeliveryLeaseDuration: "00:02:00"
      IngestionWorker__CatalogDeliveryMaximumAttempts: "8"
      IngestionWorker__CatalogDeliveryEmptyDelay: "00:00:02"
      Ingestion__CatalogProjection__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Ingestion__CatalogProjection__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Ingestion__CatalogProjection__Queue: ingestion.catalog-configuration-projection
      Ingestion__CatalogProjection__DeadLetterExchange: aggregator.dead-letter
      Ingestion__CatalogProjection__DeadLetterQueue: ingestion.catalog-configuration-projection.dead-letter
      Ingestion__CatalogProjection__RoutingKey: catalog.configuration.activated
      Ingestion__CatalogProjection__PrefetchCount: "8"
      Ingestion__CatalogProjection__DeliveryLimit: "8"
      Ingestion__CatalogProjection__RetryDelay: "00:00:00.500"
      Ingestion__CatalogCommand__BaseAddress: http://catalog-api:8080/
      Ingestion__CatalogCommand__TokenEndpoint: '${INGESTION_CATALOG_TOKEN_ENDPOINT:?INGESTION_CATALOG_TOKEN_ENDPOINT is required}'
      Ingestion__CatalogCommand__ClientId: '${INGESTION_CATALOG_CLIENT_ID:?INGESTION_CATALOG_CLIENT_ID is required}'
      Ingestion__CatalogCommand__ClientSecret: '${INGESTION_CATALOG_CLIENT_SECRET:?INGESTION_CATALOG_CLIENT_SECRET is required}'
      Ingestion__CatalogCommand__Scope: '${INGESTION_CATALOG_SCOPE:-catalog.ingestion}'
      Ingestion__CatalogCommand__RequestTimeout: "00:00:30"
      Ingestion__CatalogCommand__RefreshSkew: "00:00:30"
      Ingestion__CatalogCommand__AllowInsecureHttp: "true"
      Ingestion__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Ingestion__ObjectStorage__Region: '${OBJECT_STORAGE_REGION:-us-east-1}'
      Ingestion__ObjectStorage__Bucket: '${INGESTION_BUCKET:-ingestion-packages}'
      Ingestion__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Ingestion__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Ingestion__ObjectStorage__ForcePathStyle: "true"
    networks: [backend, egress]
    depends_on: {ingestion-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}, seaweedfs: {condition: service_healthy}, catalog-api: {condition: service_healthy}}
  analytics-api:
    <<: *api
    build: {<<: *build, args: {<<: [*sdk, *aspnet], PROJECT_PATH: src/Analytics/Analytics.Api/Analytics.Api.csproj, APP_DLL: Analytics.Api.dll}}
    environment:
      <<: *api-env
      ConnectionStrings__Analytics: 'Host=postgres;Database=analytics_db;Username=analytics_app;Password=${ANALYTICS_APP_PASSWORD};Include Error Detail=true'
    depends_on: {analytics-grants: {condition: service_completed_successfully}}
    healthcheck: *api-health
  analytics-worker:
    <<: *worker
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Analytics/Analytics.Worker/Analytics.Worker.csproj, APP_DLL: Analytics.Worker.dll}}
    environment:
      <<: *worker-env
      ConnectionStrings__Analytics: 'Host=postgres;Database=analytics_db;Username=analytics_app;Password=${ANALYTICS_APP_PASSWORD};Include Error Detail=true'
      Analytics__Aggregation__LookbackDays: "2"
      Analytics__Aggregation__PollInterval: "00:30:00"
      Analytics__Aggregation__FailureDelay: "00:00:10"
      Analytics__Aggregation__MaximumConsecutiveFailures: "5"
      Analytics__Retention__RawEventRetentionDays: "90"
      Analytics__Retention__BatchSize: "500"
      Analytics__Retention__PollInterval: "00:15:00"
      Analytics__Retention__ContinuationDelay: "00:00:01"
      Analytics__Retention__FailureDelay: "00:00:10"
      Analytics__Retention__MaximumConsecutiveFailures: "5"
      Analytics__PublicReadProjection__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Analytics__PublicReadProjection__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Analytics__PublicReadProjection__Queue: analytics.query-public-read-projection
      Analytics__PublicReadProjection__DeadLetterExchange: aggregator.dead-letter
      Analytics__PublicReadProjection__DeadLetterQueue: analytics.query-public-read-projection.dead-letter
      Analytics__PublicReadProjection__RoutingKey: query.public-read-revision.activated
      Analytics__PublicReadProjection__PrefetchCount: "8"
      Analytics__PublicReadProjection__DeliveryLimit: "8"
      Analytics__PublicReadProjection__RetryDelay: "00:00:00.500"
      Analytics__Outbox__DispatcherIdentity: analytics-promotion-usage-outbox
      Analytics__Outbox__BatchSize: "50"
      Analytics__Outbox__MaximumDeliveryAttempts: "8"
      Analytics__Outbox__LeaseDurationSeconds: "120"
      Analytics__Outbox__EmptyDelayMilliseconds: "2000"
    depends_on: {analytics-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}}
  promotion-api:
    <<: *api
    build: {<<: *build, args: {<<: [*sdk, *aspnet], PROJECT_PATH: src/Promotion/Promotion.Api/Promotion.Api.csproj, APP_DLL: Promotion.Api.dll}}
    environment:
      <<: *api-env
      ConnectionStrings__Promotion: 'Host=postgres;Database=promotion_db;Username=promotion_app;Password=${PROMOTION_APP_PASSWORD};Include Error Detail=true'
    depends_on: {promotion-grants: {condition: service_completed_successfully}}
    healthcheck: *api-health
  promotion-worker:
    <<: *worker
    build: {<<: *build, args: {<<: [*sdk, *runtime], PROJECT_PATH: src/Promotion/Promotion.Worker/Promotion.Worker.csproj, APP_DLL: Promotion.Worker.dll}}
    environment:
      <<: *worker-env
      ConnectionStrings__Promotion: 'Host=postgres;Database=promotion_db;Username=promotion_app;Password=${PROMOTION_APP_PASSWORD};Include Error Detail=true'
      Messaging__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Messaging__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      PromotionWorker__DispatcherIdentity: promotion-worker
      PromotionWorker__SystemActorId: '${PROMOTION_SYSTEM_ACTOR_ID:?PROMOTION_SYSTEM_ACTOR_ID is required}'
      PromotionWorker__TransitionBatchSize: "100"
      PromotionWorker__OutboxBatchSize: "50"
      PromotionWorker__MaximumDeliveryAttempts: "8"
      PromotionWorker__LeaseDurationSeconds: "120"
      PromotionWorker__PollDelayMilliseconds: "2000"
      Promotion__EligibilityProjection__Queue: promotion.catalog-listing-eligibility
      Promotion__EligibilityProjection__DeadLetterExchange: aggregator.dead-letter
      Promotion__EligibilityProjection__DeadLetterQueue: promotion.catalog-listing-eligibility.dead-letter
      Promotion__EligibilityProjection__RoutingKey: catalog.listing-promotion-eligibility.changed
      Promotion__EligibilityProjection__PrefetchCount: "8"
      Promotion__EligibilityProjection__DeliveryLimit: "8"
      Promotion__EligibilityProjection__RetryDelayMilliseconds: "500"
      Promotion__UsageProjection__Queue: promotion.analytics-usage
      Promotion__UsageProjection__DeadLetterExchange: aggregator.dead-letter
      Promotion__UsageProjection__DeadLetterQueue: promotion.analytics-usage.dead-letter
      Promotion__UsageProjection__RoutingKey: analytics.promotion-usage-window.closed
      Promotion__UsageProjection__PrefetchCount: "8"
      Promotion__UsageProjection__DeliveryLimit: "8"
      Promotion__UsageProjection__RetryDelayMilliseconds: "500"
    depends_on: {promotion-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}}

  reverse-proxy:
    image: '${CADDY_IMAGE:?CADDY_IMAGE is required}'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/config:size=16m,mode=0750", "/data:size=16m,mode=0750", "/tmp:size=16m,mode=1777"]
    ports: ['127.0.0.1:${BACKEND_HTTP_PORT:-8080}:8080']
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro]
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/live'], interval: 10s, timeout: 5s, retries: 6, start_period: 10s}
    depends_on:
      catalog-api: {condition: service_healthy}
      query-api: {condition: service_healthy}
      ingestion-api: {condition: service_healthy}
      analytics-api: {condition: service_healthy}
      promotion-api: {condition: service_healthy}
    pids_limit: 128
    cpus: "0.5"
    mem_limit: 256m
    networks: [edge, backend]
    logging: *log

volumes: {postgres-data: {}, rabbitmq-data: {}, seaweedfs-data: {}, clamav-signatures: {}}
networks: {edge: {}, egress: {}, backend: {internal: true}}
