      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Ingestion: 'Host=postgres;Database=ingestion_db;Username=ingestion_app;Password=${INGESTION_APP_PASSWORD};Include Error Detail=true'
      Ingestion__Authentication__Authority: '${OIDC_AUTHORITY:?OIDC_AUTHORITY is required}'
      Ingestion__Authentication__Audience: '${INGESTION_OIDC_AUDIENCE:?INGESTION_OIDC_AUDIENCE is required}'
      Ingestion__Authentication__RequireHttpsMetadata: '${OIDC_REQUIRE_HTTPS_METADATA:-true}'
      Ingestion__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Ingestion__ObjectStorage__BucketName: '${INGESTION_ARTIFACT_BUCKET:-ingestion-artifacts}'
      Ingestion__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
