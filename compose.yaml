      Ingestion__ObjectStorage__ForcePathStyle: "true"
    depends_on: {ingestion-grants: {condition: service_completed_successfully}, seaweedfs: {condition: service_healthy}}

  analytics-api:
    <<: *api
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_ASPNET_IMAGE:?DOTNET_ASPNET_IMAGE is required}'
