        APP_DLL: Analytics.Api.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Analytics: 'Host=postgres;Database=analytics_db;Username=analytics_app;Password=${ANALYTICS_APP_PASSWORD};Include Error Detail=true'
      Analytics__Authentication__Authority: '${OIDC_AUTHORITY:?OIDC_AUTHORITY is required}'
      Analytics__Authentication__Audience: '${ANALYTICS_OIDC_AUDIENCE:?ANALYTICS_OIDC_AUDIENCE is required}'
      Analytics__Authentication__RequireHttpsMetadata: '${OIDC_REQUIRE_HTTPS_METADATA:-true}'
      Analytics__AntiAbuse__Secret: '${ANALYTICS_ANTI_ABUSE_SECRET:?ANALYTICS_ANTI_ABUSE_SECRET is required}'
    depends_on: {analytics-grants: {condition: service_completed_successfully}}

  analytics-worker:
    <<: *worker
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Analytics/Analytics.Worker/Analytics.Worker.csproj
        APP_DLL: Analytics.Worker.dll
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Analytics: 'Host=postgres;Database=analytics_db;Username=analytics_app;Password=${ANALYTICS_APP_PASSWORD};Include Error Detail=true'
      AnalyticsWorker__Identity: analytics-worker
      AnalyticsWorker__BatchSize: "1000"
      AnalyticsWorker__EmptyDelayMilliseconds: "5000"
    depends_on: {analytics-grants: {condition: service_completed_successfully}}

  promotion-api:
    <<: *api
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_ASPNET_IMAGE:?DOTNET_ASPNET_IMAGE is required}'
        PROJECT_PATH: src/Promotion/Promotion.Api/Promotion.Api.csproj
        APP_DLL: Promotion.Api.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Promotion: 'Host=postgres;Database=promotion_db;Username=promotion_app;Password=${PROMOTION_APP_PASSWORD};Include Error Detail=true'
      Promotion__Authentication__Authority: '${OIDC_AUTHORITY:?OIDC_AUTHORITY is required}'
      Promotion__Authentication__Audience: '${PROMOTION_OIDC_AUDIENCE:?PROMOTION_OIDC_AUDIENCE is required}'
      Promotion__Authentication__RequireHttpsMetadata: '${OIDC_REQUIRE_HTTPS_METADATA:-true}'
    depends_on: {promotion-grants: {condition: service_completed_successfully}}

  promotion-worker:
    <<: *worker
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Promotion/Promotion.Worker/Promotion.Worker.csproj
        APP_DLL: Promotion.Worker.dll
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Promotion: 'Host=postgres;Database=promotion_db;Username=promotion_app;Password=${PROMOTION_APP_PASSWORD};Include Error Detail=true'
      Messaging__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Messaging__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      PromotionWorker__Identity: promotion-worker
      PromotionWorker__BatchSize: "32"
      PromotionWorker__MaximumDeliveryAttempts: "8"
      PromotionWorker__LeaseDurationSeconds: "120"
      PromotionWorker__EmptyDelayMilliseconds: "2000"
    depends_on: {promotion-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}}

  clamav:
    image: '${CLAMAV_IMAGE:?CLAMAV_IMAGE is required}'
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    tmpfs: [/tmp:size=256m,mode=1777]
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: [CMD-SHELL, 'printf "PING\n" | nc -w 5 127.0.0.1 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging:
      driver: local
      options: {max-size: 20m, max-file: 5}

  reverse-proxy:
    image: '${CADDY_IMAGE:?CADDY_IMAGE is required}'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs: [/data:size=64m,mode=1777, /config:size=64m,mode=1777]
    volumes: [./deploy/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro]
    networks: [backend]
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      catalog-command-api: {condition: service_healthy}
      catalog-query-api: {condition: service_healthy}
      ingestion-api: {condition: service_healthy}
      analytics-api: {condition: service_healthy}
      promotion-api: {condition: service_healthy}
    logging:
      driver: local
      options: {max-size: 20m, max-file: 5}

  catalog-migrate:
    <<: *migration
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Catalog/Catalog.Migrations/Catalog.Migrations.csproj
        APP_DLL: Catalog.Migrations.dll
    environment:
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_migrator;Password=${CATALOG_MIGRATOR_PASSWORD};Include Error Detail=true'
    depends_on: {catalog-grants: {condition: service_completed_successfully}}

  query-migrate:
    <<: *migration
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Query/Query.Migrations/Query.Migrations.csproj
        APP_DLL: Query.Migrations.dll
    environment:
      ConnectionStrings__Query: 'Host=postgres;Database=query_db;Username=query_migrator;Password=${QUERY_MIGRATOR_PASSWORD};Include Error Detail=true'
    depends_on: {query-grants: {condition: service_completed_successfully}}

  ingestion-migrate:
    <<: *migration
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Ingestion/Ingestion.Migrations/Ingestion.Migrations.csproj
        APP_DLL: Ingestion.Migrations.dll
    environment:
      ConnectionStrings__Ingestion: 'Host=postgres;Database=ingestion_db;Username=ingestion_migrator;Password=${INGESTION_MIGRATOR_PASSWORD};Include Error Detail=true'
    depends_on: {ingestion-grants: {condition: service_completed_successfully}}

  analytics-migrate:
    <<: *migration
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj
        APP_DLL: Analytics.Migrations.dll
    environment:
      ConnectionStrings__Analytics: 'Host=postgres;Database=analytics_db;Username=analytics_migrator;Password=${ANALYTICS_MIGRATOR_PASSWORD};Include Error Detail=true'
    depends_on: {analytics-grants: {condition: service_completed_successfully}}

  promotion-migrate:
    <<: *migration
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Promotion/Promotion.Migrations/Promotion.Migrations.csproj
        APP_DLL: Promotion.Migrations.dll
    environment:
      ConnectionStrings__Promotion: 'Host=postgres;Database=promotion_db;Username=promotion_migrator;Password=${PROMOTION_MIGRATOR_PASSWORD};Include Error Detail=true'
    depends_on: {promotion-grants: {condition: service_completed_successfully}}

networks:
  backend:
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
  clamav-data:
