x-service: &service
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=64m,mode=1777]
  pids_limit: 256
  stop_grace_period: 30s
  networks: [backend]
  logging:
    driver: local
    options: {max-size: 20m, max-file: 5}

x-api: &api
  <<: *service
  restart: unless-stopped
  cpus: "1.0"
  mem_limit: 768m
  healthcheck:
    test: [CMD-SHELL, /app/HealthProbe http://127.0.0.1:8080/health/live]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 20s

x-worker: &worker
  <<: *service
  restart: unless-stopped
  cpus: "1.0"
  mem_limit: 768m
  healthcheck:
    test: [CMD-SHELL, 'test "$(cat /proc/1/comm)" = dotnet']
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 15s

x-migration: &migration
  <<: *service
  restart: "no"
  cpus: "0.5"
  mem_limit: 256m
  profiles: [migrate]

services:
  postgres:
    image: '${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}'
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_SUPERUSER_PASSWORD}'
      CATALOG_APP_PASSWORD: '${CATALOG_APP_PASSWORD}'
      CATALOG_MIGRATOR_PASSWORD: '${CATALOG_MIGRATOR_PASSWORD}'
      QUERY_APP_PASSWORD: '${QUERY_APP_PASSWORD}'
      QUERY_MIGRATOR_PASSWORD: '${QUERY_MIGRATOR_PASSWORD}'
      INGESTION_APP_PASSWORD: '${INGESTION_APP_PASSWORD}'
      INGESTION_MIGRATOR_PASSWORD: '${INGESTION_MIGRATOR_PASSWORD}'
      ANALYTICS_APP_PASSWORD: '${ANALYTICS_APP_PASSWORD}'
      ANALYTICS_MIGRATOR_PASSWORD: '${ANALYTICS_MIGRATOR_PASSWORD}'
      PROMOTION_APP_PASSWORD: '${PROMOTION_APP_PASSWORD}'
      PROMOTION_MIGRATOR_PASSWORD: '${PROMOTION_MIGRATOR_PASSWORD}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-owners.sql:/docker-entrypoint-initdb.d/10-init-owners.sql:ro
    networks: [backend]
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 10s
      timeout: 5s
      retries: 10
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: 20m, max-file: 5}

  rabbitmq:
    image: '${RABBITMQ_IMAGE:?RABBITMQ_IMAGE is required}'
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD}'
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit quorum_cluster_size 1'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [backend]
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: 20m, max-file: 5}

  seaweedfs:
    image: '${SEAWEEDFS_IMAGE:?SEAWEEDFS_IMAGE is required}'
    restart: unless-stopped
    command: server -s3 -dir=/data -s3.port=8333
    volumes: [seaweedfs-data:/data]
    networks: [backend]
    ports:
      - 127.0.0.1:8333:8333
      - 127.0.0.1:9333:9333
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9333/cluster/status]
      interval: 10s
      timeout: 5s
      retries: 10
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options: {max-size: 20m, max-file: 5}

  catalog-grants:
    <<: *migration
    profiles: [core, migrate]
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Catalog/Catalog.Migrations/Catalog.Migrations.csproj
        APP_DLL: Catalog.Migrations.dll
    command: [--provision, /app/deploy/database-owner-manifest.json]
    environment:
      AGGREGATOR_DB_ADMIN_CONNECTION: 'Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};Include Error Detail=true'
      AGGREGATOR_DB_OWNER_MANIFEST: /app/deploy/database-owner-manifest.json
      POSTGRES_SUPERUSER_PASSWORD: '${POSTGRES_SUPERUSER_PASSWORD}'
      CATALOG_APP_PASSWORD: '${CATALOG_APP_PASSWORD}'
      CATALOG_MIGRATOR_PASSWORD: '${CATALOG_MIGRATOR_PASSWORD}'
    depends_on: {postgres: {condition: service_healthy}}

  query-grants:
    <<: *migration
    profiles: [core, migrate]
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Query/Query.Migrations/Query.Migrations.csproj
        APP_DLL: Query.Migrations.dll
    command: [--provision, /app/deploy/database-owner-manifest.json]
    environment:
      AGGREGATOR_DB_ADMIN_CONNECTION: 'Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};Include Error Detail=true'
      AGGREGATOR_DB_OWNER_MANIFEST: /app/deploy/database-owner-manifest.json
      POSTGRES_SUPERUSER_PASSWORD: '${POSTGRES_SUPERUSER_PASSWORD}'
      QUERY_APP_PASSWORD: '${QUERY_APP_PASSWORD}'
      QUERY_MIGRATOR_PASSWORD: '${QUERY_MIGRATOR_PASSWORD}'
    depends_on: {postgres: {condition: service_healthy}}

  ingestion-grants:
    <<: *migration
    profiles: [core, migrate]
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Ingestion/Ingestion.Migrations/Ingestion.Migrations.csproj
        APP_DLL: Ingestion.Migrations.dll
    command: [--provision, /app/deploy/database-owner-manifest.json]
    environment:
      AGGREGATOR_DB_ADMIN_CONNECTION: 'Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};Include Error Detail=true'
      AGGREGATOR_DB_OWNER_MANIFEST: /app/deploy/database-owner-manifest.json
      POSTGRES_SUPERUSER_PASSWORD: '${POSTGRES_SUPERUSER_PASSWORD}'
      INGESTION_APP_PASSWORD: '${INGESTION_APP_PASSWORD}'
      INGESTION_MIGRATOR_PASSWORD: '${INGESTION_MIGRATOR_PASSWORD}'
    depends_on: {postgres: {condition: service_healthy}}

  analytics-grants:
    <<: *migration
    profiles: [core, migrate]
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj
        APP_DLL: Analytics.Migrations.dll
    command: [--provision, /app/deploy/database-owner-manifest.json]
    environment:
      AGGREGATOR_DB_ADMIN_CONNECTION: 'Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};Include Error Detail=true'
      AGGREGATOR_DB_OWNER_MANIFEST: /app/deploy/database-owner-manifest.json
      POSTGRES_SUPERUSER_PASSWORD: '${POSTGRES_SUPERUSER_PASSWORD}'
      ANALYTICS_APP_PASSWORD: '${ANALYTICS_APP_PASSWORD}'
      ANALYTICS_MIGRATOR_PASSWORD: '${ANALYTICS_MIGRATOR_PASSWORD}'
    depends_on: {postgres: {condition: service_healthy}}

  promotion-grants:
    <<: *migration
    profiles: [core, migrate]
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Promotion/Promotion.Migrations/Promotion.Migrations.csproj
        APP_DLL: Promotion.Migrations.dll
    command: [--provision, /app/deploy/database-owner-manifest.json]
    environment:
      AGGREGATOR_DB_ADMIN_CONNECTION: 'Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};Include Error Detail=true'
      AGGREGATOR_DB_OWNER_MANIFEST: /app/deploy/database-owner-manifest.json
      POSTGRES_SUPERUSER_PASSWORD: '${POSTGRES_SUPERUSER_PASSWORD}'
      PROMOTION_APP_PASSWORD: '${PROMOTION_APP_PASSWORD}'
      PROMOTION_MIGRATOR_PASSWORD: '${PROMOTION_MIGRATOR_PASSWORD}'
    depends_on: {postgres: {condition: service_healthy}}

  catalog-command-api:
    <<: *api
    cpus: "1.5"
    mem_limit: 1024m
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_ASPNET_IMAGE:?DOTNET_ASPNET_IMAGE is required}'
        PROJECT_PATH: src/Catalog/Catalog.Api/Catalog.Api.csproj
        APP_DLL: Catalog.Api.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: '${ASPNETCORE_ENVIRONMENT:-Production}'
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD};Include Error Detail=true'
      Catalog__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Catalog__ObjectStorage__BucketName: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Catalog__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Catalog__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Catalog__ObjectStorage__ForcePathStyle: "true"
      Catalog__ObjectStorage__MaximumPublicationBytes: "67108864"
      Catalog__PublicBaseUrl: '${CATALOG_PUBLIC_BASE_URL:?CATALOG_PUBLIC_BASE_URL is required}'
      Catalog__Authentication__Authority: '${OIDC_AUTHORITY:?OIDC_AUTHORITY is required}'
      Catalog__Authentication__Audience: '${CATALOG_OIDC_AUDIENCE:?CATALOG_OIDC_AUDIENCE is required}'
      Catalog__Authentication__RequireHttpsMetadata: '${OIDC_REQUIRE_HTTPS_METADATA:-true}'
    depends_on: {catalog-grants: {condition: service_completed_successfully}, seaweedfs: {condition: service_healthy}}

  catalog-worker:
    <<: *worker
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Catalog/Catalog.Worker/Catalog.Worker.csproj
        APP_DLL: Catalog.Worker.dll
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD};Include Error Detail=true'
      Messaging__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Messaging__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      CatalogWorker__DispatcherIdentity: catalog-worker
      CatalogWorker__BatchSize: "50"
      CatalogWorker__MaximumDeliveryAttempts: "8"
      CatalogWorker__LeaseDurationSeconds: "120"
      CatalogWorker__EmptyDelayMilliseconds: "2000"
      CatalogWorker__MaximumPublicationAttempts: "5"
      CatalogWorker__PublicationLeaseDurationSeconds: "300"
      Catalog__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Catalog__ObjectStorage__BucketName: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Catalog__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Catalog__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Catalog__ObjectStorage__ForcePathStyle: "true"
      Catalog__ObjectStorage__MaximumPublicationBytes: "67108864"
    depends_on: {catalog-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}, seaweedfs: {condition: service_healthy}}

  catalog-media-worker:
    <<: *worker
    cpus: "2.0"
    mem_limit: 1536m
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Catalog/Catalog.Media.Worker/Catalog.Media.Worker.csproj
        APP_DLL: Catalog.Media.Worker.dll
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Catalog: 'Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD};Include Error Detail=true'
      Catalog__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Catalog__ObjectStorage__BucketName: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Catalog__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Catalog__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Catalog__ObjectStorage__ForcePathStyle: "true"
      CatalogMediaWorker__Identity: catalog-media-worker
      CatalogMediaWorker__LeaseSeconds: "300"
      CatalogMediaWorker__BatchSize: "16"
      CatalogMediaWorker__EmptyDelayMilliseconds: "2000"
      CatalogMediaWorker__ClamAvHost: clamav
      CatalogMediaWorker__ClamAvPort: "3310"
      CatalogMediaWorker__ScanTimeoutSeconds: "120"
      CatalogMediaWorker__ImageMagickExecutable: /usr/bin/magick
      CatalogMediaWorker__ImageMagickTimeoutSeconds: "120"
      CatalogMediaWorker__MaximumOutputBytes: "33554432"
      CatalogMediaWorker__MaximumDimension: "4096"
      CatalogMediaWorker__MaximumPixels: "16777216"
    depends_on: {catalog-grants: {condition: service_completed_successfully}, seaweedfs: {condition: service_healthy}, clamav: {condition: service_healthy}}

  catalog-query-api:
    <<: *api
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_ASPNET_IMAGE:?DOTNET_ASPNET_IMAGE is required}'
        PROJECT_PATH: src/Query/Query.Api/Query.Api.csproj
        APP_DLL: Query.Api.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Query: 'Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD};Include Error Detail=true'
      Query__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Query__ObjectStorage__BucketName: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Query__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Query__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Query__ObjectStorage__ForcePathStyle: "true"
    depends_on: {query-grants: {condition: service_completed_successfully}}

  catalog-query-worker:
    <<: *worker
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_RUNTIME_IMAGE:?DOTNET_RUNTIME_IMAGE is required}'
        PROJECT_PATH: src/Query/Query.Worker/Query.Worker.csproj
        APP_DLL: Query.Worker.dll
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: '${OTEL_EXPORTER_OTLP_ENDPOINT:-}'
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__Query: 'Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD};Include Error Detail=true'
      Messaging__BrokerUri: 'amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/'
      Messaging__Exchange: '${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}'
      Messaging__PublicationQueue: '${QUERY_PUBLICATION_QUEUE:-query.catalog-publication}'
      Messaging__PromotionQueue: '${QUERY_PROMOTION_QUEUE:-query.promotion-overlay}'
      Messaging__VisibilityQueue: '${QUERY_VISIBILITY_QUEUE:-query.visibility-safety}'
      Messaging__DeadLetterExchange: '${RABBITMQ_DEAD_LETTER_EXCHANGE:-aggregator.dead-letter}'
      QueryWorker__ConsumerIdentity: catalog-query-worker
      QueryWorker__MaximumDeliveryAttempts: "8"
      QueryWorker__MaximumRedeliveryCount: "8"
      QueryWorker__PrefetchCount: "8"
      QueryWorker__EmptyDelayMilliseconds: "2000"
      QueryWorker__PublicationLeaseDurationSeconds: "300"
      QueryWorker__PromotionLeaseDurationSeconds: "120"
      QueryWorker__VisibilityLeaseDurationSeconds: "120"
      Query__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Query__ObjectStorage__BucketName: '${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}'
      Query__ObjectStorage__AccessKey: '${OBJECT_STORAGE_ACCESS_KEY}'
      Query__ObjectStorage__SecretKey: '${OBJECT_STORAGE_SECRET_KEY}'
      Query__ObjectStorage__ForcePathStyle: "true"
    depends_on: {query-grants: {condition: service_completed_successfully}, rabbitmq: {condition: service_healthy}, seaweedfs: {condition: service_healthy}}

  ingestion-api:
    <<: *api
    build:
      context: .
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        DOTNET_SDK_IMAGE: '${DOTNET_SDK_IMAGE:?DOTNET_SDK_IMAGE is required}'
        DOTNET_RUNTIME_IMAGE: '${DOTNET_ASPNET_IMAGE:?DOTNET_ASPNET_IMAGE is required}'
