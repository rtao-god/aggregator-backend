services:
  promotion-worker:
    build:
      context: ..
      dockerfile: src/Promotion/Promotion.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Promotion: ${PROMOTION_APP_CONNECTION_STRING:?PROMOTION_APP_CONNECTION_STRING is required}
      Messaging__BrokerUri: ${RABBITMQ_BROKER_URI:?RABBITMQ_BROKER_URI is required}
      Messaging__Exchange: ${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}
      PromotionWorker__DispatcherIdentity: ${PROMOTION_WORKER_IDENTITY:-promotion-worker-local}
      PromotionWorker__SystemActorId: ${PROMOTION_SYSTEM_ACTOR_ID:?PROMOTION_SYSTEM_ACTOR_ID is required}
      PromotionWorker__TransitionBatchSize: ${PROMOTION_TRANSITION_BATCH_SIZE:-100}
      PromotionWorker__OutboxBatchSize: ${PROMOTION_OUTBOX_BATCH_SIZE:-50}
      PromotionWorker__MaximumDeliveryAttempts: ${PROMOTION_MAXIMUM_DELIVERY_ATTEMPTS:-8}
      PromotionWorker__LeaseDurationSeconds: ${PROMOTION_LEASE_DURATION_SECONDS:-120}
      PromotionWorker__PollDelayMilliseconds: ${PROMOTION_POLL_DELAY_MILLISECONDS:-2000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - backend

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK_NAME:-aggregator-backend}
