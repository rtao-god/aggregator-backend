x-runtime-environment: &runtime-environment
  ASPNETCORE_URLS: http://+:8080
  Authentication__Authority: ${AUTHENTICATION_AUTHORITY:?AUTHENTICATION_AUTHORITY is required}
  Authentication__RequireHttpsMetadata: ${AUTHENTICATION_REQUIRE_HTTPS_METADATA:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-object-storage-environment: &object-storage-environment
  CatalogMedia__ObjectStorage__ServiceUrl: http://seaweedfs:8333
  CatalogMedia__ObjectStorage__Region: ${OBJECT_STORAGE_REGION:-us-east-1}
  CatalogMedia__ObjectStorage__Bucket: ${CATALOG_MEDIA_BUCKET:-catalog-media}
  CatalogMedia__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
  CatalogMedia__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
  CatalogMedia__ObjectStorage__ForcePathStyle: "true"

services:
  postgres:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE must be an explicitly pinned image reference}
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      CATALOG_APP_PASSWORD: ${CATALOG_APP_PASSWORD:?CATALOG_APP_PASSWORD is required}
      CATALOG_MIGRATOR_PASSWORD: ${CATALOG_MIGRATOR_PASSWORD:?CATALOG_MIGRATOR_PASSWORD is required}
      QUERY_APP_PASSWORD: ${QUERY_APP_PASSWORD:?QUERY_APP_PASSWORD is required}
      QUERY_MIGRATOR_PASSWORD: ${QUERY_MIGRATOR_PASSWORD:?QUERY_MIGRATOR_PASSWORD is required}
      INGESTION_APP_PASSWORD: ${INGESTION_APP_PASSWORD:?INGESTION_APP_PASSWORD is required}
      INGESTION_MIGRATOR_PASSWORD: ${INGESTION_MIGRATOR_PASSWORD:?INGESTION_MIGRATOR_PASSWORD is required}
      ANALYTICS_APP_PASSWORD: ${ANALYTICS_APP_PASSWORD:?ANALYTICS_APP_PASSWORD is required}
      ANALYTICS_MIGRATOR_PASSWORD: ${ANALYTICS_MIGRATOR_PASSWORD:?ANALYTICS_MIGRATOR_PASSWORD is required}
      PROMOTION_APP_PASSWORD: ${PROMOTION_APP_PASSWORD:?PROMOTION_APP_PASSWORD is required}
      PROMOTION_MIGRATOR_PASSWORD: ${PROMOTION_MIGRATOR_PASSWORD:?PROMOTION_MIGRATOR_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE must be an explicitly pinned image reference}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?SEAWEEDFS_IMAGE must be an explicitly pinned image reference}
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      S3_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat >/tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "aggregator-backend",
              "credentials": [
                {
                  "accessKey": "$${S3_ACCESS_KEY}",
                  "secretKey": "$${S3_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -ip=seaweedfs -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    networks: [backend]

  object-storage-init:
    image: ${AWS_CLI_IMAGE:?AWS_CLI_IMAGE must be an explicitly pinned image reference}
    restart: "no"
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts} 2>/dev/null || true
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${CATALOG_MEDIA_BUCKET:-catalog-media} 2>/dev/null || true
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${INGESTION_BUCKET:-ingestion-packages} 2>/dev/null || true
    networks: [backend]

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE must be an explicitly pinned image reference}
    restart: unless-stopped
    expose: ["3310"]
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks: [backend]

  catalog-migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Catalog/Catalog.Migrations/Catalog.Migrations.csproj
        ASSEMBLY_NAME: Catalog.Migrations.dll
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      CATALOG_MIGRATOR_CONNECTION_STRING: Host=postgres;Database=catalog_db;Username=catalog_migrator;Password=${CATALOG_MIGRATOR_PASSWORD};Include Error Detail=true
    networks: [backend]

  catalog-media-migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Catalog/Catalog.Media.Migrations/Catalog.Media.Migrations.csproj
        ASSEMBLY_NAME: Catalog.Media.Migrations.dll
    restart: "no"
    depends_on:
      catalog-migrations: { condition: service_completed_successfully }
    environment:
      CATALOG_MEDIA_MIGRATOR_CONNECTION_STRING: Host=postgres;Database=catalog_db;Username=catalog_migrator;Password=${CATALOG_MIGRATOR_PASSWORD};Include Error Detail=true
    networks: [backend]

  query-migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Query/Query.Migrations/Query.Migrations.csproj
        ASSEMBLY_NAME: Query.Migrations.dll
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      QUERY_MIGRATOR_CONNECTION_STRING: Host=postgres;Database=query_db;Username=query_migrator;Password=${QUERY_MIGRATOR_PASSWORD};Include Error Detail=true
    networks: [backend]

  ingestion-migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Ingestion/Ingestion.Migrations/Ingestion.Migrations.csproj
        ASSEMBLY_NAME: Ingestion.Migrations.dll
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      INGESTION_MIGRATOR_CONNECTION_STRING: Host=postgres;Database=ingestion_db;Username=ingestion_migrator;Password=${INGESTION_MIGRATOR_PASSWORD};Include Error Detail=true
    networks: [backend]

  analytics-migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj
        ASSEMBLY_NAME: Analytics.Migrations.dll
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ANALYTICS_MIGRATOR_CONNECTION_STRING: Host=postgres;Database=analytics_db;Username=analytics_migrator;Password=${ANALYTICS_MIGRATOR_PASSWORD};Include Error Detail=true
    networks: [backend]

  promotion-migrations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Promotion/Promotion.Migrations/Promotion.Migrations.csproj
        ASSEMBLY_NAME: Promotion.Migrations.dll
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PROMOTION_MIGRATOR_CONNECTION_STRING: Host=postgres;Database=promotion_db;Username=promotion_migrator;Password=${PROMOTION_MIGRATOR_PASSWORD};Include Error Detail=true
    networks: [backend]

  catalog-grants:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE must be an explicitly pinned image reference}
    restart: "no"
    depends_on:
      catalog-media-migrations: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://catalog_migrator:${CATALOG_MIGRATOR_PASSWORD}@postgres/catalog_db
      APP_ROLE: catalog_app
    entrypoint: ["/bin/bash", "/grants/grant-context.sh"]
    volumes:
      - ./postgres:/grants:ro
    networks: [backend]

  query-grants:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE must be an explicitly pinned image reference}
    restart: "no"
    depends_on:
      query-migrations: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://query_migrator:${QUERY_MIGRATOR_PASSWORD}@postgres/query_db
      APP_ROLE: query_app
    entrypoint: ["/bin/bash", "/grants/grant-context.sh"]
    volumes:
      - ./postgres:/grants:ro
    networks: [backend]

  ingestion-grants:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE must be an explicitly pinned image reference}
    restart: "no"
    depends_on:
      ingestion-migrations: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://ingestion_migrator:${INGESTION_MIGRATOR_PASSWORD}@postgres/ingestion_db
      APP_ROLE: ingestion_app
    entrypoint: ["/bin/bash", "/grants/grant-context.sh"]
    volumes:
      - ./postgres:/grants:ro
    networks: [backend]

  analytics-grants:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE must be an explicitly pinned image reference}
    restart: "no"
    depends_on:
      analytics-migrations: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://analytics_migrator:${ANALYTICS_MIGRATOR_PASSWORD}@postgres/analytics_db
      APP_ROLE: analytics_app
    entrypoint: ["/bin/bash", "/grants/grant-context.sh"]
    volumes:
      - ./postgres:/grants:ro
    networks: [backend]

  promotion-grants:
    image: ${POSTGIS_IMAGE:?POSTGIS_IMAGE must be an explicitly pinned image reference}
    restart: "no"
    depends_on:
      promotion-migrations: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://promotion_migrator:${PROMOTION_MIGRATOR_PASSWORD}@postgres/promotion_db
      APP_ROLE: promotion_app
    entrypoint: ["/bin/bash", "/grants/grant-context.sh"]
    volumes:
      - ./postgres:/grants:ro
    networks: [backend]

  catalog-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Catalog/Catalog.Api/Catalog.Api.csproj
        ASSEMBLY_NAME: Catalog.Api.dll
    restart: unless-stopped
    depends_on:
      catalog-grants: { condition: service_completed_successfully }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      <<: *runtime-environment
      ConnectionStrings__Catalog: Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD}
      Catalog__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Catalog__ObjectStorage__Region: ${OBJECT_STORAGE_REGION:-us-east-1}
      Catalog__ObjectStorage__BucketName: ${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}
      Catalog__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY}
      Catalog__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY}
      Catalog__ObjectStorage__ForcePathStyle: "true"
    networks: [backend]

  catalog-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Catalog/Catalog.Worker/Catalog.Worker.csproj
        ASSEMBLY_NAME: Catalog.Worker.dll
    restart: unless-stopped
    depends_on:
      catalog-grants: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD}
      Messaging__BrokerUri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Messaging__Exchange: ${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}
      CatalogWorker__DispatcherIdentity: catalog-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  catalog-media-api:
    build:
      context: ..
      dockerfile: src/Catalog/Catalog.Media.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      catalog-grants: { condition: service_completed_successfully }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      <<: [*runtime-environment, *object-storage-environment]
      ConnectionStrings__Catalog: Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD}
    networks: [backend]

  catalog-media-worker:
    build:
      context: ..
      dockerfile: src/Catalog/Catalog.Media.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      catalog-grants: { condition: service_completed_successfully }
      object-storage-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      clamav: { condition: service_started }
    environment:
      <<: *object-storage-environment
      ConnectionStrings__Catalog: Host=postgres;Database=catalog_db;Username=catalog_app;Password=${CATALOG_APP_PASSWORD}
      Messaging__BrokerUri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Messaging__Exchange: ${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}
      CatalogMediaWorker__WorkerIdentity: catalog-media-worker
      CatalogMediaWorker__SystemActorId: ${CATALOG_MEDIA_SYSTEM_ACTOR_ID:?CATALOG_MEDIA_SYSTEM_ACTOR_ID is required}
      CatalogMediaWorker__ClamAvHost: clamav
      CatalogMediaWorker__ClamAvPort: 3310
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  query-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Query/Query.Api/Query.Api.csproj
        ASSEMBLY_NAME: Query.Api.dll
    restart: unless-stopped
    depends_on:
      query-grants: { condition: service_completed_successfully }
    environment:
      <<: *runtime-environment
      ConnectionStrings__Query: Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD}
    networks: [backend]

  query-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Query/Query.Worker/Query.Worker.csproj
        ASSEMBLY_NAME: Query.Worker.dll
    restart: unless-stopped
    depends_on:
      query-grants: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      ConnectionStrings__Query: Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD}
      QueryWorker__BrokerUri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      QueryWorker__Exchange: ${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}
      Query__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Query__ObjectStorage__Bucket: ${CATALOG_ARTIFACT_BUCKET:-catalog-artifacts}
      Query__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY}
      Query__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  query-promotion-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Query/Query.PromotionWorker/Query.PromotionWorker.csproj
        ASSEMBLY_NAME: Query.PromotionWorker.dll
    restart: unless-stopped
    depends_on:
      query-grants: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    environment:
      ConnectionStrings__Query: Host=postgres;Database=query_db;Username=query_app;Password=${QUERY_APP_PASSWORD}
      QueryPromotionWorker__BrokerUri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      QueryPromotionWorker__Exchange: ${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  ingestion-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Ingestion/Ingestion.Api/Ingestion.Api.csproj
        ASSEMBLY_NAME: Ingestion.Api.dll
    restart: unless-stopped
    depends_on:
      ingestion-grants: { condition: service_completed_successfully }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      <<: *runtime-environment
      ConnectionStrings__Ingestion: Host=postgres;Database=ingestion_db;Username=ingestion_app;Password=${INGESTION_APP_PASSWORD}
      Ingestion__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Ingestion__ObjectStorage__Region: ${OBJECT_STORAGE_REGION:-us-east-1}
      Ingestion__ObjectStorage__Bucket: ${INGESTION_BUCKET:-ingestion-packages}
      Ingestion__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY}
      Ingestion__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY}
      Ingestion__ObjectStorage__ForcePathStyle: "true"
    networks: [backend]

  ingestion-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Ingestion/Ingestion.Worker/Ingestion.Worker.csproj
        ASSEMBLY_NAME: Ingestion.Worker.dll
    restart: unless-stopped
    depends_on:
      ingestion-grants: { condition: service_completed_successfully }
      object-storage-init: { condition: service_completed_successfully }
    environment:
      ConnectionStrings__Ingestion: Host=postgres;Database=ingestion_db;Username=ingestion_app;Password=${INGESTION_APP_PASSWORD}
      IngestionWorker__WorkerIdentity: ingestion-validation-worker
      IngestionWorker__ValidationBatchSize: "10"
      IngestionWorker__LeaseDuration: "00:05:00"
      IngestionWorker__EmptyDelay: "00:00:02"
      IngestionWorker__SystemActorId: ${INGESTION_SYSTEM_ACTOR_ID:?INGESTION_SYSTEM_ACTOR_ID is required}
      Ingestion__ObjectStorage__ServiceUrl: http://seaweedfs:8333
      Ingestion__ObjectStorage__Region: ${OBJECT_STORAGE_REGION:-us-east-1}
      Ingestion__ObjectStorage__Bucket: ${INGESTION_BUCKET:-ingestion-packages}
      Ingestion__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY}
      Ingestion__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY}
      Ingestion__ObjectStorage__ForcePathStyle: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  analytics-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Analytics/Analytics.Api/Analytics.Api.csproj
        ASSEMBLY_NAME: Analytics.Api.dll
    restart: unless-stopped
    depends_on:
      analytics-grants: { condition: service_completed_successfully }
    environment:
      <<: *runtime-environment
      ConnectionStrings__Analytics: Host=postgres;Database=analytics_db;Username=analytics_app;Password=${ANALYTICS_APP_PASSWORD}
    networks: [backend]

  analytics-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Analytics/Analytics.Worker/Analytics.Worker.csproj
        ASSEMBLY_NAME: Analytics.Worker.dll
    restart: unless-stopped
    depends_on:
      analytics-grants: { condition: service_completed_successfully }
    environment:
      ConnectionStrings__Analytics: Host=postgres;Database=analytics_db;Username=analytics_app;Password=${ANALYTICS_APP_PASSWORD}
      AnalyticsWorker__BatchSize: ${ANALYTICS_BATCH_SIZE:-5000}
      AnalyticsWorker__CompletedDayLag: ${ANALYTICS_COMPLETED_DAY_LAG:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  promotion-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dotnet-service
      args:
        PROJECT_PATH: src/Promotion/Promotion.Api/Promotion.Api.csproj
        ASSEMBLY_NAME: Promotion.Api.dll
    restart: unless-stopped
    depends_on:
      promotion-grants: { condition: service_completed_successfully }
    environment:
      <<: *runtime-environment
      ConnectionStrings__Promotion: Host=postgres;Database=promotion_db;Username=promotion_app;Password=${PROMOTION_APP_PASSWORD}
    networks: [backend]

  promotion-worker:
    build:
      context: ..
      dockerfile: src/Promotion/Promotion.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      promotion-grants: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    environment:
      ConnectionStrings__Promotion: Host=postgres;Database=promotion_db;Username=promotion_app;Password=${PROMOTION_APP_PASSWORD}
      Messaging__BrokerUri: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Messaging__Exchange: ${RABBITMQ_EVENTS_EXCHANGE:-aggregator.events}
      PromotionWorker__DispatcherIdentity: promotion-worker
      PromotionWorker__SystemActorId: ${PROMOTION_SYSTEM_ACTOR_ID:?PROMOTION_SYSTEM_ACTOR_ID is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks: [backend]

  reverse-proxy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be an explicitly pinned image reference}
    restart: unless-stopped
    depends_on:
      - catalog-api
      - catalog-media-api
      - query-api
      - ingestion-api
      - analytics-api
      - promotion-api
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [backend]

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
  clamav-signatures:

networks:
  backend:
    name: ${BACKEND_NETWORK_NAME:-aggregator-backend}
