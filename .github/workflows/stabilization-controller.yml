name: Serialize backend stabilization gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilization-controller.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  statuses: write

concurrency:
  group: backend-stabilization-controller
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Run causal gates in dependency order
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const startedAt = new Date();

            async function getWorkflowOrNull(workflow_id) {
              try {
                const { data } = await github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id
                });
                return data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function dispatchAndWait(workflow_id, label, required = true) {
              const workflow = await getWorkflowOrNull(workflow_id);
              if (!workflow) {
                if (required) {
                  throw new Error(`${label} workflow '${workflow_id}' is missing before proof.`);
                }
                core.info(`${label}: '${workflow_id}' is already removed; continuing to the authoritative downstream proof.`);
                return null;
              }
              if (workflow.state !== 'active') {
                throw new Error(`${label} workflow '${workflow_id}' is ${workflow.state}.`);
              }

              const dispatchStartedAt = new Date();
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main'
              });
              core.info(`${label}: dispatched ${workflow_id}.`);

              let run = null;
              for (let attempt = 0; attempt < 120; attempt++) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  branch: 'main',
                  event: 'workflow_dispatch',
                  per_page: 20
                });
                run = data.workflow_runs
                  .filter(candidate => new Date(candidate.created_at) >= dispatchStartedAt)
                  .sort((left, right) => right.id - left.id)[0] ?? null;
                if (run) break;
                await sleep(5000);
              }
              if (!run) {
                throw new Error(`${label}: dispatched run was not observed.`);
              }

              for (let attempt = 0; attempt < 720; attempt++) {
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                run = data;
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    throw new Error(
                      `${label} failed with '${run.conclusion}': ${run.html_url}`);
                  }
                  core.info(`${label}: success at ${run.html_url}`);
                  return run;
                }
                await sleep(15000);
              }
              throw new Error(`${label}: timed out at ${run.html_url}`);
            }

            const repairSteps = [
              ['repair-architecture-proof-v3.yml', 'Architecture semantic repair'],
              ['consolidate-ingestion-owner-v4.yml', 'Ingestion owner consolidation'],
              ['complete-promotion-owner-v2.yml', 'Promotion owner consolidation']
            ];
            for (const [workflow, label] of repairSteps) {
              await dispatchAndWait(workflow, label, false);
            }

            await dispatchAndWait(
              'converge-static-gate-v2.yml',
              'Canonical atomic static gate',
              true);

            await dispatchAndWait(
              'stabilized-solution-proof.yml',
              'Read-only stabilized solution proof',
              true);

            await dispatchAndWait(
              'contract-artifacts.yml',
              'Contract artifacts and drift proof',
              true);

            core.info(`All stabilization gates passed. Controller started at ${startedAt.toISOString()}.`);

      - name: Close stabilization blocker issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[CI] Stabilization controller blocker';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of issues) {
              if (issue.title === title && !issue.pull_request) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

      - name: Publish controller blocker
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[CI] Stabilization controller blocker';
            const body = [
              `Controller run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Source SHA: ${context.sha}`,
              '',
              'The controller stopped at the first failed causal gate. Open the failed child run linked in the controller log; no downstream gate was dispatched.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue =>
              issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Stabilization controller passed' : 'Stabilization controller stopped at blocker',
              context: 'ci/stabilization-controller'
            });
