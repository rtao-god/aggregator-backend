name: analytics-ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analytics-ci.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "src/Analytics/**"
      - "src/BuildingBlocks/**"
      - "tests/Analytics/**"
      - "tests/Architecture.Tests/**"
  pull_request:
    paths:
      - ".github/workflows/analytics-ci.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "src/Analytics/**"
      - "src/BuildingBlocks/**"
      - "tests/Analytics/**"
      - "tests/Architecture.Tests/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: analytics-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  analytics-owner-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore owner projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/Analytics/Analytics.Domain/Analytics.Domain.csproj
            src/Analytics/Analytics.Contracts/Analytics.Contracts.csproj
            src/Analytics/Analytics.Application/Analytics.Application.csproj
            src/Analytics/Analytics.Infrastructure/Analytics.Infrastructure.csproj
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Architecture.Tests/Architecture.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done
      - name: Format owner projects
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/Analytics/Analytics.Domain/Analytics.Domain.csproj
            src/Analytics/Analytics.Contracts/Analytics.Contracts.csproj
            src/Analytics/Analytics.Application/Analytics.Application.csproj
            src/Analytics/Analytics.Infrastructure/Analytics.Infrastructure.csproj
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet format "$project" --verify-no-changes --no-restore
          done
      - name: Build owner proofs
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Architecture.Tests/Architecture.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror
          done
      - name: Test owner proofs
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Architecture.Tests/Architecture.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet test "$project" --no-build --logger "console;verbosity=normal"
          done
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Analytics owner proof ${context.runId}: ${process.env.JOB_STATUS}`,
              context: 'ci/analytics-report'
            });
