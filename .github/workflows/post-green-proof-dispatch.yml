name: post-green-proof-dispatch

on:
  push:
    branches: [main]
    paths:
      - '.codex/ci/authoritative-green.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: post-green-proof-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate the green marker belongs to the parent of this marker commit
        id: marker
        shell: bash
        run: |
          test -s .codex/ci/authoritative-green.txt
          proven=$(sed -n 's/^sha=//p' .codex/ci/authoritative-green.txt)
          test -n "$proven"
          git cat-file -e "$proven^{commit}"
          printf 'proven_sha=%s\n' "$proven" >> "$GITHUB_OUTPUT"

      - name: Dispatch existing post-build proof owners
        uses: actions/github-script@v9
        env:
          PROVEN_SHA: ${{ steps.marker.outputs.proven_sha }}
        with:
          script: |
            const candidates = [
              'contract-artifacts.yml',
              'repository-hardening.yml',
              'ingestion-catalog-e2e-proof.yml',
              'runtime-context-completion.yml',
              'final-repository-proof.yml'
            ];
            const dispatched = [];
            const missing = [];
            for (const workflow_id of candidates) {
              try {
                const workflow = await github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id
                });
                if (workflow.data.state !== 'active') {
                  core.setFailed(`Required proof workflow ${workflow_id} is ${workflow.data.state}.`);
                  return;
                }
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  ref: 'main'
                });
                dispatched.push(workflow_id);
              } catch (error) {
                if (error.status === 404) {
                  missing.push(workflow_id);
                  continue;
                }
                throw error;
              }
            }
            if (missing.length > 0) {
              core.setFailed(`Required proof workflows are missing: ${missing.join(', ')}`);
              return;
            }
            core.info(`Dispatched for proven SHA ${process.env.PROVEN_SHA}: ${dispatched.join(', ')}`);

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success
                ? 'Post-build contract and runtime proofs dispatched'
                : 'Post-build proof dispatch failed',
              context: 'ci/post-green-proof-dispatch'
            });
