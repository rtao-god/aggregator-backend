name: Repair Acceptance Analytics owner v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-acceptance-analytics-owner-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-acceptance-analytics-owner-v2
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Execute corrected owner-alignment source script
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          workflow_path = Path('.github/workflows/repair-acceptance-analytics-owner.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          step_marker = '      - name: Align Acceptance with canonical Analytics contracts\n'
          next_step_marker = '      - name: Synchronize project inventory and solutions\n'
          step_start = workflow.find(step_marker)
          run_start = workflow.find('        run: |\n', step_start)
          script_start = run_start + len('        run: |\n')
          script_end = workflow.find(next_step_marker, script_start)
          if step_start < 0 or run_start < 0 or script_end < 0:
              raise SystemExit('Canonical owner-alignment script boundaries were not found.')

          script_lines = []
          for line in workflow[script_start:script_end].splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif not line.strip():
                  script_lines.append('')
              else:
                  raise SystemExit(f'Unexpected owner-script indentation: {line!r}')
          script = '\n'.join(script_lines) + '\n'

          fragile_start = script.find('old_get =')
          fragile_write = script.find('http.write_text(source', fragile_start)
          fragile_end = script.find('\n', fragile_write)
          if fragile_start < 0 or fragile_write < 0 or fragile_end < 0:
              raise SystemExit('Fragile AcceptanceHttp source block was not found in owner script.')

          replacement = r'''get_start = source.find(
              '    public static async Task<TResponse> GetAsync<TResponse>(\n')
          get_end = source.find(
              '    public static async Task<JsonDocument> GetDocumentAsync(\n',
              get_start)
          if get_start < 0 or get_end < 0:
              raise SystemExit('Acceptance GET method boundaries are missing.')
          new_get = (
              '    public static Task<TResponse> GetAsync<TResponse>(\n'
              '        HttpClient client,\n'
              '        string relativePath,\n'
              '        IReadOnlyDictionary<string, string>? headers,\n'
              '        CancellationToken cancellationToken) =>\n'
              '        GetAsync<TResponse>(\n'
              '            client,\n'
              '            relativePath,\n'
              '            bearerToken: null,\n'
              '            headers,\n'
              '            cancellationToken);\n'
              '\n'
              '    public static async Task<TResponse> GetAsync<TResponse>(\n'
              '        HttpClient client,\n'
              '        string relativePath,\n'
              '        string? bearerToken,\n'
              '        IReadOnlyDictionary<string, string>? headers,\n'
              '        CancellationToken cancellationToken)\n'
              '    {\n'
              '        ArgumentNullException.ThrowIfNull(client);\n'
              '        ArgumentException.ThrowIfNullOrWhiteSpace(relativePath);\n'
              '        using var request = new HttpRequestMessage(HttpMethod.Get, relativePath);\n'
              '        AddHeaders(request, bearerToken, headers);\n'
              '        using var response = await client.SendAsync(request, cancellationToken);\n'
              '        return await ReadRequiredAsync<TResponse>(response, cancellationToken);\n'
              '    }\n'
              '\n')
          source = source[:get_start] + new_get + source[get_end:]
          http.write_text(source, encoding='utf-8', newline='\n')'''
          script = script[:fragile_start] + replacement + script[fragile_end + 1:]
          exec(compile(script, '<acceptance-owner-alignment>', 'exec'), {'__name__': '__main__'})

          catalog_fixture = Path(
              'tests/Catalog/Catalog.Ingestion.Api.Tests/CatalogIngestionApiFactory.cs')
          catalog_source = catalog_fixture.read_text(encoding='utf-8')
          catalog_anchor = (
              '        {\n'
              '            cancellationToken.ThrowIfCancellationRequested();\n'
              '            if (_results.TryGetValue(command.CommandId, out var existing))\n')
          catalog_replacement = (
              '        {\n'
              '            ArgumentNullException.ThrowIfNull(command);\n'
              '            cancellationToken.ThrowIfCancellationRequested();\n'
              '            if (_results.TryGetValue(command.CommandId, out var existing))\n')
          if catalog_anchor not in catalog_source:
              raise SystemExit('Catalog ingestion test-store guard anchor is missing.')
          catalog_fixture.write_text(
              catalog_source.replace(catalog_anchor, catalog_replacement, 1),
              encoding='utf-8',
              newline='\n')

          analytics_control = Path(
              'tests/Acceptance/Acceptance.Control/AcceptanceAnalyticsScenarioService.cs')
          analytics_control_source = analytics_control.read_text(encoding='utf-8')
          broken_newline = (
              '        var canonical = string.Join(\n'
              '            "\n",\n')
          escaped_newline = (
              '        var canonical = string.Join(\n'
              '            "\\n",\n')
          if broken_newline not in analytics_control_source:
              raise SystemExit('Acceptance Analytics digest separator anchor is missing.')
          analytics_control.write_text(
              analytics_control_source.replace(
                  broken_newline,
                  escaped_newline,
                  1),
              encoding='utf-8',
              newline='\n')

          identity = Path('tests/Acceptance/Acceptance.Identity/Program.cs')
          identity.write_text(
              dedent(r'''
              using System.Security.Cryptography;
              using System.Text;
              using System.Text.Json;
              using Aggregator.Acceptance.Contracts;

              var builder = WebApplication.CreateBuilder(args);
              var issuer = builder.Configuration["AcceptanceIdentity:Issuer"]
                  ?? "http://acceptance-identity:8080";
              var keyId = builder.Configuration["AcceptanceIdentity:KeyId"]
                  ?? "acceptance-rs256";
              var rsa = RSA.Create(2048);
              builder.Services.AddSingleton(rsa);

              var app = builder.Build();
              var discoveryDocument = new
              {
                  issuer,
                  jwks_uri = $"{issuer.TrimEnd('/')}/jwks",
                  token_endpoint = $"{issuer.TrimEnd('/')}/token",
                  grant_types_supported = Program.GrantTypesSupported,
                  token_endpoint_auth_methods_supported = Program.TokenEndpointAuthMethodsSupported,
                  scopes_supported = Program.ScopesSupported,
                  id_token_signing_alg_values_supported = Program.SigningAlgorithmsSupported,
              };
              var parameters = rsa.ExportParameters(includePrivateParameters: false);
              var jwksDocument = new
              {
                  keys = new[]
                  {
                      new
                      {
                          kty = "RSA",
                          use = "sig",
                          kid = keyId,
                          alg = "RS256",
                          n = Base64Url(parameters.Modulus
                              ?? throw new InvalidOperationException("RSA modulus is unavailable.")),
                          e = Base64Url(parameters.Exponent
                              ?? throw new InvalidOperationException("RSA exponent is unavailable.")),
                      },
                  },
              };

              app.MapGet("/.well-known/openid-configuration", () =>
                  Results.Json(discoveryDocument));
              app.MapGet("/jwks", () => Results.Json(jwksDocument));
              app.MapPost("/token", async (HttpRequest request, RSA signingKey) =>
              {
                  if (!request.HasFormContentType)
                  {
                      return Results.BadRequest(new
                      {
                          error = "invalid_request",
                          error_description = "Token request must use application/x-www-form-urlencoded.",
                      });
                  }

                  var form = await request.ReadFormAsync(request.HttpContext.RequestAborted);
                  if (!string.Equals(
                      form["grant_type"],
                      "client_credentials",
                      StringComparison.Ordinal))
                  {
                      return Results.BadRequest(new
                      {
                          error = "unsupported_grant_type",
                      });
                  }

                  var now = DateTimeOffset.UtcNow;
                  var expiresAt = now.AddMinutes(15);
                  var scope = string.IsNullOrWhiteSpace(form["scope"])
                      ? string.Empty
                      : form["scope"].ToString().Trim();
                  var subject = string.IsNullOrWhiteSpace(form["client_id"])
                      ? "acceptance-client"
                      : form["client_id"].ToString().Trim();
                  var actorId = string.IsNullOrWhiteSpace(form["actor_id"])
                      ? AcceptanceScenarioIdentity.ActorId.ToString("D")
                      : form["actor_id"].ToString().Trim();
                  if (!Guid.TryParse(actorId, out var parsedActorId) ||
                      parsedActorId == Guid.Empty)
                  {
                      return Results.BadRequest(new
                      {
                          error = "invalid_request",
                          error_description = "actor_id must be a non-empty GUID.",
                      });
                  }

                  var token = CreateToken(
                      signingKey,
                      keyId,
                      issuer,
                      subject,
                      parsedActorId,
                      scope,
                      now,
                      expiresAt);
                  return Results.Json(new
                  {
                      access_token = token,
                      token_type = "Bearer",
                      expires_in = checked((int)(expiresAt - now).TotalSeconds),
                      scope,
                  });
              });
              app.MapGet("/health/live", () => Results.Ok(new
              {
                  owner = "Acceptance.Identity",
                  state = "live",
              }));

              await app.RunAsync();

              static string CreateToken(
                  RSA rsa,
                  string keyId,
                  string issuer,
                  string subject,
                  Guid actorId,
                  string scope,
                  DateTimeOffset issuedAt,
                  DateTimeOffset expiresAt)
              {
                  var header = JsonSerializer.SerializeToUtf8Bytes(new
                  {
                      alg = "RS256",
                      typ = "JWT",
                      kid = keyId,
                  });
                  var payload = JsonSerializer.SerializeToUtf8Bytes(new
                  {
                      iss = issuer,
                      aud = Program.TokenAudiences,
                      sub = subject,
                      actor_id = actorId.ToString("D"),
                      scope,
                      iat = issuedAt.ToUnixTimeSeconds(),
                      nbf = issuedAt.AddSeconds(-5).ToUnixTimeSeconds(),
                      exp = expiresAt.ToUnixTimeSeconds(),
                      jti = Guid.CreateVersion7().ToString("D"),
                  });
                  var signingInput = $"{Base64Url(header)}.{Base64Url(payload)}";
                  var signature = rsa.SignData(
                      Encoding.ASCII.GetBytes(signingInput),
                      HashAlgorithmName.SHA256,
                      RSASignaturePadding.Pkcs1);
                  return $"{signingInput}.{Base64Url(signature)}";
              }

              static string Base64Url(ReadOnlySpan<byte> value) =>
                  Convert.ToBase64String(value)
                      .TrimEnd('=')
                      .Replace('+', '-')
                      .Replace('/', '_');

              public partial class Program
              {
                  internal static readonly string[] GrantTypesSupported =
                      ["client_credentials"];

                  internal static readonly string[] TokenEndpointAuthMethodsSupported =
                      ["none"];

                  internal static readonly string[] ScopesSupported =
                  [
                      "catalog.manage-configuration",
                      "catalog.edit-listing",
                      "catalog.publish",
                      "catalog.rollback",
                      "catalog.submit-claim",
                      "catalog.verify-claim",
                      "catalog.test-contracts",
                      "ingestion.submit",
                      "ingestion.review",
                      "ingestion.admin",
                      "promotion.manage",
                      "promotion.publish",
                      "promotion.overlay.publish",
                      "analytics.view-listing",
                  ];

                  internal static readonly string[] SigningAlgorithmsSupported =
                      ["RS256"];

                  internal static readonly string[] TokenAudiences =
                  [
                      "aggregator-catalog-command",
                      "aggregator-ingestion-command",
                      "aggregator-promotion-command",
                      "aggregator-analytics",
                  ];
              }
              ''').lstrip(),
              encoding='utf-8',
              newline='\n')

          options = Path('tests/Acceptance/Acceptance.Runner/AcceptanceOptions.cs')
          options_source = options.read_text(encoding='utf-8')
          invalid_timeout_pattern = (
              '        if (Timeout is < TimeSpan.FromSeconds(30) or > TimeSpan.FromMinutes(15))\n')
          valid_timeout_condition = (
              '        if (Timeout < TimeSpan.FromSeconds(30) ||\n'
              '            Timeout > TimeSpan.FromMinutes(15))\n')
          if invalid_timeout_pattern not in options_source:
              raise SystemExit('Acceptance timeout condition anchor is missing.')
          options.write_text(
              options_source.replace(
                  invalid_timeout_pattern,
                  valid_timeout_condition,
                  1),
              encoding='utf-8',
              newline='\n')

          scenario = Path('tests/Acceptance/Acceptance.Runner/AcceptanceScenario.cs')
          scenario_source = scenario.read_text(encoding='utf-8')
          invalid_set = (
              '                disallowedRevisionIds:\n'
              '                [firstQuery.PublicReadRevisionId, secondQuery.PublicReadRevisionId]),\n')
          valid_set = (
              '                disallowedRevisionIds: new HashSet<Guid>\n'
              '                {\n'
              '                    firstQuery.PublicReadRevisionId,\n'
              '                    secondQuery.PublicReadRevisionId,\n'
              '                }),\n')
          if invalid_set not in scenario_source:
              raise SystemExit('Acceptance disallowed revision set anchor is missing.')
          scenario_source = scenario_source.replace(invalid_set, valid_set, 1)
          invalid_empty_overlay = '            response.OverlayId is null && response.Sponsored.Count == 0,\n'
          valid_empty_overlay = '            response.OverlayId != Guid.Empty && response.Sponsored.Count == 0,\n'
          if invalid_empty_overlay not in scenario_source:
              raise SystemExit('Acceptance empty Promotion overlay anchor is missing.')
          scenario.write_text(
              scenario_source.replace(
                  invalid_empty_overlay,
                  valid_empty_overlay,
                  1),
              encoding='utf-8',
              newline='\n')

          analytics_worker = Path('src/Analytics/Analytics.Worker/Program.cs')
          analytics_worker_source = analytics_worker.read_text(encoding='utf-8')
          analytics_log = dedent('''
                          logger.LogInformation(
                              "Analytics aggregate rebuild materialized {MetricCount} rows and removed {StaleMetricCount} stale rows for [{FromDate}, {ToDate}).",
                              result.MaterializedMetricCount,
                              result.RemovedStaleMetricCount,
                              result.FromInclusive,
                              result.ToExclusive);
          ''').strip('\n')
          guarded_analytics_log = dedent('''
                          if (logger.IsEnabled(LogLevel.Information))
                          {
                              logger.LogInformation(
                                  "Analytics aggregate rebuild materialized {MetricCount} rows and removed {StaleMetricCount} stale rows for [{FromDate}, {ToDate}).",
                                  result.MaterializedMetricCount,
                                  result.RemovedStaleMetricCount,
                                  result.FromInclusive,
                                  result.ToExclusive);
                          }
          ''').strip('\n')
          if analytics_log not in analytics_worker_source:
              raise SystemExit('Analytics worker information log anchor is missing.')
          analytics_worker.write_text(
              analytics_worker_source.replace(
                  analytics_log,
                  guarded_analytics_log,
                  1),
              encoding='utf-8',
              newline='\n')

          catalog_event_worker = Path('src/Catalog/Catalog.Event.Worker/Program.cs')
          catalog_event_source = catalog_event_worker.read_text(encoding='utf-8')
          catalog_log = dedent('''
                          _logger.LogInformation(
                              "Dispatched Catalog event {EventId} after {DeliveryAttempts} attempt(s)",
                              lease.EventId,
                              lease.DeliveryAttempts);
          ''').strip('\n')
          guarded_catalog_log = dedent('''
                          if (_logger.IsEnabled(LogLevel.Information))
                          {
                              _logger.LogInformation(
                                  "Dispatched Catalog event {EventId} after {DeliveryAttempts} attempt(s)",
                                  lease.EventId,
                                  lease.DeliveryAttempts);
                          }
          ''').strip('\n')
          if catalog_log not in catalog_event_source:
              raise SystemExit('Catalog event worker information log anchor is missing.')
          catalog_event_worker.write_text(
              catalog_event_source.replace(
                  catalog_log,
                  guarded_catalog_log,
                  1),
              encoding='utf-8',
              newline='\n')

          # The repository token may mutate source but not workflow files. The permanent
          # acceptance workflow is published through the GitHub connector after proof.
          Path('.github/workflows/backend-acceptance-e2e.yml').unlink(missing_ok=True)

      - name: Synchronize project inventory and solutions
        shell: bash
        run: |
          python3 .tools/complete-backend.py
          project='tests/Acceptance/Acceptance.Contracts/Acceptance.Contracts.csproj'
          if ! dotnet sln AggregatorBackend.All.slnx list | grep -Fq "$project"; then
            dotnet sln AggregatorBackend.All.slnx add "$project"
          fi
          python3 .tools/complete-backend.py --check

      - name: Restore
        run: dotnet restore AggregatorBackend.slnx

      - name: Format owned solution
        run: |
          dotnet format AggregatorBackend.slnx --no-restore
          dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore

      - name: Build with warnings as errors
        run: >-
          dotnet build AggregatorBackend.slnx
          --no-restore -warnaserror /m:1 /nr:false

      - name: Execute complete test suite
        run: >-
          dotnet test AggregatorBackend.slnx
          --no-build --no-restore -warnaserror
          --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Generate and verify producer contracts
        run: |
          dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj \
            --no-build -- --write
          dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj \
            --no-build -- --verify

      - name: Verify workflow files are outside the source commit
        run: |
          if git status --short -- .github/workflows | grep -q .; then
            echo 'Unexpected workflow mutation in source proof:' >&2
            git status --short -- .github/workflows >&2
            exit 1
          fi

      - name: Commit proven owner-aligned source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align acceptance with canonical Analytics owner'
          git pull --rebase origin main
          git push origin HEAD:main
