name: repository-completion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

concurrency:
  group: aggregator-repository-completion
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Apply deterministic normalization
        run: python tools/repository_completion.py
      - name: Remove duplicate Ingestion application composition
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/Ingestion/Ingestion.Api/Program.cs')
          source = path.read_text()
          source = source.replace(
              '        builder.Services.AddIngestionApplication();\n        builder.Services.AddIngestionProcessingApplication();',
              '        builder.Services.AddIngestionApplication();')
          path.write_text(source)
      - name: Synchronize every physical project into the solution
        shell: bash
        run: |
          mapfile -t projects < <(find src tests tools -name '*.csproj' -type f | sort)
          solution_projects="$(dotnet sln AggregatorBackend.slnx list)"
          for project in "${projects[@]}"; do
            if ! grep -Fq "$project" <<<"$solution_projects"; then
              dotnet sln AggregatorBackend.slnx add "$project"
              solution_projects+=$'\n'"$project"
            fi
          done
      - name: Verify repository
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p .codex/ci/raw .codex/ci/codes
          rm -f .codex/ci/codes/* .codex/ci/completion-green.txt

          dotnet restore AggregatorBackend.slnx > .codex/ci/raw/restore.log 2>&1
          restore_exit=$?
          if [ "$restore_exit" -eq 0 ]; then
            dotnet format AggregatorBackend.slnx --no-restore > .codex/ci/raw/format.log 2>&1
            format_exit=$?
          else
            format_exit=99
            : > .codex/ci/raw/format.log
          fi
          if [ "$restore_exit" -eq 0 ] && [ "$format_exit" -eq 0 ]; then
            dotnet build AggregatorBackend.slnx --no-restore -warnaserror > .codex/ci/raw/build.log 2>&1
            build_exit=$?
          else
            build_exit=99
            : > .codex/ci/raw/build.log
          fi
          if [ "$build_exit" -eq 0 ]; then
            dotnet test AggregatorBackend.slnx --no-build --logger 'console;verbosity=normal' > .codex/ci/raw/test.log 2>&1
            test_exit=$?
          else
            test_exit=99
            : > .codex/ci/raw/test.log
          fi
          if [ "$test_exit" -eq 0 ]; then
            dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --write > .codex/ci/raw/contracts.log 2>&1
            contracts_write_exit=$?
            if [ "$contracts_write_exit" -eq 0 ]; then
              dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --verify >> .codex/ci/raw/contracts.log 2>&1
              contracts_exit=$?
            else
              contracts_exit=$contracts_write_exit
            fi
          else
            contracts_exit=99
            : > .codex/ci/raw/contracts.log
          fi

          python - "$restore_exit" "$format_exit" "$build_exit" "$test_exit" "$contracts_exit" <<'PY'
          import re
          import sys
          from pathlib import Path

          names = ('restore', 'format', 'build', 'test', 'contracts')
          exits = dict(zip(names, map(int, sys.argv[1:])))
          root = Path('.codex/ci')
          sections = [f'head={Path(".git/HEAD").read_text(errors="replace").strip()}', '']
          codes = set()
          patterns = (
              re.compile(r'\berror\s+([A-Z]+\d+)\b', re.I),
              re.compile(r'\b(NU\d{4})\b'),
              re.compile(r'\b(xUnit\d{4})\b', re.I),
          )
          for name in names:
              lines = (root / 'raw' / f'{name}.log').read_text(errors='replace').splitlines()
              important = [
                  line for line in lines
                  if 'error' in line.lower()
                  or 'fail' in line.lower()
                  or 'exception' in line.lower()
                  or 'warning as error' in line.lower()
              ]
              selected = important[-250:] if important else lines[-80:]
              sections.append(f'## {name} exit={exits[name]}')
              sections.extend(selected)
              sections.append('')
              for line in lines:
                  for pattern in patterns:
                      codes.update(match.upper() for match in pattern.findall(line))
          (root / 'last-errors.txt').write_text('\n'.join(sections) + '\n')
          code_dir = root / 'codes'
          code_dir.mkdir(parents=True, exist_ok=True)
          for code in sorted(codes):
              (code_dir / code).write_text(code + '\n')
          if all(value == 0 for value in exits.values()):
              (root / 'completion-green.txt').write_text(
                  '\n'.join(f'{name}=0' for name in names) + '\n')
          PY

          echo "restore_exit=$restore_exit" >> "$GITHUB_OUTPUT"
          echo "format_exit=$format_exit" >> "$GITHUB_OUTPUT"
          echo "build_exit=$build_exit" >> "$GITHUB_OUTPUT"
          echo "test_exit=$test_exit" >> "$GITHUB_OUTPUT"
          echo "contracts_exit=$contracts_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit normalized repository and proof
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "${{ steps.verify.outputs.restore_exit }}" = '0' ] \
             && [ "${{ steps.verify.outputs.format_exit }}" = '0' ] \
             && [ "${{ steps.verify.outputs.build_exit }}" = '0' ] \
             && [ "${{ steps.verify.outputs.test_exit }}" = '0' ] \
             && [ "${{ steps.verify.outputs.contracts_exit }}" = '0' ]; then
            message='Complete normalized repository proof [skip ci]'
          else
            message='Persist repository completion diagnostics [skip ci]'
          fi
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          RESTORE_EXIT: ${{ steps.verify.outputs.restore_exit }}
          FORMAT_EXIT: ${{ steps.verify.outputs.format_exit }}
          BUILD_EXIT: ${{ steps.verify.outputs.build_exit }}
          TEST_EXIT: ${{ steps.verify.outputs.test_exit }}
          CONTRACTS_EXIT: ${{ steps.verify.outputs.contracts_exit }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = ['RESTORE_EXIT', 'FORMAT_EXIT', 'BUILD_EXIT', 'TEST_EXIT', 'CONTRACTS_EXIT']
              .every(name => process.env[name] === '0');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Repository completion proof passed' : 'Repository completion proof failed',
              context: 'ci/repository-completion'
            });
      - name: Fail when repository proof is red
        if: steps.verify.outputs.restore_exit != '0' || steps.verify.outputs.format_exit != '0' || steps.verify.outputs.build_exit != '0' || steps.verify.outputs.test_exit != '0' || steps.verify.outputs.contracts_exit != '0'
        run: exit 1
