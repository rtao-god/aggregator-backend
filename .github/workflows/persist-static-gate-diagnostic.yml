name: Persist canonical static gate diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-static-gate-diagnostic.yml'
  workflow_run:
    workflows: ["Converge canonical static gate with diagnostics"]
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: persist-canonical-static-diagnostic
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the canonical static gate
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'converge-static-gate-v2.yml',
              ref: 'main'
            });

  persist:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - name: Persist or clear exact diagnostic
        uses: actions/github-script@v9
        with:
          script: |
            const path = '.codex/ci/canonical-static-gate-blocker.md';
            const branch = 'main';
            let existing = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              if (!Array.isArray(response.data)) existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (context.payload.workflow_run.conclusion === 'success') {
              if (existing) {
                await github.rest.repos.deleteFile({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  branch,
                  sha: existing.sha,
                  message: 'Clear resolved canonical static gate blocker [skip ci]'
                });
              }
              return;
            }

            const title = '[CI] Canonical static gate blocker';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const issue = issues.find(candidate =>
              candidate.title === title && !candidate.pull_request);
            const body = issue?.body ?? [
              '# Canonical static gate blocker',
              '',
              `Run: ${context.payload.workflow_run.html_url}`,
              `Conclusion: ${context.payload.workflow_run.conclusion}`,
              '',
              'The gate failed before its structured issue could be persisted.'
            ].join('\n');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: 'Persist canonical static gate blocker [skip ci]',
              content: Buffer.from(body, 'utf8').toString('base64'),
              ...(existing ? { sha: existing.sha } : {})
            });
