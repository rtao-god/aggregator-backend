name: Finalize Promotion owner proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-promotion-owner-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: complete-promotion-owner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Enforce the Promotion response owner boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Promotion/Promotion.Application/PromotionCampaignServices.cs')
          content = path.read_text(encoding='utf-8')
          old = (
              "    public static PromotionCampaignResponse ToResponse(\n"
              "        PromotionCampaignSnapshot campaign,\n"
              "        bool replayed) =>\n"
              "        new(\n"
              "            campaign.Id,\n"
              "            campaign.ProductRevisionId,\n"
              "            campaign.EntitlementId,\n"
              "            campaign.ListingId,\n"
              "            campaign.CatalogKey,\n"
              "            campaign.PlacementKey,\n"
              "            campaign.CapacityUnits,\n"
              "            campaign.StartsAtUtc,\n"
              "            campaign.EndsAtUtc,\n"
              "            ToContract(campaign.State),\n"
              "            campaign.AggregateRevision,\n"
              "            campaign.LastChangedAtUtc,\n"
              "            campaign.SuspensionReason,\n"
              "            \"sponsored\",\n"
              "            replayed);\n"
          )
          new = (
              "    public static PromotionCampaignResponse ToResponse(\n"
              "        PromotionCampaignSnapshot campaign,\n"
              "        bool replayed)\n"
              "    {\n"
              "        ArgumentNullException.ThrowIfNull(campaign);\n"
              "        return new PromotionCampaignResponse(\n"
              "            campaign.Id,\n"
              "            campaign.ProductRevisionId,\n"
              "            campaign.EntitlementId,\n"
              "            campaign.ListingId,\n"
              "            campaign.CatalogKey,\n"
              "            campaign.PlacementKey,\n"
              "            campaign.CapacityUnits,\n"
              "            campaign.StartsAtUtc,\n"
              "            campaign.EndsAtUtc,\n"
              "            ToContract(campaign.State),\n"
              "            campaign.AggregateRevision,\n"
              "            campaign.LastChangedAtUtc,\n"
              "            campaign.SuspensionReason,\n"
              "            \"sponsored\",\n"
              "            replayed);\n"
              "    }\n"
          )
          if content.count(old) != 1:
              raise RuntimeError('Expected exactly one PromotionCampaignMapper.ToResponse owner anchor.')
          path.write_text(content.replace(old, new), encoding='utf-8', newline='\n')

      - name: Restore Promotion owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Promotion tests/Promotion -name '*.csproj' -type f | sort)
          test "${#projects[@]}" -gt 0
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done

      - name: Format and verify Promotion owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Promotion tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet format "$project" --no-restore
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Build Promotion production graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror /m:1 /nr:false
          done

      - name: Test Promotion owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet test "$project" --no-restore -warnaserror \
              --logger 'console;verbosity=normal' /m:1 /nr:false
          done

      - name: Commit proven Promotion guard and remove one-shot workflows
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- src/Promotion tests/Promotion)
            test -z "$affected" || {
              printf 'Promotion owner changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm \
            .github/workflows/fix-promotion-campaign-owner.yml \
            .github/workflows/complete-promotion-owner.yml \
            .github/workflows/complete-promotion-owner-v2.yml
          paths=(
            src/Promotion
            tests/Promotion
            .github/workflows/fix-promotion-campaign-owner.yml
            .github/workflows/complete-promotion-owner.yml
            .github/workflows/complete-promotion-owner-v2.yml
          )
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Validate Promotion campaign response owner boundary' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Promotion owner proof: ${process.env.JOB_STATUS}`,
              context: 'ci/promotion-owner'
            });
