name: Complete Platform Messaging owner proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-platform-messaging-owner-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-platform-messaging-owner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Reapply the proven Messaging repair and correct the architecture scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/repair-platform-messaging-owner.yml').read_text(
              encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index('          PY\n', start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'repair-platform-messaging-owner.py', 'exec'))

          path = Path('tests/Architecture.Tests/RepositorySecurityRulesTests.cs')
          content = path.read_text(encoding='utf-8')

          test_start = content.index(
              '    [Fact]\n'
              '    public void CommandControllersRequireExplicitAuthorization()')
          test_end = content.index(
              '\n\n    [Fact]\n'
              '    public void ApiAndWorkerStartupNeverOwnBusinessMigrations()',
              test_start)
          new_tests = '''    [Fact]
          public void MutatingEndpointsRequireExplicitAccessDeclaration()
          {
              var failures = new List<string>();
              foreach (var file in EnumerateSourceFiles("src", "*.Controller.cs", "*Controller.cs"))
              {
                  failures.AddRange(FindMutatingEndpointsWithoutAccessDeclaration(
                      File.ReadAllText(file),
                      Relative(file)));
              }

              Assert.True(failures.Count == 0, string.Join(Environment.NewLine, failures));
          }

          [Fact]
          public void AccessScannerAcceptsExplicitPolicyAndAnonymousContracts()
          {
              const string source = """
                  [ApiController]
                  public sealed class PublicController : ControllerBase
                  {
                      [HttpPost]
                      [AllowAnonymous]
                      public void Submit() { }
                  }

                  [ApiController]
                  [Authorize("owner.policy")]
                  public sealed class ProtectedController : ControllerBase
                  {
                      [HttpPost]
                      public void Create() { }
                  }

                  [ApiController]
                  public sealed class MethodProtectedController : ControllerBase
                  {
                      [Authorize(Policy = "owner.policy")]
                      [HttpPost]
                      public void Update() { }
                  }
                  """;

              Assert.Empty(FindMutatingEndpointsWithoutAccessDeclaration(source, "fixture.cs"));
          }

          [Fact]
          public void AccessScannerDoesNotBorrowAuthorizationFromAnotherController()
          {
              const string source = """
                  [ApiController]
                  [Authorize("owner.policy")]
                  public sealed class ProtectedController : ControllerBase
                  {
                      [HttpPost]
                      public void Create() { }
                  }

                  [ApiController]
                  public sealed class UnprotectedController : ControllerBase
                  {
                      [HttpPost]
                      public void Create() { }
                  }
                  """;

              var failure = Assert.Single(
                  FindMutatingEndpointsWithoutAccessDeclaration(source, "fixture.cs"));
              Assert.Contains("UnprotectedController", failure, StringComparison.Ordinal);
          }

          [Fact]
          public void AccessScannerRejectsBareAuthorizeAttribute()
          {
              const string source = """
                  [ApiController]
                  [Authorize]
                  public sealed class BareAuthorizeController : ControllerBase
                  {
                      [HttpPost]
                      public void Create() { }
                  }
                  """;

              Assert.Single(FindMutatingEndpointsWithoutAccessDeclaration(source, "fixture.cs"));
          }
          '''
          content = content[:test_start] + new_tests + content[test_end:]

          helper_start = content.index(
              '    private static bool HasAuthorizationBeforeControllerDeclaration(')
          helper_end = content.index(
              '\n\n    private static IEnumerable<string> EnumerateSourceFiles(',
              helper_start)
          new_helpers = '''    private static IReadOnlyList<string> FindMutatingEndpointsWithoutAccessDeclaration(
              string source,
              string sourceIdentity)
          {
              if (!source.Contains("[ApiController]", StringComparison.Ordinal) ||
                  !source.Contains("ControllerBase", StringComparison.Ordinal))
              {
                  return [];
              }

              var failures = new List<string>();
              var controllerDeclarations = ControllerDeclarationRegex().Matches(source);
              foreach (Match endpoint in EndpointDeclarationRegex().Matches(source))
              {
                  var attributes = endpoint.Groups["attributes"].Value;
                  if (!MutationAttributeRegex().IsMatch(attributes))
                  {
                      continue;
                  }

                  Match? controllerDeclaration = null;
                  foreach (Match candidate in controllerDeclarations)
                  {
                      if (candidate.Index >= endpoint.Index)
                      {
                          break;
                      }

                      controllerDeclaration = candidate;
                  }

                  if (controllerDeclaration is null)
                  {
                      failures.Add(
                          $"{sourceIdentity} contains a mutating endpoint outside an explicit controller declaration near offset {endpoint.Index}.");
                      continue;
                  }

                  if (!HasExplicitAccessDeclarationBeforeController(source, controllerDeclaration) &&
                      !HasExplicitAccessDeclaration(attributes))
                  {
                      failures.Add(
                          $"{sourceIdentity} controller '{controllerDeclaration.Value.Trim()}' contains a mutating endpoint without an explicit [Authorize(...)] or [AllowAnonymous] declaration near offset {endpoint.Index}.");
                  }
              }

              return failures;
          }

          private static bool HasExplicitAccessDeclarationBeforeController(
              string source,
              Match declaration)
          {
              var prefixStart = Math.Max(0, declaration.Index - 2000);
              var prefix = source[prefixStart..declaration.Index];
              var apiControllerIndex = prefix.LastIndexOf(
                  "[ApiController]",
                  StringComparison.Ordinal);
              return apiControllerIndex >= 0 &&
                  HasExplicitAccessDeclaration(prefix[apiControllerIndex..]);
          }

          private static bool HasExplicitAccessDeclaration(string source) =>
              AuthorizationAttributeRegex().IsMatch(source) ||
              AllowAnonymousAttributeRegex().IsMatch(source);
          '''
          content = content[:helper_start] + new_helpers + content[helper_end:]

          mutation_method_name = content.index(
              '    private static partial Regex MutationAttributeRegex();')
          regex_start = content.rfind('    [GeneratedRegex', 0, mutation_method_name)
          regex_end = content.index(
              '    [GeneratedRegex(@"(?im)(?<name>password',
              mutation_method_name)
          new_regexes = '''    [GeneratedRegex(@"\\[(?:HttpPost|HttpPut|HttpPatch|HttpDelete)(?:Attribute)?(?:\\([^\\]]*\\))?\\]", RegexOptions.CultureInvariant)]
          private static partial Regex MutationAttributeRegex();

          [GeneratedRegex(@"(?<attributes>(?:\\s*\\[[^\\]]+\\]\\s*)+)\\b(?:public|internal)\\s+(?:(?:static|virtual|override|sealed|new|unsafe|async)\\s+)*", RegexOptions.CultureInvariant)]
          private static partial Regex EndpointDeclarationRegex();

          [GeneratedRegex(@"\\b(?:public|internal)\\s+(?:(?:sealed|abstract|partial)\\s+)*class\\s+\\w*Controller\\b", RegexOptions.CultureInvariant)]
          private static partial Regex ControllerDeclarationRegex();

          [GeneratedRegex(@"\\[Authorize(?:Attribute)?\\s*\\(\\s*[^)\\s][^)]*\\)\\]", RegexOptions.CultureInvariant)]
          private static partial Regex AuthorizationAttributeRegex();

          [GeneratedRegex(@"\\[AllowAnonymous(?:Attribute)?\\s*\\]", RegexOptions.CultureInvariant)]
          private static partial Regex AllowAnonymousAttributeRegex();

          '''
          content = content[:regex_start] + new_regexes + content[regex_end:]
          path.write_text(content, encoding='utf-8', newline='\n')
          PY

      - name: Prove stale contracts and scanner shortcuts are absent
        shell: bash
        run: |
          if grep -R --line-number --include='*.cs' \
            -E 'Table = "outbox_message"|lease_owner|lease_until_utc' \
            tests/BuildingBlocks/Platform.Messaging.Tests; then
            echo 'A stale Platform.Messaging test contract remains.' >&2
            exit 1
          fi
          test "$(grep -c 'OutboxMessageIntegrity.GetVerifiedPayloadBytes(message)' \
            src/BuildingBlocks/Platform.Messaging/PostgresOutboxDispatcher.cs)" -eq 1
          test "$(grep -c 'var body = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);' \
            src/BuildingBlocks/Platform.Messaging/RabbitMqEventPublisher.cs)" -eq 1
          ! grep -F 'HasAuthorizationBeforeControllerDeclaration' \
            tests/Architecture.Tests/RepositorySecurityRulesTests.cs
          ! grep -F 'MutationMethodRegex' \
            tests/Architecture.Tests/RepositorySecurityRulesTests.cs

      - name: Restore affected owner graph
        shell: bash
        run: |
          dotnet restore tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj
          dotnet restore tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj
          dotnet restore tests/Architecture.Tests/Architecture.Tests.csproj

      - name: Format and verify affected owner graph
        shell: bash
        run: |
          projects=(
            src/BuildingBlocks/Platform.Messaging/Platform.Messaging.csproj
            tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj
            tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj
            tests/Architecture.Tests/Architecture.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet format "$project" --no-restore
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Build affected owner graph
        shell: bash
        run: |
          dotnet build tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj \
            --no-restore -warnaserror /m:1 /nr:false
          dotnet build tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj \
            --no-restore -warnaserror /m:1 /nr:false
          dotnet build tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-restore -warnaserror /m:1 /nr:false

      - name: Test affected owner graph
        shell: bash
        run: |
          dotnet test tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj \
            --no-build --no-restore -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false
          dotnet test tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj \
            --no-build --no-restore -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false
          filter='FullyQualifiedName~Architecture.Tests.CatalogOutboxContractTests|FullyQualifiedName~Architecture.Tests.RepositorySecurityRulesTests.MutatingEndpointsRequireExplicitAccessDeclaration|FullyQualifiedName~Architecture.Tests.RepositorySecurityRulesTests.AccessScanner'
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-build --no-restore -warnaserror --filter "$filter" \
            --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Commit proven owner repair and remove one-shot workflows
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- \
              src/BuildingBlocks/Platform.Messaging \
              tests/BuildingBlocks/Platform.Messaging.Tests \
              tests/Catalog/Catalog.Api.Tests/CatalogCorrelationContractTests.cs \
              tests/Architecture.Tests/RepositorySecurityRulesTests.cs \
              .codex/modules/messaging.md)
            test -z "$affected" || {
              printf 'Messaging or architecture owner changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm \
            .github/workflows/repair-platform-messaging-owner.yml \
            .github/workflows/repair-platform-messaging-owner-v2.yml
          paths=(
            src/BuildingBlocks/Platform.Messaging
            tests/BuildingBlocks/Platform.Messaging.Tests
            tests/Catalog/Catalog.Api.Tests/CatalogCorrelationContractTests.cs
            tests/Architecture.Tests/RepositorySecurityRulesTests.cs
            .codex/modules/messaging.md
            .github/workflows/repair-platform-messaging-owner.yml
            .github/workflows/repair-platform-messaging-owner-v2.yml
          )
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Restore Platform Messaging payload integrity boundary' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Platform Messaging owner proof: ${process.env.JOB_STATUS}`,
              context: 'ci/platform-messaging-owner'
            });
