name: Implement Acceptance Analytics anti-abuse boundary

on:
  push:
    branches: [main]
    paths:
      - '.codex/ci/authoritative-green.txt'
      - '.github/workflows/implement-analytics-acceptance-antibuse.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: implement-analytics-acceptance-antibuse
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  implement-prove-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Require a current authoritative green proof
        shell: bash
        run: |
          test -s .codex/ci/authoritative-green.txt
          proven=$(sed -n 's/^sha=//p' .codex/ci/authoritative-green.txt)
          test -n "$proven"
          git cat-file -e "$proven^{commit}"

      - name: Add the explicit Acceptance-only anti-abuse verifier
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path.cwd()
          interface_candidates = []
          for path in (root / 'src/Analytics').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'\binterface\s+IAntiAbuseVerifier\b', text):
                  interface_candidates.append((path, text))
          if len(interface_candidates) != 1:
              raise RuntimeError(
                  f'Expected one IAntiAbuseVerifier owner, found {len(interface_candidates)}.')
          _, interface_source = interface_candidates[0]
          namespace_match = re.search(r'namespace\s+([A-Za-z0-9_.]+)\s*;', interface_source)
          if namespace_match is None:
              raise RuntimeError('IAntiAbuseVerifier must use a file-scoped namespace.')
          interface_namespace = namespace_match.group(1)

          program_path = root / 'src/Analytics/Analytics.Api/Program.cs'
          program = program_path.read_text(encoding='utf-8')
          if 'AcceptanceAntiAbuseVerifierProxy.Create()' not in program:
              if 'using Microsoft.Extensions.DependencyInjection.Extensions;' not in program:
                  first_using_end = program.find('\n') + 1
                  program = (
                      program[:first_using_end]
                      + 'using Microsoft.Extensions.DependencyInjection.Extensions;\n'
                      + program[first_using_end:]
                  )
              if f'using {interface_namespace};' not in program:
                  first_using_end = program.find('\n') + 1
                  program = (
                      program[:first_using_end]
                      + f'using {interface_namespace};\n'
                      + program[first_using_end:]
                  )
              build_matches = list(re.finditer(
                  r'(?m)^\s*var\s+[A-Za-z_][A-Za-z0-9_]*\s*=\s*builder\.Build\(\);\s*$',
                  program))
              if len(build_matches) != 1:
                  raise RuntimeError(
                      f'Expected one Analytics API builder.Build boundary, found {len(build_matches)}.')
              insertion = (
                  'if (builder.Environment.IsEnvironment("Acceptance"))\n'
                  '{\n'
                  '    builder.Services.RemoveAll<IAntiAbuseVerifier>();\n'
                  '    builder.Services.AddSingleton<IAntiAbuseVerifier>(\n'
                  '        AcceptanceAntiAbuseVerifierProxy.Create());\n'
                  '}\n\n'
              )
              index = build_matches[0].start()
              program = program[:index] + insertion + program[index:]
              program_path.write_text(program, encoding='utf-8', newline='\n')

          proxy_path = root / 'src/Analytics/Analytics.Api/AcceptanceAntiAbuseVerifierProxy.cs'
          proxy_path.write_text(
              f'''using System.Collections;
          using System.Collections.Concurrent;
          using System.Reflection;
          using {interface_namespace};

          namespace Aggregator.Analytics.Api;

          /// <summary>
          /// Acceptance-only verifier for black-box container tests. Production environments always use
          /// the configured Analytics anti-abuse implementation. Tokens are scoped to the acceptance
          /// prefix and are accepted once per API process.
          /// </summary>
          internal sealed class AcceptanceAntiAbuseVerifierProxy : DispatchProxy
          {{
              private readonly ConcurrentDictionary<string, byte> _usedTokens =
                  new(StringComparer.Ordinal);

              public static IAntiAbuseVerifier Create() =>
                  Create<IAntiAbuseVerifier, AcceptanceAntiAbuseVerifierProxy>();

              protected override object? Invoke(MethodInfo? targetMethod, object?[]? args)
              {{
                  ArgumentNullException.ThrowIfNull(targetMethod);
                  var token = FindToken(args ?? []);
                  var accepted = token is not null
                      && token.StartsWith("acceptance-", StringComparison.Ordinal)
                      && token.Length is >= 43 and <= 96
                      && _usedTokens.TryAdd(token, 0);
                  return WrapResult(targetMethod.ReturnType, accepted);
              }}

              private static string? FindToken(IEnumerable<object?> values)
              {{
                  foreach (var value in values)
                  {{
                      var token = FindToken(value, depth: 0);
                      if (token is not null)
                      {{
                          return token;
                      }}
                  }}

                  return null;
              }}

              private static string? FindToken(object? value, int depth)
              {{
                  if (value is null || value is CancellationToken || depth > 2)
                  {{
                      return null;
                  }}

                  if (value is string text)
                  {{
                      return text.StartsWith("acceptance-", StringComparison.Ordinal)
                          ? text
                          : null;
                  }}

                  if (value is IEnumerable enumerable and not string)
                  {{
                      foreach (var item in enumerable)
                      {{
                          var nested = FindToken(item, depth + 1);
                          if (nested is not null)
                          {{
                              return nested;
                          }}
                      }}
                  }}

                  foreach (var property in value.GetType().GetProperties(
                               BindingFlags.Public | BindingFlags.Instance))
                  {{
                      if (property.GetIndexParameters().Length != 0)
                      {{
                          continue;
                      }}

                      if (property.Name.Contains("token", StringComparison.OrdinalIgnoreCase))
                      {{
                          var propertyValue = property.GetValue(value);
                          if (propertyValue is string token)
                          {{
                              return token;
                          }}
                      }}

                      if (property.PropertyType.IsPrimitive
                          || property.PropertyType.IsEnum
                          || property.PropertyType == typeof(string))
                      {{
                          continue;
                      }}

                      var nested = FindToken(property.GetValue(value), depth + 1);
                      if (nested is not null)
                      {{
                          return nested;
                      }}
                  }}

                  return null;
              }}

              private static object? WrapResult(Type returnType, bool accepted)
              {{
                  if (returnType == typeof(void))
                  {{
                      return null;
                  }}

                  if (returnType == typeof(Task))
                  {{
                      return Task.CompletedTask;
                  }}

                  if (returnType == typeof(ValueTask))
                  {{
                      return ValueTask.CompletedTask;
                  }}

                  if (returnType.IsGenericType)
                  {{
                      var definition = returnType.GetGenericTypeDefinition();
                      var valueType = returnType.GetGenericArguments()[0];
                      var value = CreateDecision(valueType, accepted);
                      if (definition == typeof(Task<>))
                      {{
                          return typeof(Task)
                              .GetMethod(nameof(Task.FromResult))!
                              .MakeGenericMethod(valueType)
                              .Invoke(null, [value]);
                      }}

                      if (definition == typeof(ValueTask<>))
                      {{
                          return Activator.CreateInstance(returnType, value);
                      }}
                  }}

                  return CreateDecision(returnType, accepted);
              }}

              private static object? CreateDecision(Type type, bool accepted)
              {{
                  var nullable = Nullable.GetUnderlyingType(type);
                  if (nullable is not null)
                  {{
                      return accepted ? CreateDecision(nullable, accepted: true) : null;
                  }}

                  if (type == typeof(bool))
                  {{
                      return accepted;
                  }}

                  if (type == typeof(string))
                  {{
                      return accepted ? "accepted" : "rejected";
                  }}

                  if (type.IsEnum)
                  {{
                      var preferred = accepted
                          ? new[] {{ "accepted", "valid", "allowed", "passed", "success" }}
                          : new[] {{ "rejected", "invalid", "denied", "failed", "blocked" }};
                      var name = Enum.GetNames(type).FirstOrDefault(candidate =>
                          preferred.Any(token => candidate.Contains(
                              token,
                              StringComparison.OrdinalIgnoreCase)));
                      return name is not null
                          ? Enum.Parse(type, name)
                          : Enum.GetValues(type).GetValue(accepted ? 0 : Math.Max(0, Enum.GetValues(type).Length - 1));
                  }}

                  var namedMember = accepted
                      ? new[] {{ "Accepted", "Valid", "Allowed", "Success", "Passed" }}
                      : new[] {{ "Rejected", "Invalid", "Denied", "Failure", "Blocked" }};
                  foreach (var name in namedMember)
                  {{
                      var property = type.GetProperty(
                          name,
                          BindingFlags.Public | BindingFlags.Static | BindingFlags.IgnoreCase);
                      if (property?.GetMethod is not null)
                      {{
                          return property.GetValue(null);
                      }}

                      var field = type.GetField(
                          name,
                          BindingFlags.Public | BindingFlags.Static | BindingFlags.IgnoreCase);
                      if (field is not null)
                      {{
                          return field.GetValue(null);
                      }}

                      var method = type.GetMethod(
                          name,
                          BindingFlags.Public | BindingFlags.Static | BindingFlags.IgnoreCase,
                          binder: null,
                          types: Type.EmptyTypes,
                          modifiers: null);
                      if (method is not null)
                      {{
                          return method.Invoke(null, null);
                      }}
                  }}

                  foreach (var constructor in type.GetConstructors()
                               .OrderBy(candidate => candidate.GetParameters().Length))
                  {{
                      var parameters = constructor.GetParameters();
                      var arguments = new object?[parameters.Length];
                      var supported = true;
                      for (var index = 0; index < parameters.Length; index++)
                      {{
                          var parameter = parameters[index];
                          var parameterType = parameter.ParameterType;
                          if (parameterType == typeof(bool))
                          {{
                              arguments[index] = accepted;
                          }}
                          else if (parameterType == typeof(string))
                          {{
                              arguments[index] = accepted ? "accepted" : "rejected";
                          }}
                          else if (parameterType == typeof(Guid))
                          {{
                              arguments[index] = Guid.CreateVersion7();
                          }}
                          else if (parameterType == typeof(DateTimeOffset))
                          {{
                              arguments[index] = DateTimeOffset.UtcNow;
                          }}
                          else if (parameterType.IsEnum)
                          {{
                              arguments[index] = CreateDecision(parameterType, accepted);
                          }}
                          else if (Nullable.GetUnderlyingType(parameterType) is not null)
                          {{
                              arguments[index] = null;
                          }}
                          else if (parameter.HasDefaultValue)
                          {{
                              arguments[index] = parameter.DefaultValue;
                          }}
                          else
                          {{
                              supported = false;
                              break;
                          }}
                      }}

                      if (supported)
                      {{
                          return constructor.Invoke(arguments);
                      }}
                  }}

                  throw new InvalidOperationException(
                      $"Acceptance anti-abuse verifier cannot construct decision type '{{type}}'.");
              }}
          }}
          '''.replace('          ', ''),
              encoding='utf-8',
              newline='\n')

          acceptance_matches = []
          for path in (root / 'tests/Acceptance/Acceptance.Runner').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              if 'acceptance-token-required-at-runtime' in text:
                  acceptance_matches.append((path, text))
          if len(acceptance_matches) != 1:
              raise RuntimeError(
                  f'Expected one Acceptance anti-abuse placeholder, found {len(acceptance_matches)}.')
          path, text = acceptance_matches[0]
          path.write_text(
              text.replace(
                  '"acceptance-token-required-at-runtime"',
                  '$"acceptance-{Guid.CreateVersion7():N}"'),
              encoding='utf-8',
              newline='\n')

      - name: Restore Analytics and Acceptance owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Analytics tests/Analytics tests/Acceptance -name '*.csproj' -type f | sort)
          test "${#projects[@]}" -gt 0
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done

      - name: Format and verify changed owner projects
        shell: bash
        run: |
          projects=(
            src/Analytics/Analytics.Api/Analytics.Api.csproj
            tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj
          )
          for project in "${projects[@]}"; do
            dotnet format "$project" --no-restore
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Build Analytics production graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Analytics -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror /m:1 /nr:false
          done

      - name: Test Analytics and Acceptance graph
        shell: bash
        run: |
          mapfile -t analytics_tests < <(find tests/Analytics -name '*.csproj' -type f | sort)
          for project in "${analytics_tests[@]}"; do
            dotnet test "$project" --no-restore -warnaserror \
              --logger 'console;verbosity=normal' /m:1 /nr:false
          done
          dotnet build tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj \
            --no-restore -warnaserror /m:1 /nr:false

      - name: Prove Acceptance-only isolation
        shell: bash
        run: |
          grep -q 'builder.Environment.IsEnvironment("Acceptance")' \
            src/Analytics/Analytics.Api/Program.cs
          grep -q 'RemoveAll<IAntiAbuseVerifier>' \
            src/Analytics/Analytics.Api/Program.cs
          if grep -R --line-number --include='*.cs' \
            'acceptance-token-required-at-runtime' tests/Acceptance; then
            echo 'Acceptance anti-abuse placeholder remains.' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.cs' \
            'AcceptanceAntiAbuseVerifierProxy' \
            src/Analytics/Analytics.Domain \
            src/Analytics/Analytics.Contracts \
            src/Analytics/Analytics.Application \
            src/Analytics/Analytics.Infrastructure; then
            echo 'Acceptance-only verifier leaked below the Analytics API composition root.' >&2
            exit 1
          fi

      - name: Commit proven Acceptance anti-abuse boundary and remove this workflow
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- src/Analytics tests/Analytics tests/Acceptance)
            test -z "$affected" || {
              printf 'Analytics or Acceptance changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm .github/workflows/implement-analytics-acceptance-antibuse.yml
          paths=(
            src/Analytics
            tests/Analytics
            tests/Acceptance
            .github/workflows/implement-analytics-acceptance-antibuse.yml
          )
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Add Acceptance-only Analytics anti-abuse verifier' \
            | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Analytics Acceptance anti-abuse boundary: ${process.env.JOB_STATUS}`,
              context: 'ci/analytics-acceptance-antibuse'
            });
