name: Repair literal-aware credential scanner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-credential-scanner.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-credential-scanner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Repair the credential scanner and repository-owned placeholders
        shell: python
        run: |
          from pathlib import Path

          scanner_path = Path('tests/Architecture.Tests/RepositorySecurityRulesTests.cs')
          content = scanner_path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global content
              actual = content.count(old)
              if actual != expected:
                  raise RuntimeError(
                      f'Unexpected scanner anchor count: expected {expected}, actual {actual}')
              content = content.replace(old, new)

          replace_exact(
              'value.Contains("$(`", StringComparison.Ordinal)',
              'value.Contains("$(", StringComparison.Ordinal)')
          replace_exact(
              'private static IReadOnlyList<string> FindCommittedCredentialValues(',
              'private static string[] FindCommittedCredentialValues(')

          method_start_token = (
              '    [Fact]\n'
              '    public void CredentialScannerRejectsLiteralAssignmentsAndConnectionStrings()')
          method_end_token = (
              '\n    [Fact]\n'
              '    public void CredentialScannerAcceptsReferencesAndNonCredentialRuntimeTokens()')
          method_start = content.index(method_start_token)
          method_end = content.index(method_end_token, method_start)
          replacement_method = '''    [Fact]
              public void CredentialScannerRejectsLiteralAssignmentsAndConnectionStrings()
              {
                  var literalPassword = string.Concat("production", "-", "password");
                  var literalToken = string.Concat("production", "-", "bearer", "-", "token");
                  var literalDatabasePassword = string.Concat(
                      "production",
                      "-",
                      "database",
                      "-",
                      "password");
                  var literalClientSecret = string.Concat("production", "-", "client", "-", "secret");
                  var literalApiKey = string.Concat("production", "-", "api", "-", "key");
                  var configuration = $"""
                  POSTGRES_PASSWORD: {literalPassword}
                  TOKEN: {literalToken}
                  ConnectionStrings__Catalog: Host=db;Database=catalog;Password={literalDatabasePassword}
                  """;
                  var source = $"""
                  private const string ClientSecret = "{literalClientSecret}";
                  """;
                  var xml = $"<ApiKey>{literalApiKey}</ApiKey>";

                  var failures = FindCommittedCredentialValues(configuration, "fixture.yml")
                      .Concat(FindCommittedCredentialValues(source, "fixture.cs"))
                      .Concat(FindCommittedCredentialValues(xml, "fixture.xml"))
                      .ToArray();

                  Assert.Equal(5, failures.Length);
              }
          '''.replace('              ', '')
          content = content[:method_start] + replacement_method + content[method_end:]

          accepted_fixture_anchor = '''        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
              CLIENT_SECRET: <secret-mount>
              ACCESS_TOKEN: {{ .Secrets.AccessToken }}
          '''.replace('              ', '')
          accepted_fixture_replacement = '''        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
              CLIENT_SECRET: <secret-mount>
              ACCESS_TOKEN: {{ .Secrets.AccessToken }}
              WORKER_TOKEN: acceptance-worker-token
          '''.replace('              ', '')
          replace_exact(accepted_fixture_anchor, accepted_fixture_replacement)

          converted = 0
          output = []
          suffix = '", RegexOptions.CultureInvariant)]'
          for line in content.splitlines():
              if '[GeneratedRegex(@"' in line:
                  if line.count('[GeneratedRegex(@"') != 1 or not line.endswith(suffix):
                      raise RuntimeError(f'Unexpected GeneratedRegex attribute shape: {line}')
                  line = line.replace('[GeneratedRegex(@"', '[GeneratedRegex("""', 1)
                  line = line[:-len(suffix)] + '""", RegexOptions.CultureInvariant)]'
                  converted += 1
              output.append(line)

          if converted < 10:
              raise RuntimeError(f'Expected the complete scanner regex registry, converted {converted}.')

          configuration_regex = (
              '    [GeneratedRegex("""(?im)^[ \\t]*(?:-[ \\t]*)?'
              '(?:export[ \\t]+)?\\$?(?:\\[[ \\t]*["\']'
              '(?<name>[A-Za-z_][A-Za-z0-9_.:-]*)["\'][ \\t]*\\]|'
              '["\']?(?<name>[A-Za-z_][A-Za-z0-9_.:-]*)["\']?)'
              '[ \\t]*(?:=|:)[ \\t]*(?<value>[^\\r\\n#]*)""", '
              'RegexOptions.CultureInvariant)]')
          safe_marker_regex = (
              '    [GeneratedRegex("""(?i)(?:^|[-_.:/])'
              '(?:test|testing|example|fixture|dummy|fake|local|development|dev|'
              'acceptance|change[-_]?me|replace[-_]?me|required|placeholder|'
              'not[-_]?a[-_]?secret)(?:$|[-_.:/])""", '
              'RegexOptions.CultureInvariant)]')

          for index, line in enumerate(output):
              stripped = line.strip()
              if stripped == 'private static partial Regex ConfigurationCredentialAssignmentRegex();':
                  output[index - 1] = configuration_regex
              elif stripped == 'private static partial Regex SafeCredentialMarkerRegex();':
                  output[index - 1] = safe_marker_regex

          scanner_path.write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')

          Path('.env.example').write_text(
              '''CATALOG_DB_PASSWORD=CHANGE_ME
          INGESTION_DB_PASSWORD=CHANGE_ME
          QUERY_DB_PASSWORD=CHANGE_ME
          ANALYTICS_DB_PASSWORD=CHANGE_ME
          PROMOTION_DB_PASSWORD=CHANGE_ME
          RABBITMQ_USER=aggregator
          RABBITMQ_PASSWORD=CHANGE_ME
          OBJECT_STORAGE_ACCESS_KEY=CHANGE_ME
          OBJECT_STORAGE_SECRET_KEY=CHANGE_ME_AT_LEAST_32_CHARACTERS
          AUTHORITY=https://identity.example
          CATALOG_API_PORT=18081
          INGESTION_API_PORT=18082
          QUERY_API_PORT=18083
          ANALYTICS_API_PORT=18084
          PROMOTION_API_PORT=18085
          RABBITMQ_MANAGEMENT_PORT=15672
          OBJECT_STORAGE_CONSOLE_PORT=19001
          '''.replace('          ', ''),
              encoding='utf-8',
              newline='\n')

          runbook_path = Path('docs/runbooks/catalog-event-delivery.md')
          runbook = runbook_path.read_text(encoding='utf-8')
          old_connection = (
              'ConnectionStrings__Catalog=Host=...;Database=...;Username=...;Password=...')
          new_connection = (
              'ConnectionStrings__Catalog=Host=...;Database=...;Username=...;'
              'Password=${CATALOG_DB_PASSWORD}')
          if runbook.count(old_connection) != 1:
              raise RuntimeError('Expected exactly one Catalog runbook credential placeholder.')
          runbook_path.write_text(
              runbook.replace(old_connection, new_connection),
              encoding='utf-8',
              newline='\n')

      - name: Restore Architecture proof
        run: dotnet restore tests/Architecture.Tests/Architecture.Tests.csproj

      - name: Format and verify Architecture proof
        run: |
          dotnet format tests/Architecture.Tests/Architecture.Tests.csproj --no-restore
          dotnet format tests/Architecture.Tests/Architecture.Tests.csproj --verify-no-changes --no-restore

      - name: Build Architecture proof
        run: |
          dotnet build tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-restore -warnaserror /m:1 /nr:false

      - name: Run Architecture proof
        run: |
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-build --no-restore -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Commit proven scanner and remove one-shot workflow
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- \
              tests/Architecture.Tests/RepositorySecurityRulesTests.cs \
              .env.example \
              docs/runbooks/catalog-event-delivery.md)
            test -z "$affected" || {
              printf 'Credential proof owner changed during validation:\n%s\n' "$affected" >&2
              exit 1
            }
          fi

          git rm .github/workflows/repair-credential-scanner.yml
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- \
            tests/Architecture.Tests/RepositorySecurityRulesTests.cs \
            .env.example \
            docs/runbooks/catalog-event-delivery.md \
            .github/workflows/repair-credential-scanner.yml
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Prove literal-aware repository credential scanning' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Credential scanner proof: ${process.env.JOB_STATUS}`,
              context: 'ci/architecture-credential-scanner'
            });
