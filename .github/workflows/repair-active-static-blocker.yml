name: Repair only known active static blocker patterns

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-active-static-blocker.yml'
      - '.codex/ci/active-blocker-errors.txt'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: canonical-static-convergence
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Apply only reviewed and mechanical repairs
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/repair-known.log
          from pathlib import Path
          import re
          import textwrap

          diagnostic_path = Path('.codex/ci/active-blocker-errors.txt')
          diagnostic = diagnostic_path.read_text(encoding='utf-8') if diagnostic_path.exists() else ''
          stabilization_path = Path('.codex/ci/stabilization-controller-blocker.txt')
          stabilization = stabilization_path.read_text(encoding='utf-8') if stabilization_path.exists() else ''
          if diagnostic == '' and stabilization == '':
              print('No active blocker exists; no repair is required.')
              raise SystemExit(0)
          if stabilization and 'gate=Canonical atomic static gate' not in stabilization:
              print('The active stabilization blocker is downstream of the static gate; no static repair is allowed.')
              raise SystemExit(0)

          convergence = Path('.github/workflows/converge-static-gate.yml')
          stale_outbox = Path('tests/Architecture.Tests/CatalogOutboxContractTests.cs')
          obsolete_ingestion = Path(
              'src/Ingestion/Ingestion.Application/IngestionPackageProcessingService.cs')
          needs_reviewed_repairs = (
              obsolete_ingestion.exists() or
              (stale_outbox.exists() and '"lease_owner"' in stale_outbox.read_text(encoding='utf-8')) or
              'CatalogOutboxContractTests' in diagnostic or
              'RepositorySecurityRulesTests' in diagnostic)
          if needs_reviewed_repairs:
              if not convergence.exists():
                  raise RuntimeError(
                      'A reviewed architecture/Ingestion repair is required but its convergence source is missing.')
              source = convergence.read_text(encoding='utf-8')
              marker = "      - name: Apply pending reviewed owner repairs idempotently\n"
              start = source.index(marker)
              run_marker = "        run: |\n"
              start = source.index(run_marker, start) + len(run_marker)
              end = source.index(
                  "\n      - name: Prove duplicate owners are absent after convergence",
                  start)
              exec(compile(
                  textwrap.dedent(source[start:end]),
                  str(convergence),
                  'exec'))

          # Mechanical analyzer repair: only one-character Contains overloads.
          ca1847 = re.compile(
              r'\.Contains\("(?P<char>[^"\\])",\s*StringComparison\.(?:Ordinal|OrdinalIgnoreCase)\)')
          # IgnoreCase cannot be represented by the char overload; repair only Ordinal occurrences.
          ca1847_ordinal = re.compile(
              r'\.Contains\("(?P<char>[^"\\])",\s*StringComparison\.Ordinal\)')
          # Mechanical SHA-256 lowercase repair with identical semantics.
          hex_lower = re.compile(
              r'Convert\.ToHexString\((?P<value>[^\n;]+)\)\.ToLowerInvariant\(\)')

          changed = []
          for root in (Path('src'), Path('tests'), Path('tools')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  original = path.read_text(encoding='utf-8')
                  rewritten = ca1847_ordinal.sub(
                      lambda match: f".Contains('{match.group('char')}')",
                      original)
                  rewritten = hex_lower.sub(
                      lambda match: f"Convert.ToHexStringLower({match.group('value')})",
                      rewritten)
                  if rewritten != original:
                      path.write_text(rewritten, encoding='utf-8', newline='\n')
                      changed.append(path.as_posix())
          print('Mechanical changes:', *changed, sep='\n')
          PY

      - name: Restore canonical solution
        id: restore
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet restore AggregatorBackend.slnx 2>&1 | tee /tmp/repair-restore.log

      - name: Format canonical solution
        id: format
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet format AggregatorBackend.slnx --no-restore 2>&1 | tee /tmp/repair-format.log
          dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore \
            2>&1 | tee -a /tmp/repair-format.log

      - name: Build canonical solution
        id: build
        if: steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build AggregatorBackend.slnx --no-restore -warnaserror /m:1 /nr:false \
            2>&1 | tee /tmp/repair-build.log

      - name: Test canonical solution
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test AggregatorBackend.slnx --no-build -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false \
            2>&1 | tee /tmp/repair-test.log

      - name: Determine repair result
        id: result
        shell: bash
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          if [ "$REPAIR_OUTCOME" = success ] && \
             [ "$RESTORE_OUTCOME" = success ] && \
             [ "$FORMAT_OUTCOME" = success ] && \
             [ "$BUILD_OUTCOME" = success ] && \
             [ "$TEST_OUTCOME" = success ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh exact unresolved diagnostic
        if: steps.result.outputs.passed != 'true'
        uses: actions/github-script@v9
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const fs = require('fs');
            const stages = [
              ['repair', process.env.REPAIR_OUTCOME, '/tmp/repair-known.log'],
              ['restore', process.env.RESTORE_OUTCOME, '/tmp/repair-restore.log'],
              ['format', process.env.FORMAT_OUTCOME, '/tmp/repair-format.log'],
              ['build', process.env.BUILD_OUTCOME, '/tmp/repair-build.log'],
              ['test', process.env.TEST_OUTCOME, '/tmp/repair-test.log']
            ];
            let text = `source_run=${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            for (const [name, outcome, path] of stages) {
              text += `\n## ${name} (${outcome})\n`;
              if (!fs.existsSync(path)) continue;
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              const relevant = lines.filter(line =>
                /\berror\b|\bfailed\b|\bfailure\b|\bexception\b|\bCS\d{4}\b|\bCA\d{4}\b|Assert\./i.test(line));
              text += `${(relevant.length > 0 ? relevant : lines).slice(-240).join('\n')}\n`;
            }
            const path = '.codex/ci/active-blocker-errors.txt';
            let existing = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              if (!Array.isArray(response.data)) existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Refresh unresolved static blocker [skip ci]',
              content: Buffer.from(text, 'utf8').toString('base64'),
              ...(existing ? { sha: existing.sha } : {})
            });

      - name: Commit only a fully green repair
        if: steps.result.outputs.passed == 'true'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          test "$base" = "$(git rev-parse HEAD)" || {
            echo 'main changed during repair proof; refusing a mixed-base commit.' >&2
            exit 1
          }
          rm -f \
            .codex/ci/active-blocker-errors.txt \
            .codex/ci/canonical-static-gate-blocker.md \
            .codex/ci/stabilization-controller-blocker.txt
          git rm .github/workflows/repair-active-static-blocker.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Repair proven canonical static blockers' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish status
        if: always()
        uses: actions/github-script@v9
        env:
          PASSED: ${{ steps.result.outputs.passed }}
        with:
          script: |
            const passed = process.env.PASSED === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: passed ? 'Known static blocker repair passed' : 'Unknown or unresolved static blocker remains',
              context: 'ci/known-static-repair'
            });

      - name: Fail when an unresolved blocker remains
        if: steps.result.outputs.passed != 'true'
        run: exit 1
