name: generate-query-promotion-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/QueryPromotionOverlayGenerator/**"
      - "src/Query/Query.Domain/**"
      - "src/Query/Query.Application/**"
      - "src/Query/Query.Infrastructure/**"
      - "src/Promotion/Promotion.Contracts/**"
      - ".github/workflows/generate-query-promotion-worker.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: generate-query-promotion-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Format and compile generator
        run: |
          dotnet format tools/QueryPromotionOverlayGenerator/QueryPromotionOverlayGenerator.csproj
          dotnet build tools/QueryPromotionOverlayGenerator/QueryPromotionOverlayGenerator.csproj -warnaserror
      - name: Generate typed Promotion event consumer
        run: dotnet run --project tools/QueryPromotionOverlayGenerator/QueryPromotionOverlayGenerator.csproj --no-build
      - name: Format generated worker
        run: |
          dotnet format src/Query/Query.PromotionWorker/Query.PromotionWorker.csproj
          dotnet format tests/Query/Query.PromotionWorker.Tests/Query.PromotionWorker.Tests.csproj
      - name: Compile and test generated worker
        run: |
          dotnet build src/Query/Query.PromotionWorker/Query.PromotionWorker.csproj -warnaserror
          dotnet test tests/Query/Query.PromotionWorker.Tests/Query.PromotionWorker.Tests.csproj
      - name: Commit generated worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Query/Query.PromotionWorker tests/Query/Query.PromotionWorker.Tests docs/generated/query-promotion-worker-generation.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Query promotion overlay consumer"
          git push origin HEAD:main
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Query promotion overlay: ${process.env.JOB_STATUS}`,
              context: 'ci/query-promotion-overlay-generation'
            });
