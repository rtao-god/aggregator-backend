name: Continue after canonical static gate

on:
  workflow_run:
    workflows: ["Converge canonical static gate with diagnostics"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-contract-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the repository contract artifact proof
        uses: actions/github-script@v9
        with:
          script: |
            const workflow_id = 'contract-artifacts.yml';
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id
            });
            if (workflow.state !== 'active') {
              core.setFailed(`Contract proof workflow is not active: ${workflow.state}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: 'main'
            });
