name: Repair Platform Messaging owner proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-platform-messaging-owner.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-platform-messaging-owner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore the canonical payload-integrity boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8', newline='\n')

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              content = read(path)
              actual = content.count(old)
              if actual != expected:
                  raise RuntimeError(
                      f'Unexpected anchor count in {path}: expected {expected}, actual {actual}.')
              write(path, content.replace(old, new))

          write(
              'src/BuildingBlocks/Platform.Messaging/OutboxMessageIntegrity.cs',
              '''using System.Security.Cryptography;
          using System.Text;

          namespace Platform.Messaging;

          /// <summary>Verifies the producer-owned digest against the exact UTF-8 outbox payload.</summary>
          public static class OutboxMessageIntegrity
          {
              /// <summary>Returns exact payload bytes only after canonical SHA-256 verification succeeds.</summary>
              public static byte[] GetVerifiedPayloadBytes(OutboxMessage message)
              {
                  ArgumentNullException.ThrowIfNull(message);
                  ArgumentNullException.ThrowIfNull(message.PayloadJson);
                  if (!IsCanonicalSha256Digest(message.PayloadDigest))
                  {
                      throw new InvalidOperationException(
                          $"Outbox message '{message.MessageId}' has an invalid SHA-256 digest representation.");
                  }

                  var payloadBytes = Encoding.UTF8.GetBytes(message.PayloadJson);
                  var expectedDigest = Convert.FromHexString(message.PayloadDigest);
                  var actualDigest = SHA256.HashData(payloadBytes);
                  if (!CryptographicOperations.FixedTimeEquals(expectedDigest, actualDigest))
                  {
                      throw new InvalidOperationException(
                          $"Outbox message '{message.MessageId}' payload digest does not match its exact UTF-8 payload.");
                  }

                  return payloadBytes;
              }

              private static bool IsCanonicalSha256Digest(string? value) =>
                  value is { Length: 64 } &&
                  value.All(static character =>
                      character is >= '0' and <= '9' or >= 'a' and <= 'f');
          }
          '''.replace('          ', ''))

          dispatcher = 'src/BuildingBlocks/Platform.Messaging/PostgresOutboxDispatcher.cs'
          replace_exact(
              dispatcher,
              '            try\n'
              '            {\n'
              '                await _publisher.PublishAsync(message, cancellationToken);\n',
              '            try\n'
              '            {\n'
              '                _ = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);\n'
              '                await _publisher.PublishAsync(message, cancellationToken);\n')

          publisher = 'src/BuildingBlocks/Platform.Messaging/RabbitMqEventPublisher.cs'
          replace_exact(publisher, 'using System.Text;\n', '')
          replace_exact(
              publisher,
              '        ArgumentNullException.ThrowIfNull(message);\n'
              '        var channel = await GetChannelAsync(cancellationToken);\n',
              '        ArgumentNullException.ThrowIfNull(message);\n'
              '        var body = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);\n'
              '        var channel = await GetChannelAsync(cancellationToken);\n')
          replace_exact(
              publisher,
              '        var body = Encoding.UTF8.GetBytes(message.PayloadJson);\n'
              '        await channel.BasicPublishAsync(\n',
              '        await channel.BasicPublishAsync(\n')

          integration = (
              'tests/BuildingBlocks/Platform.Messaging.Tests/'
              'PostgresOutboxDispatcherIntegrationTests.cs')
          replace_exact(
              integration,
              '                Table = "outbox_message",\n',
              '')
          replace_exact(integration, 'lease_owner', 'leased_by', expected=3)
          replace_exact(
              integration,
              'lease_until_utc',
              'lease_expires_at_utc',
              expected=3)
          replace_exact(
              integration,
              '            var dispatcher = CreateDispatcher(\n'
              '                scope,\n'
              '                new IntegrityPublisher(),\n'
              '                maximumDeliveryAttempts: 1);\n\n'
              '            var exception = await Assert.ThrowsAsync<InvalidOperationException>(() =>\n'
              '                dispatcher.DispatchOnceAsync(CancellationToken.None));\n\n'
              '            Assert.Contains("digest does not match", exception.Message, StringComparison.Ordinal);\n',
              '            var publisher = new RecordingPublisher();\n'
              '            var dispatcher = CreateDispatcher(\n'
              '                scope,\n'
              '                publisher,\n'
              '                maximumDeliveryAttempts: 1);\n\n'
              '            var exception = await Assert.ThrowsAsync<InvalidOperationException>(() =>\n'
              '                dispatcher.DispatchOnceAsync(CancellationToken.None));\n\n'
              '            Assert.Contains("digest does not match", exception.Message, StringComparison.Ordinal);\n'
              '            Assert.Empty(publisher.Messages);\n')
          replace_exact(
              integration,
              '            cancellationToken.ThrowIfCancellationRequested();\n'
              '            _ = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);\n'
              '            Messages.Add(message);\n',
              '            cancellationToken.ThrowIfCancellationRequested();\n'
              '            Messages.Add(message);\n')
          replace_exact(
              integration,
              '    private sealed class IntegrityPublisher : IIntegrationEventPublisher\n'
              '    {\n'
              '        public Task PublishAsync(OutboxMessage message, CancellationToken cancellationToken)\n'
              '        {\n'
              '            cancellationToken.ThrowIfCancellationRequested();\n'
              '            _ = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);\n'
              '            return Task.CompletedTask;\n'
              '        }\n'
              '    }\n\n',
              '')
          replace_exact(
              integration,
              '        {\n'
              '            _ = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);\n'
              '            await scope.ReplaceLeaseAsync(\n',
              '        {\n'
              '            await scope.ReplaceLeaseAsync(\n')

          e2e = (
              'tests/BuildingBlocks/Platform.Messaging.Tests/'
              'PostgresRabbitMqOutboxEndToEndTests.cs')
          replace_exact(
              e2e,
              '                    Table = "outbox_message",\n',
              '')
          replace_exact(e2e, 'lease_owner', 'leased_by', expected=2)
          replace_exact(
              e2e,
              'lease_until_utc',
              'lease_expires_at_utc',
              expected=2)

          rabbit_tests = (
              'tests/BuildingBlocks/Platform.Messaging.Tests/'
              'RabbitMqEventPublisherIntegrationTests.cs')
          replace_exact(
              rabbit_tests,
              '    private static async Task<BasicGetResult> GetEventuallyAsync(IChannel channel, string queueName)\n',
              '''    [Fact]
              public async Task CorruptedPayloadIsRejectedBeforeBrokerConnection()
              {
                  var validMessage = CreateMessage();
                  var corruptedMessage = validMessage with { PayloadJson = "{}" };
                  await using var publisher = new RabbitMqEventPublisher(new RabbitMqPublisherOptions
                  {
                      BrokerUri = new Uri("amqp://127.0.0.1:1", UriKind.Absolute),
                      Exchange = "platform.messaging.integrity-test",
                      ClientProvidedName = "platform-messaging-integrity-test",
                  });

                  var exception = await Assert.ThrowsAsync<InvalidOperationException>(() =>
                      publisher.PublishAsync(corruptedMessage, CancellationToken.None));

                  Assert.Contains("digest does not match", exception.Message, StringComparison.Ordinal);
              }

              private static async Task<BasicGetResult> GetEventuallyAsync(IChannel channel, string queueName)
              '''.replace('              ', ''))

          replace_exact(
              'tests/Catalog/Catalog.Api.Tests/CatalogCorrelationContractTests.cs',
              '        using var response = await client.SendAsync(request, TestContext.Current.CancellationToken);\n',
              '        using var response = await client.SendAsync(request, CancellationToken.None);\n')

          messaging_module = '.codex/modules/messaging.md'
          replace_exact(
              messaging_module,
              'Every context outbox adapter must expose the exact columns consumed by `PostgresOutboxDispatcher`: message identity, routing key, contract identity, canonical payload, payload digest, UTC occurrence, correlation/causation, lease, delivery attempt count, dispatch completion, and explicit dead-letter state.\n',
              'Every context outbox adapter must expose the fixed `outbox_message` table inside its owner schema with the exact columns consumed by `PostgresOutboxDispatcher`: message identity, routing key, contract identity, canonical payload, payload digest, UTC occurrence, correlation/causation, lease, delivery attempt count, dispatch completion, and explicit dead-letter state. The table name is not consumer configuration.\n')
          replace_exact(
              messaging_module,
              'The dispatcher uses `FOR UPDATE SKIP LOCKED` only for queue claiming. Exhausted expired leases are moved to an operator-visible dead-letter state before another claim. A failed final attempt is dead-lettered in the same failure update; it is not silently retried forever.\n',
              'The dispatcher uses `FOR UPDATE SKIP LOCKED` only for queue claiming. Before any publisher is invoked, `OutboxMessageIntegrity` verifies the canonical lowercase SHA-256 digest against the exact UTF-8 payload. The RabbitMQ adapter applies the same owner helper before opening a broker channel, so direct adapter use cannot bypass integrity. Exhausted expired leases are moved to an operator-visible dead-letter state before another claim. A failed final attempt is dead-lettered in the same failure update; it is not silently retried forever.\n')
          replace_exact(
              messaging_module,
              '- context migrations must prove the required columns and indexes on real PostgreSQL;\n'
              '- broker delivery and redelivery require integration proof before release.\n',
              '- payload-integrity tests reject non-canonical digests and changed payloads before publisher or broker access;\n'
              '- context migrations must prove the required columns and indexes on real PostgreSQL;\n'
              '- broker delivery and redelivery require integration proof before release.\n')
          PY

      - name: Prove stale messaging contracts are absent
        shell: bash
        run: |
          if grep -R --line-number --include='*.cs' \
            -E 'Table = "outbox_message"|lease_owner|lease_until_utc' \
            tests/BuildingBlocks/Platform.Messaging.Tests; then
            echo 'A stale Platform.Messaging test contract remains.' >&2
            exit 1
          fi
          grep -F 'OutboxMessageIntegrity.GetVerifiedPayloadBytes(message)' \
            src/BuildingBlocks/Platform.Messaging/PostgresOutboxDispatcher.cs
          grep -F 'var body = OutboxMessageIntegrity.GetVerifiedPayloadBytes(message);' \
            src/BuildingBlocks/Platform.Messaging/RabbitMqEventPublisher.cs

      - name: Restore affected owner graph
        shell: bash
        run: |
          dotnet restore tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj
          dotnet restore tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj
          dotnet restore tests/Architecture.Tests/Architecture.Tests.csproj

      - name: Format and verify affected owner graph
        shell: bash
        run: |
          projects=(
            src/BuildingBlocks/Platform.Messaging/Platform.Messaging.csproj
            tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj
            tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet format "$project" --no-restore
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Build affected owner graph
        shell: bash
        run: |
          dotnet build tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj \
            --no-restore -warnaserror /m:1 /nr:false
          dotnet build tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj \
            --no-restore -warnaserror /m:1 /nr:false

      - name: Test affected owner graph
        shell: bash
        run: |
          dotnet test tests/BuildingBlocks/Platform.Messaging.Tests/Platform.Messaging.Tests.csproj \
            --no-build --no-restore -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false
          dotnet test tests/Catalog/Catalog.Api.Tests/Catalog.Api.Tests.csproj \
            --no-build --no-restore -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Prove related architecture contracts
        shell: bash
        run: |
          filter='FullyQualifiedName~Architecture.Tests.CatalogOutboxContractTests|FullyQualifiedName=Architecture.Tests.RepositorySecurityRulesTests.CommandControllersRequireExplicitAuthorization'
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-restore -warnaserror --filter "$filter" \
            --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Commit proven owner repair and remove this workflow
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- \
              src/BuildingBlocks/Platform.Messaging \
              tests/BuildingBlocks/Platform.Messaging.Tests \
              tests/Catalog/Catalog.Api.Tests/CatalogCorrelationContractTests.cs \
              .codex/modules/messaging.md)
            test -z "$affected" || {
              printf 'Messaging owner changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm .github/workflows/repair-platform-messaging-owner.yml
          paths=(
            src/BuildingBlocks/Platform.Messaging
            tests/BuildingBlocks/Platform.Messaging.Tests
            tests/Catalog/Catalog.Api.Tests/CatalogCorrelationContractTests.cs
            .codex/modules/messaging.md
            .github/workflows/repair-platform-messaging-owner.yml
          )
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Restore Platform Messaging payload integrity boundary' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Platform Messaging owner proof: ${process.env.JOB_STATUS}`,
              context: 'ci/platform-messaging-owner'
            });
