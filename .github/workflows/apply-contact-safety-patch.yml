name: apply-contact-safety-patch

on:
  push:
    branches: [main]
    paths:
      - .codex/patches/contact-safety/**
      - .github/workflows/apply-contact-safety-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-contact-safety-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply owner patch and remove bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          for patch in .codex/patches/contact-safety/*.patch; do
            git apply --index --whitespace=error-all "$patch"
          done
          rm -rf .codex/patches/contact-safety
          rm .github/workflows/apply-contact-safety-patch.yml
          git add -A
          git diff --cached --check
          git commit -m "Complete stable contact visibility suppression"
          git push origin HEAD:main
