name: apply-contact-safety-patch

on:
  push:
    branches: [main]
    paths:
      - .codex/patches/contact-safety/**
      - .github/workflows/apply-contact-safety-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-contact-safety-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply source owner patch
        shell: bash
        run: |
          set -euo pipefail
          patch_root=.codex/patches/contact-safety
          if [[ ! -d "$patch_root" ]]; then
            exit 0
          fi
          git config user.name "rtao-god"
          git config user.email "rtaogod@gmail.com"
          shopt -s nullglob
          patches=("$patch_root"/*.patch)
          if (( ${#patches[@]} == 0 )); then
            exit 0
          fi
          for patch in "${patches[@]}"; do
            if [[ $(basename "$patch") == 03.patch ]]; then
              continue
            fi
            git apply --index --whitespace=error-all "$patch"
          done
          rm -rf "$patch_root"
          git add -A
          git diff --cached --check
          git commit -m "Complete stable contact visibility suppression"
          git push origin HEAD:main
