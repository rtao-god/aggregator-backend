name: Repair first authoritative solution blocker

on:
  push:
    branches: [main]
    paths:
      - '.codex/ci/authoritative-first-errors.txt'
      - '.github/workflows/repair-authoritative-first-error.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-authoritative-first-error
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Classify and repair only the captured first blocker
        shell: bash
        run: |
          set -euo pipefail
          diagnostics='.codex/ci/authoritative-first-errors.txt'
          test -s "$diagnostics" || {
            echo 'No captured authoritative diagnostics exist.' >&2
            exit 2
          }

          if grep -Eq \
            'RecordAnalyticsInteractionRequest|AnalyticsInteractionReceipt|AnalyticsListingMetricsResponse|AnalyticsInteractionKindContract|AcceptanceScenario\.cs' \
            "$diagnostics"; then
            test -f .github/workflows/repair-acceptance-analytics-compile.yml || {
              echo 'Acceptance repair source is absent.' >&2
              exit 3
            }
            python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/repair-acceptance-analytics-compile.yml').read_text(encoding='utf-8')
          heading = '      - name: Replace the retired Analytics consumer contract\n'
          block = source[source.index(heading):]
          marker = '        run: |\n'
          script_start = block.index(marker) + len(marker)
          next_step = block.index('\n      - name: Ensure Acceptance references canonical Analytics contracts', script_start)
          script = textwrap.dedent(block[script_start:next_step])
          exec(compile(script, 'repair-acceptance-analytics-compile.py', 'exec'))

          csproj_heading = '      - name: Ensure Acceptance references canonical Analytics contracts\n'
          csproj_block = source[source.index(csproj_heading):]
          csproj_start = csproj_block.index(marker) + len(marker)
          csproj_end = csproj_block.index('\n      - name: Restore Acceptance owner graph', csproj_start)
          csproj_script = textwrap.dedent(csproj_block[csproj_start:csproj_end])
          exec(compile(csproj_script, 'ensure-acceptance-analytics-reference.py', 'exec'))
          PY
            printf '%s\n' acceptance-analytics > .codex/ci/authoritative-repair-kind.txt
          elif grep -Eq 'CatalogIngestionApiFactory|CA1062.*command' "$diagnostics"; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          for path in Path('tests/Catalog').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              if 'UpsertAsync' in text and 'CatalogIngestionUpsertDraftCommand' in text:
                  candidates.append((path, text))
          if len(candidates) != 1:
              raise RuntimeError(f'Expected one Catalog ingestion test store, found {len(candidates)}.')
          path, text = candidates[0]
          pattern = re.compile(
              r'(public\s+Task<[^\n]+>\s+UpsertAsync\s*\([\s\S]*?'
              r'CatalogIngestionUpsertDraftCommand\s+command[\s\S]*?\)\s*\{\n)')
          match = pattern.search(text)
          if match is None:
              raise RuntimeError('Catalog ingestion UpsertAsync boundary was not found.')
          tail = text[match.end():match.end() + 400]
          if 'ArgumentNullException.ThrowIfNull(command);' not in tail:
              text = text[:match.end()] + '        ArgumentNullException.ThrowIfNull(command);\n' + text[match.end():]
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
            printf '%s\n' catalog-ingestion-null-guard > .codex/ci/authoritative-repair-kind.txt
          elif grep -Eq 'EndsWith.*StringComparison|CA1867|CA1847' "$diagnostics"; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*.cs'):
                  text = path.read_text(encoding='utf-8')
                  updated = re.sub(
                      r"\.EndsWith\((['\"][^'\"]{1}['\"]),\s*StringComparison\.Ordinal\)",
                      r'.EndsWith(\1)',
                      text)
                  updated = re.sub(
                      r"\.Contains\((['\"][^'\"]{1}['\"]),\s*StringComparison\.Ordinal\)",
                      r'.Contains(\1)',
                      updated)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8', newline='\n')
                      changed.append(str(path))
          if not changed:
              raise RuntimeError('Captured char-overload analyzer failure had no exact source match.')
          PY
            printf '%s\n' char-overload-analyzer > .codex/ci/authoritative-repair-kind.txt
          else
            echo 'The first authoritative blocker is not in the reviewed repair set:' >&2
            cat "$diagnostics" >&2
            exit 4
          fi

      - name: Restore authoritative solution
        shell: bash
        run: dotnet restore AggregatorBackend.slnx

      - name: Normalize only changed C# projects
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only -- '*.cs')
          declare -A projects=()
          for file in "${changed[@]}"; do
            directory=$(dirname "$file")
            while [ "$directory" != '.' ] && [ "$directory" != '/' ]; do
              project=$(find "$directory" -maxdepth 1 -name '*.csproj' -type f | head -n 1 || true)
              if [ -n "$project" ]; then
                projects["$project"]=1
                break
              fi
              directory=$(dirname "$directory")
            done
          done
          test "${#projects[@]}" -gt 0
          for project in "${!projects[@]}"; do
            dotnet format "$project" --no-restore
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Prove authoritative solution
        shell: bash
        run: |
          dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore
          dotnet build AggregatorBackend.slnx --no-restore -warnaserror /m:1 /nr:false
          dotnet test AggregatorBackend.slnx \
            --no-build --logger 'console;verbosity=normal' /m:1 /nr:false
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-build --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Reject retired Acceptance Analytics semantics when repaired
        shell: bash
        run: |
          if grep -q '^acceptance-analytics$' .codex/ci/authoritative-repair-kind.txt; then
            if grep -R --line-number --include='*.cs' \
              -E 'RecordAnalyticsInteractionRequest|AnalyticsInteractionReceipt|AnalyticsListingMetricsResponse|AnalyticsInteractionKindContract|X-Analytics-Internal-Key|api/analytics/interactions' \
              tests/Acceptance/Acceptance.Runner; then
              echo 'Retired Analytics consumer semantics remain after repair.' >&2
              exit 1
            fi
          fi

      - name: Commit proven first repair and remove one-shot repair files
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- src tests)
            test -z "$affected" || {
              printf 'Production or tests changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          kind=$(cat .codex/ci/authoritative-repair-kind.txt)
          git rm -f \
            .codex/ci/authoritative-first-errors.txt \
            .codex/ci/authoritative-repair-kind.txt \
            .github/workflows/repair-authoritative-first-error.yml
          if [ "$kind" = 'acceptance-analytics' ]; then
            git rm -f \
              .github/workflows/repair-acceptance-analytics-compile.yml \
              .github/workflows/refine-acceptance-analytics-compile.yml
          fi
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- src tests .codex/ci .github/workflows
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf 'Repair authoritative blocker: %s\n' "$kind" | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `First authoritative repair: ${process.env.JOB_STATUS}`,
              context: 'ci/repair-authoritative-first-error'
            });
