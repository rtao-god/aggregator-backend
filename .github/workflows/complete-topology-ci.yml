name: complete-topology-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/compose.complete.yaml"
      - "deploy/Dockerfile.dotnet-service"
      - "deploy/Caddyfile"
      - "deploy/postgres/**"
      - "src/**/Dockerfile"
      - "src/**/*.csproj"
      - ".github/workflows/complete-topology-ci.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: complete-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      POSTGIS_IMAGE: postgis/postgis:17-3.5
      RABBITMQ_IMAGE: rabbitmq:4-management
      SEAWEEDFS_IMAGE: chrislusf/seaweedfs:latest
      AWS_CLI_IMAGE: amazon/aws-cli:latest
      CLAMAV_IMAGE: clamav/clamav:stable
      CADDY_IMAGE: caddy:2
      POSTGRES_ADMIN_PASSWORD: acceptance-admin-password
      CATALOG_APP_PASSWORD: acceptance-catalog-app
      CATALOG_MIGRATOR_PASSWORD: acceptance-catalog-migrator
      QUERY_APP_PASSWORD: acceptance-query-app
      QUERY_MIGRATOR_PASSWORD: acceptance-query-migrator
      INGESTION_APP_PASSWORD: acceptance-ingestion-app
      INGESTION_MIGRATOR_PASSWORD: acceptance-ingestion-migrator
      ANALYTICS_APP_PASSWORD: acceptance-analytics-app
      ANALYTICS_MIGRATOR_PASSWORD: acceptance-analytics-migrator
      PROMOTION_APP_PASSWORD: acceptance-promotion-app
      PROMOTION_MIGRATOR_PASSWORD: acceptance-promotion-migrator
      RABBITMQ_USER: acceptance
      RABBITMQ_PASSWORD: acceptance-rabbit-password
      OBJECT_STORAGE_ACCESS_KEY: acceptance-access
      OBJECT_STORAGE_SECRET_KEY: acceptance-secret-key
      AUTHENTICATION_AUTHORITY: http://acceptance-issuer:8080
      CATALOG_MEDIA_SYSTEM_ACTOR_ID: 0198b700-0000-7000-8000-000000000099
      INGESTION_SYSTEM_ACTOR_ID: 0198b600-0000-7000-8000-000000000001
      PROMOTION_SYSTEM_ACTOR_ID: 0198b400-0000-7000-8000-000000000001
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment scripts
        run: |
          bash -n deploy/postgres/init/001-create-context-databases.sh
          bash -n deploy/postgres/grant-context.sh
      - name: Validate complete Compose interpolation and dependency graph
        run: docker compose -f deploy/compose.complete.yaml config --quiet
      - name: Prove five isolated database identities
        run: |
          for identity in catalog_db query_db ingestion_db analytics_db promotion_db; do
            grep -F "$identity" deploy/compose.complete.yaml >/dev/null
          done
          for role in catalog_app query_app ingestion_app analytics_app promotion_app; do
            grep -F "$role" deploy/compose.complete.yaml >/dev/null
          done
      - name: Build all backend deployable images
        run: |
          docker compose -f deploy/compose.complete.yaml build --parallel \
            catalog-migrations catalog-media-migrations query-migrations ingestion-migrations analytics-migrations promotion-migrations \
            catalog-api catalog-worker catalog-media-api catalog-media-worker \
            query-api query-worker query-promotion-worker \
            ingestion-api ingestion-worker \
            analytics-api analytics-worker \
            promotion-api promotion-worker
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Complete topology: ${process.env.JOB_STATUS}`,
              context: 'ci/complete-topology'
            });
