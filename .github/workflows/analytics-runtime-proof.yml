name: analytics-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - 'src/Analytics/**'
      - 'tests/Analytics/**'
      - 'tools/ContractArtifacts/**'
      - 'AggregatorBackend.slnx'
      - '.github/workflows/analytics-runtime-proof.yml'
  pull_request:
    paths:
      - 'src/Analytics/**'
      - 'tests/Analytics/**'
      - 'tools/ContractArtifacts/**'
      - 'AggregatorBackend.slnx'
      - '.github/workflows/analytics-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

concurrency:
  group: analytics-runtime-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Normalize Analytics source-generator declaration
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Analytics/Analytics.Domain/AnalyticsObservation.cs')
          source = path.read_text()
          old = 'public sealed record AnalyticsObservation\n'
          new = 'public sealed partial record AnalyticsObservation\n'
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('AnalyticsObservation declaration changed unexpectedly.')
      - name: Synchronize all physical projects into the solution
        shell: bash
        run: |
          mapfile -t projects < <(find src tests tools -name '*.csproj' -type f | sort)
          solution_projects="$(dotnet sln AggregatorBackend.slnx list)"
          for project in "${projects[@]}"; do
            if ! grep -Fq "$project" <<<"$solution_projects"; then
              dotnet sln AggregatorBackend.slnx add "$project"
              solution_projects+=$'\n'"$project"
            fi
          done
      - name: Restore
        run: dotnet restore AggregatorBackend.slnx
      - name: Normalize formatting
        run: dotnet format AggregatorBackend.slnx --no-restore
      - name: Build with warnings as errors
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror
      - name: Execute complete test suite
        run: dotnet test AggregatorBackend.slnx --no-build --logger 'console;verbosity=normal'
      - name: Verify pull request contains generated normalization
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
      - name: Commit proven normalization to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AggregatorBackend.slnx src/Analytics tests/Analytics tools/ContractArtifacts
          git commit -m 'Complete Analytics runtime composition [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
