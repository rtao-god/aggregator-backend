name: Converge canonical static gate with diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/converge-static-gate-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: canonical-static-convergence
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Apply pending reviewed repairs
        id: preparation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'BOOTSTRAP' 2>&1 | tee /tmp/static-preparation.log
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/converge-static-gate.yml')
          if not workflow.exists():
              raise RuntimeError('The reviewed atomic convergence workflow is missing.')
          source = workflow.read_text(encoding='utf-8')
          marker = "      - name: Apply pending reviewed owner repairs idempotently\n"
          start = source.index(marker)
          run_marker = "        run: |\n"
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index("\n      - name: Prove duplicate owners are absent after convergence", start)
          block = textwrap.dedent(source[start:end])
          exec(compile(block, str(workflow), 'exec'))
          BOOTSTRAP

      - name: Prove obsolete owner files are absent
        id: owners
        if: steps.preparation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            obsolete=(
              src/Ingestion/Ingestion.Application/IngestionPackageProcessingService.cs
              src/Ingestion/Ingestion.Application/IngestionPackagePayloadValidator.cs
              src/Ingestion/Ingestion.Infrastructure/EfIngestionPackageWorkRepository.cs
              src/Ingestion/Ingestion.Infrastructure/IngestionPackageObjectReader.cs
              src/Promotion/Promotion.Application/PromotionCampaignServices.cs
              src/Promotion/Promotion.Infrastructure/PromotionCampaignRuntimePersistence.cs
              src/Promotion/Promotion.Api/PromotionCampaignsController.cs
            )
            failed=0
            for path in "${obsolete[@]}"; do
              if [ -e "$path" ]; then
                echo "Obsolete owner file remains reachable: $path" >&2
                failed=1
              fi
            done
            exit "$failed"
          } 2>&1 | tee /tmp/static-owners.log

      - name: Restore canonical solution
        id: restore
        if: steps.preparation.outcome == 'success' && steps.owners.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet restore AggregatorBackend.slnx 2>&1 | tee /tmp/static-restore.log

      - name: Format canonical solution
        id: format
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet format AggregatorBackend.slnx --no-restore 2>&1 | tee /tmp/static-format.log
          dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore 2>&1 | tee -a /tmp/static-format.log

      - name: Build canonical solution
        id: build
        if: steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build AggregatorBackend.slnx --no-restore -warnaserror /m:1 /nr:false \
            2>&1 | tee /tmp/static-build.log

      - name: Test canonical solution
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test AggregatorBackend.slnx --no-build -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false \
            2>&1 | tee /tmp/static-test.log

      - name: Determine gate result
        id: gate
        shell: bash
        env:
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          OWNERS_OUTCOME: ${{ steps.owners.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          if [ "$PREPARATION_OUTCOME" = success ] && \
             [ "$OWNERS_OUTCOME" = success ] && \
             [ "$RESTORE_OUTCOME" = success ] && \
             [ "$FORMAT_OUTCOME" = success ] && \
             [ "$BUILD_OUTCOME" = success ] && \
             [ "$TEST_OUTCOME" = success ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish exact blocker issue
        if: steps.gate.outputs.passed != 'true'
        uses: actions/github-script@v9
        env:
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          OWNERS_OUTCOME: ${{ steps.owners.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const fs = require('fs');
            const stages = [
              ['preparation', process.env.PREPARATION_OUTCOME, '/tmp/static-preparation.log'],
              ['owners', process.env.OWNERS_OUTCOME, '/tmp/static-owners.log'],
              ['restore', process.env.RESTORE_OUTCOME, '/tmp/static-restore.log'],
              ['format', process.env.FORMAT_OUTCOME, '/tmp/static-format.log'],
              ['build', process.env.BUILD_OUTCOME, '/tmp/static-build.log'],
              ['test', process.env.TEST_OUTCOME, '/tmp/static-test.log']
            ];
            let body = `Commit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            body += '| Stage | Outcome |\n|---|---|\n';
            for (const [name, outcome] of stages) body += `| ${name} | ${outcome} |\n`;
            for (const [name, outcome, path] of stages) {
              if (!fs.existsSync(path)) continue;
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              const relevant = lines.filter(line =>
                /\berror\b|\bfailed\b|\bfailure\b|\bwarning\b|\bexception\b|obsolete owner/i.test(line));
              const selected = (relevant.length > 0 ? relevant : lines).slice(-180);
              body += `\n## ${name} (${outcome})\n\n\`\`\`text\n${selected.join('\n')}\n\`\`\`\n`;
            }
            const title = '[CI] Canonical static gate blocker';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Commit only fully proven state
        if: steps.gate.outputs.passed == 'true'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          test "$base" = "$(git rev-parse HEAD)" || {
            echo 'main changed during proof; refusing a mixed-base commit.' >&2
            exit 1
          }
          one_shot_workflows=(
            .github/workflows/repair-architecture-proof.yml
            .github/workflows/repair-architecture-proof-v2.yml
            .github/workflows/repair-architecture-proof-v3.yml
            .github/workflows/consolidate-ingestion-owner.yml
            .github/workflows/consolidate-ingestion-owner-v2.yml
            .github/workflows/consolidate-ingestion-owner-v3.yml
            .github/workflows/consolidate-ingestion-owner-v4.yml
            .github/workflows/fix-promotion-campaign-owner.yml
            .github/workflows/complete-promotion-owner.yml
            .github/workflows/complete-promotion-owner-v2.yml
            .github/workflows/continue-after-architecture.yml
            .github/workflows/continue-after-architecture-v3.yml
            .github/workflows/converge-static-gate.yml
            .github/workflows/converge-static-gate-v2.yml
          )
          for workflow in "${one_shot_workflows[@]}"; do
            if [ -e "$workflow" ]; then git rm "$workflow"; fi
          done
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Converge canonical static gate' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Close resolved blocker issue
        if: steps.gate.outputs.passed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[CI] Canonical static gate blocker';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of issues) {
              if (issue.title === title && !issue.pull_request) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          PASSED: ${{ steps.gate.outputs.passed }}
        with:
          script: |
            const passed = process.env.PASSED === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: passed ? 'Canonical static gate passed' : 'Canonical static gate failed',
              context: 'ci/canonical-static-gate'
            });

      - name: Fail job when gate is red
        if: steps.gate.outputs.passed != 'true'
        run: exit 1
