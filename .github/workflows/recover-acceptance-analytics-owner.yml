name: Recover canonical Acceptance Analytics boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-acceptance-analytics-owner.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: recover-acceptance-analytics-owner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  recover-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Recover the latest canonical Analytics consumer from repository history
        shell: bash
        run: |
          set -euo pipefail
          scenario='tests/Acceptance/Acceptance.Runner/AcceptanceScenario.cs'
          candidate=''
          while read -r commit; do
            content=$(git show "$commit:$scenario" 2>/dev/null || true)
            if grep -q 'SubmitInteractionEventRequest' <<<"$content" \
              && grep -q 'InteractionEventResponse' <<<"$content" \
              && grep -q 'DailyListingMetricsResponse' <<<"$content" \
              && ! grep -q 'RecordAnalyticsInteractionRequest' <<<"$content" \
              && ! grep -q 'AnalyticsInteractionReceipt' <<<"$content" \
              && ! grep -q 'AnalyticsListingMetricsResponse' <<<"$content"; then
              candidate="$commit"
              break
            fi
          done < <(git log --all --format='%H' -- "$scenario")

          test -n "$candidate" || {
            echo 'No historical canonical Acceptance Analytics consumer exists.' >&2
            exit 2
          }

          git checkout "$candidate" -- "$scenario"
          for path in \
            tests/Acceptance/Acceptance.Runner/Program.cs \
            tests/Acceptance/Acceptance.Runner/CatalogControlContracts.cs \
            tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj; do
            if git cat-file -e "$candidate:$path" 2>/dev/null; then
              git checkout "$candidate" -- "$path"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          for path in Path('tests/Acceptance/Acceptance.Runner').glob('*.cs'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(
                  "EndsWith('/', StringComparison.Ordinal)",
                  "EndsWith('/')")
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')
          PY

      - name: Restore Acceptance owner graph
        run: dotnet restore tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj

      - name: Format and verify Acceptance owner graph
        run: |
          dotnet format tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj --no-restore
          dotnet format tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj --verify-no-changes --no-restore

      - name: Build Acceptance runner against current production contracts
        run: |
          dotnet build tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj \
            --no-restore -warnaserror /m:1 /nr:false

      - name: Reject restored legacy Analytics semantics
        shell: bash
        run: |
          if grep -R --line-number --include='*.cs' \
            -E 'RecordAnalyticsInteractionRequest|AnalyticsInteractionReceipt|AnalyticsListingMetricsResponse|AnalyticsInteractionKindContract\.Lead|X-Analytics-Internal-Key|api/analytics/interactions' \
            tests/Acceptance/Acceptance.Runner; then
            echo 'The recovered Acceptance consumer still contains legacy Analytics semantics.' >&2
            exit 1
          fi

      - name: Commit proven recovery and remove this workflow
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- tests/Acceptance src/Analytics tests/Analytics)
            test -z "$affected" || {
              printf 'Acceptance or Analytics changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm .github/workflows/recover-acceptance-analytics-owner.yml
          paths=(tests/Acceptance .github/workflows/recover-acceptance-analytics-owner.yml)
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Recover canonical Acceptance Analytics boundary' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Acceptance Analytics boundary: ${process.env.JOB_STATUS}`,
              context: 'ci/acceptance-analytics-boundary'
            });
