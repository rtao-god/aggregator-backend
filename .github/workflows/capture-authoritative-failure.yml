name: capture-authoritative-failure

on:
  workflow_run:
    workflows: ['authoritative-solution-proof']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: capture-authoritative-failure
  cancel-in-progress: false

jobs:
  capture:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download exact authoritative diagnostics
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .codex/ci/raw-authoritative

      - name: Normalize the first actionable failure set
        shell: bash
        env:
          PROVEN_SHA: ${{ github.event.workflow_run.head_sha }}
          PROOF_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .codex/ci
          {
            printf 'sha=%s\n' "$PROVEN_SHA"
            printf 'run_id=%s\n' "$PROOF_RUN_ID"
            printf 'workflow_url=%s/%s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY_OWNER" \
              "${GITHUB_REPOSITORY#*/}" "$PROOF_RUN_ID"
            find .codex/ci/raw-authoritative -type f \
              \( -name '*.log' -o -name '*.txt' -o -name '*.trx' \) -print0 \
              | sort -z \
              | xargs -0 -r grep -HnEi \
                  '(^|: )[A-Z]{2}[0-9]{4}:|: error | failed!|test run failed|assert\.|exception:' \
              | head -n 250 || true
          } > .codex/ci/authoritative-first-errors.txt
          test -s .codex/ci/authoritative-first-errors.txt
          rm -rf .codex/ci/raw-authoritative

      - name: Commit diagnostics only when still current
        shell: bash
        env:
          PROVEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$PROVEN_SHA" ]; then
            echo "Skipping stale diagnostics for $PROVEN_SHA; main is $base."
            exit 0
          fi
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- .codex/ci/authoritative-first-errors.txt
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          first=$(grep -m1 -E ': error |[A-Z]{2}[0-9]{4}:' .codex/ci/authoritative-first-errors.txt \
            | sed -E 's#^.*/##; s#[[:space:]]+# #g' | cut -c1-90)
          commit=$(printf 'Record authoritative failure: %s\n' "${first:-unknown}" \
            | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"
