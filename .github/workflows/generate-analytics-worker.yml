name: generate-analytics-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/AnalyticsWorkerGenerator/**"
      - "src/Analytics/Analytics.Domain/**"
      - "src/Analytics/Analytics.Application/**"
      - "src/Analytics/Analytics.Infrastructure/**"
      - ".github/workflows/generate-analytics-worker.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: generate-analytics-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Normalize generator path handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/AnalyticsWorkerGenerator/Program.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'var workerDirectory = root / "src" / "Analytics" / "Analytics.Worker";',
              'var workerDirectory = new DirectoryInfo(Path.Combine(root.FullName, "src", "Analytics", "Analytics.Worker"));')
          text = text.replace(
              'var testDirectory = root / "tests" / "Analytics" / "Analytics.Worker.Tests";',
              'var testDirectory = new DirectoryInfo(Path.Combine(root.FullName, "tests", "Analytics", "Analytics.Worker.Tests"));')
          text = text.replace(
              'var reportDirectory = root / "docs" / "generated";',
              'var reportDirectory = new DirectoryInfo(Path.Combine(root.FullName, "docs", "generated"));')
          text = text.replace('workerDirectory / "', 'Path.Combine(workerDirectory.FullName, "')
          text = text.replace('testDirectory / "', 'Path.Combine(testDirectory.FullName, "')
          text = text.replace('reportDirectory / "', 'Path.Combine(reportDirectory.FullName, "')
          text = text.replace('"),\n    ', '"),\n    ', 0)
          # Close Path.Combine calls introduced above at the exact File.WriteAllText first argument boundary.
          text = text.replace('"Analytics.Worker.csproj",\n    ', '"Analytics.Worker.csproj"),\n    ')
          text = text.replace('"GeneratedAnalyticsAggregationService.cs",\n    ', '"GeneratedAnalyticsAggregationService.cs"),\n    ')
          text = text.replace('"AnalyticsWorkerOptions.cs",\n    ', '"AnalyticsWorkerOptions.cs"),\n    ')
          text = text.replace('"AnalyticsAggregationWorker.cs",\n    ', '"AnalyticsAggregationWorker.cs"),\n    ')
          text = text.replace('"Program.cs",\n    ', '"Program.cs"),\n    ')
          text = text.replace('"Analytics.Worker.Tests.csproj",\n    ', '"Analytics.Worker.Tests.csproj"),\n    ')
          text = text.replace('File.WriteAllText(Path.Combine(testDirectory.FullName, "Usings.cs", ',
                              'File.WriteAllText(Path.Combine(testDirectory.FullName, "Usings.cs"), ')
          text = text.replace('"AnalyticsWorkerOptionsTests.cs",\n    ', '"AnalyticsWorkerOptionsTests.cs"),\n    ')
          text = text.replace('"analytics-worker-generation.md",\n    ', '"analytics-worker-generation.md"),\n    ')
          text = text.replace(
              '    namespace Aggregator.Analytics.Worker;\n\n    public sealed record AnalyticsWorkerOptions',
              '    using Microsoft.Extensions.Configuration;\n\n    namespace Aggregator.Analytics.Worker;\n\n    public sealed record AnalyticsWorkerOptions')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and compile generator
        run: |
          dotnet format tools/AnalyticsWorkerGenerator/AnalyticsWorkerGenerator.csproj
          dotnet build tools/AnalyticsWorkerGenerator/AnalyticsWorkerGenerator.csproj -warnaserror
      - name: Generate typed Analytics worker
        run: dotnet run --project tools/AnalyticsWorkerGenerator/AnalyticsWorkerGenerator.csproj --no-build
      - name: Format generated worker and tests
        run: |
          dotnet format src/Analytics/Analytics.Worker/Analytics.Worker.csproj
          dotnet format tests/Analytics/Analytics.Worker.Tests/Analytics.Worker.Tests.csproj
      - name: Compile and test generated worker
        run: |
          dotnet build src/Analytics/Analytics.Worker/Analytics.Worker.csproj -warnaserror
          dotnet test tests/Analytics/Analytics.Worker.Tests/Analytics.Worker.Tests.csproj
      - name: Commit generated worker
        run: |
          if git diff --quiet -- tools/AnalyticsWorkerGenerator src/Analytics/Analytics.Worker tests/Analytics/Analytics.Worker.Tests docs/generated/analytics-worker-generation.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/AnalyticsWorkerGenerator src/Analytics/Analytics.Worker tests/Analytics/Analytics.Worker.Tests docs/generated/analytics-worker-generation.md
          git commit -m "Generate typed Analytics aggregation worker"
          git push origin HEAD:main
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Analytics worker generation: ${process.env.JOB_STATUS}`,
              context: 'ci/analytics-worker-generation'
            });
