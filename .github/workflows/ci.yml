name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore AggregatorBackend.slnx
      - name: Format
        run: dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test AggregatorBackend.slnx --no-build --logger "console;verbosity=normal"
      - name: Architecture proof
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --no-build --logger "console;verbosity=normal"
