name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore AggregatorBackend.slnx
      - name: Format
        run: dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore
      - name: Build
        run: >-
          dotnet build AggregatorBackend.slnx
          --no-restore -warnaserror /m:1 /nr:false
      - name: Test
        run: >-
          dotnet test AggregatorBackend.slnx
          --no-build --no-restore -warnaserror
          --logger "console;verbosity=normal" /m:1 /nr:false
      - name: Architecture proof
        run: >-
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj
          --no-build --no-restore -warnaserror
          --logger "console;verbosity=normal" /m:1 /nr:false
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Workflow ${context.runId}: ${process.env.JOB_STATUS}`,
              context: 'ci/connector-report'
            });