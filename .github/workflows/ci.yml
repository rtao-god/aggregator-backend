name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  PLATFORM_MESSAGING_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=postgres;Password=ci-${{ github.run_id }}-${{ github.run_attempt }};Database=postgres;Pooling=false"
  PLATFORM_MESSAGING_TEST_RABBITMQ: "amqp://aggregator-ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5672/"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: aggregator-ci
          RABBITMQ_DEFAULT_PASS: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'NuGet.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Repository inventory
        timeout-minutes: 1
        run: python3 .tools/complete-backend.py --check

      - name: Product configuration
        timeout-minutes: 1
        run: >-
          dotnet run
          --project tools/ProductConfigValidator/ProductConfigValidator.csproj
          --configuration Release
          -- validate product-config/berlin-recording

      - name: Runtime contract manifest
        timeout-minutes: 1
        run: python3 tools/verify-contracts.py

      - name: Compose topology
        timeout-minutes: 1
        run: docker compose --env-file .env.example --file compose.yaml config --quiet

      - name: Restore architecture gate
        timeout-minutes: 2
        run: dotnet restore tests/Architecture.Tests/Architecture.Tests.csproj

      - name: Architecture and repository automation gate
        timeout-minutes: 2
        run: >-
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj
          --no-restore -warnaserror
          --logger "console;verbosity=normal" /m:1 /nr:false

      - name: Restore runtime graph
        timeout-minutes: 3
        run: dotnet restore AggregatorBackend.Runtime.slnx

      - name: Build production runtime graph
        timeout-minutes: 5
        run: >-
          dotnet build AggregatorBackend.Runtime.slnx
          --no-restore -warnaserror /m:2 /nr:false

      - name: Restore complete graph
        timeout-minutes: 3
        run: dotnet restore AggregatorBackend.slnx

      - name: Whitespace format gate
        timeout-minutes: 3
        run: >-
          dotnet format whitespace AggregatorBackend.slnx
          --verify-no-changes --no-restore

      - name: Build complete graph
        timeout-minutes: 5
        run: >-
          dotnet build AggregatorBackend.slnx
          --no-restore -warnaserror /m:2 /nr:false

      - name: Tests
        id: tests
        timeout-minutes: 8
        shell: bash
        env:
          TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/aggregator-backend-test-diagnostics
        run: |
          mkdir -p "$TEST_DIAGNOSTICS_DIR"
          set -o pipefail
          dotnet test AggregatorBackend.slnx \
            --no-build --no-restore -warnaserror \
            --logger "console;verbosity=normal" /m:1 /nr:false \
            2>&1 | tee "$TEST_DIAGNOSTICS_DIR/console.log"

      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregator-backend-test-diagnostics/console.log
          if-no-files-found: error
          retention-days: 7
