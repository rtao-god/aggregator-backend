name: capture-authoritative-success

on:
  workflow_run:
    workflows: ['authoritative-solution-proof']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: capture-authoritative-success
  cancel-in-progress: false

jobs:
  record:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Write exact green proof
        shell: bash
        env:
          PROVEN_SHA: ${{ github.event.workflow_run.head_sha }}
          PROOF_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .codex/ci
          cat > .codex/ci/authoritative-green.txt <<EOF
          sha=$PROVEN_SHA
          run_id=$PROOF_RUN_ID
          proof=restore,format,build,tests,architecture
          EOF
          rm -f .codex/ci/authoritative-first-errors.txt

      - name: Commit marker only while the proven SHA is current
        shell: bash
        env:
          PROVEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$PROVEN_SHA" ]; then
            echo "Skipping stale green marker for $PROVEN_SHA; main is $base."
            exit 0
          fi
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- \
            .codex/ci/authoritative-green.txt \
            .codex/ci/authoritative-first-errors.txt
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' "Record authoritative green proof for $PROVEN_SHA" \
            | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"
