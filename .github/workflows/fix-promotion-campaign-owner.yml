name: Repair Promotion campaign transport owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-promotion-campaign-owner.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: fix-promotion-campaign-owner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Add the public mapper guard at the owner boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/Promotion/Promotion.Application/PromotionCampaignServices.cs'
          $content = [System.IO.File]::ReadAllText($path)
          $old = @'
    public static PromotionCampaignResponse ToResponse(
        PromotionCampaignSnapshot campaign,
        bool replayed) =>
        new(
            campaign.Id,
            campaign.ProductRevisionId,
            campaign.EntitlementId,
            campaign.ListingId,
            campaign.CatalogKey,
            campaign.PlacementKey,
            campaign.CapacityUnits,
            campaign.StartsAtUtc,
            campaign.EndsAtUtc,
            ToContract(campaign.State),
            campaign.AggregateRevision,
            campaign.LastChangedAtUtc,
            campaign.SuspensionReason,
            "sponsored",
            replayed);
'@
          $new = @'
    public static PromotionCampaignResponse ToResponse(
        PromotionCampaignSnapshot campaign,
        bool replayed)
    {
        ArgumentNullException.ThrowIfNull(campaign);
        return new PromotionCampaignResponse(
            campaign.Id,
            campaign.ProductRevisionId,
            campaign.EntitlementId,
            campaign.ListingId,
            campaign.CatalogKey,
            campaign.PlacementKey,
            campaign.CapacityUnits,
            campaign.StartsAtUtc,
            campaign.EndsAtUtc,
            ToContract(campaign.State),
            campaign.AggregateRevision,
            campaign.LastChangedAtUtc,
            campaign.SuspensionReason,
            "sponsored",
            replayed);
    }
'@
          $count = ([regex]::Matches($content, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected one PromotionCampaignMapper.ToResponse anchor, actual $count."
          }
          [System.IO.File]::WriteAllText(
            $path,
            $content.Replace($old, $new, [System.StringComparison]::Ordinal),
            [System.Text.UTF8Encoding]::new($false))

      - name: Restore Promotion graph
        run: |
          mapfile -t projects < <(find src/Promotion tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done

      - name: Format Promotion graph
        run: |
          mapfile -t projects < <(find src/Promotion tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet format "$project" --no-restore
          done

      - name: Build Promotion production graph
        run: |
          mapfile -t projects < <(find src/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror /m:1 /nr:false
          done

      - name: Test Promotion owner graph
        run: |
          mapfile -t projects < <(find tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet test "$project" --no-restore -warnaserror \
              --logger "console;verbosity=normal" /m:1 /nr:false
          done

      - name: Commit proven repair and remove one-shot workflow
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- src/Promotion tests/Promotion)
            test -z "$affected" || {
              printf 'Promotion owner changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm .github/workflows/fix-promotion-campaign-owner.yml
          paths=(src/Promotion tests/Promotion .github/workflows/fix-promotion-campaign-owner.yml)
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Validate Promotion campaign response owner boundary' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Promotion owner proof: ${process.env.JOB_STATUS}`,
              context: 'ci/promotion-owner'
            });
