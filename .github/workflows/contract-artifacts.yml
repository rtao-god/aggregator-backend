name: contract-artifacts

on:
  push:
    branches: [main]
    paths:
      - 'src/**/**.Contracts/**'
      - 'tools/ContractArtifacts/**'
      - '.github/workflows/contract-artifacts.yml'
  pull_request:
    paths:
      - 'src/**/**.Contracts/**'
      - 'tools/ContractArtifacts/**'
      - 'artifacts/contracts/**'
      - '.github/workflows/contract-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contract-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  generate-or-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore generator
        run: dotnet restore tools/ContractArtifacts/ContractArtifacts.csproj
      - name: Build generator and producer contracts
        run: dotnet build tools/ContractArtifacts/ContractArtifacts.csproj --no-restore -warnaserror
      - name: Generate deterministic artifacts
        run: dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --write
      - name: Verify pull request drift
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- artifacts/contracts
      - name: Commit refreshed main artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- artifacts/contracts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/contracts
          git commit -m 'Refresh generated contract artifacts [skip ci]'
          git push origin HEAD:main
