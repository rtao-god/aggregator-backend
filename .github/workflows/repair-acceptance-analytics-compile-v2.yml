name: Repair Acceptance Analytics compile boundary v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-acceptance-analytics-compile-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: repair-acceptance-analytics-compile
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Apply the reviewed canonical Analytics transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/repair-acceptance-analytics-compile.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'

          heading = '      - name: Replace the retired Analytics consumer contract\n'
          block = source[source.index(heading):]
          script_start = block.index(marker) + len(marker)
          script_end = block.index(
              '\n      - name: Ensure Acceptance references canonical Analytics contracts',
              script_start)
          script = textwrap.dedent(block[script_start:script_end])
          exec(compile(script, 'repair-acceptance-analytics-compile.py', 'exec'))

          heading = '      - name: Ensure Acceptance references canonical Analytics contracts\n'
          block = source[source.index(heading):]
          script_start = block.index(marker) + len(marker)
          script_end = block.index('\n      - name: Restore Acceptance owner graph', script_start)
          script = textwrap.dedent(block[script_start:script_end])
          exec(compile(script, 'ensure-acceptance-analytics-reference.py', 'exec'))
          PY

      - name: Restore and format Acceptance owner graph
        shell: bash
        run: |
          dotnet restore tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj
          dotnet format tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj --no-restore
          dotnet format tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj \
            --verify-no-changes --no-restore

      - name: Build Acceptance runner
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build tests/Acceptance/Acceptance.Runner/Acceptance.Runner.csproj \
            --no-restore -warnaserror /m:1 /nr:false 2>&1 | tee acceptance-build.log

      - name: Reject retired Analytics semantics
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          if grep -R --line-number --include='*.cs' \
            -E 'RecordAnalyticsInteractionRequest|AnalyticsInteractionReceipt|AnalyticsListingMetricsResponse|AnalyticsInteractionKindContract|X-Analytics-Internal-Key|api/analytics/interactions' \
            tests/Acceptance/Acceptance.Runner; then
            echo 'Retired Analytics consumer semantics remain in Acceptance.' >&2
            exit 1
          fi

      - name: Commit proven compile boundary
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- tests/Acceptance src/Analytics tests/Analytics)
            test -z "$affected" || {
              printf 'Acceptance or Analytics changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm -f \
            .github/workflows/repair-acceptance-analytics-compile.yml \
            .github/workflows/repair-acceptance-analytics-compile-v2.yml \
            .github/workflows/refine-acceptance-analytics-compile.yml
          paths=(tests/Acceptance .github/workflows)
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Use canonical Analytics contracts in Acceptance' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Dispatch contract-driven refinement on compile failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'refine-acceptance-analytics-compile.yml',
              ref: 'main'
            });
            core.setFailed('Acceptance compile failed; contract-driven refinement was dispatched.');

      - name: Upload exact compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-analytics-compile-v2-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: acceptance-build.log

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const success = process.env.BUILD_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success
                ? 'Acceptance uses canonical Analytics contracts'
                : 'Acceptance compile failed; refinement dispatched',
              context: 'ci/acceptance-analytics-compile-v2'
            });
