name: Clean one-shot stabilization workflows

on:
  push:
    branches: [main]
    paths:
      - '.codex/ci/authoritative-green.txt'
      - '.github/workflows/cleanup-stabilization-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-stabilization-workflows
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require an authoritative green state
        shell: bash
        run: |
          test -s .codex/ci/authoritative-green.txt
          test ! -e .codex/ci/authoritative-first-errors.txt
          proven=$(sed -n 's/^sha=//p' .codex/ci/authoritative-green.txt)
          test -n "$proven"
          git cat-file -e "$proven^{commit}"

      - name: Remove only known one-shot repair workflows
        shell: bash
        run: |
          candidates=(
            .github/workflows/repair-authoritative-first-error.yml
            .github/workflows/repair-missing-solution-project.yml
            .github/workflows/repair-acceptance-analytics-compile.yml
            .github/workflows/repair-acceptance-analytics-compile-v2.yml
            .github/workflows/refine-acceptance-analytics-compile.yml
            .github/workflows/cleanup-acceptance-repair.yml
            .github/workflows/implement-analytics-acceptance-antibuse.yml
            .github/workflows/cleanup-stabilization-workflows.yml
          )
          removed=0
          for path in "${candidates[@]}"; do
            if [ -e "$path" ]; then
              git rm "$path"
              removed=$((removed + 1))
            fi
          done
          test "$removed" -gt 0 || exit 0

          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          test "$base" = "$(git rev-parse HEAD)" || {
            echo 'Main advanced during one-shot workflow cleanup.' >&2
            exit 1
          }
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- .github/workflows
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Remove one-shot stabilization workflows' \
            | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"
