name: Stabilized full solution proof

on:
  workflow_run:
    workflows:
      - "Finalize canonical Ingestion owner consolidation"
      - "Finalize Promotion owner proof"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: stabilized-full-solution-proof
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  prove:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check whether owner consolidation is committed
        id: readiness
        shell: bash
        run: |
          pending=0
          for path in \
            .github/workflows/consolidate-ingestion-owner.yml \
            .github/workflows/consolidate-ingestion-owner-v2.yml \
            .github/workflows/consolidate-ingestion-owner-v3.yml \
            .github/workflows/consolidate-ingestion-owner-v4.yml \
            .github/workflows/fix-promotion-campaign-owner.yml \
            .github/workflows/complete-promotion-owner.yml \
            .github/workflows/complete-promotion-owner-v2.yml; do
            if [ -e "$path" ]; then
              echo "Pending owner workflow: $path"
              pending=1
            fi
          done
          if [ "$pending" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v5
        if: steps.readiness.outputs.ready == 'true'
        with:
          dotnet-version: 10.0.302

      - name: Restore canonical solution
        if: steps.readiness.outputs.ready == 'true'
        run: dotnet restore AggregatorBackend.slnx

      - name: Verify formatting and analyzers
        if: steps.readiness.outputs.ready == 'true'
        run: dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore

      - name: Build canonical solution
        if: steps.readiness.outputs.ready == 'true'
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror /m:1 /nr:false

      - name: Test canonical solution
        if: steps.readiness.outputs.ready == 'true'
        run: |
          dotnet test AggregatorBackend.slnx --no-build -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Publish connector-readable status
        if: always() && steps.readiness.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: branch.commit.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Stabilized solution proof: ${process.env.JOB_STATUS}`,
              context: 'ci/stabilized-solution'
            });
