name: final-repository-proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: authoritative-aggregator-repository-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore
        id: restore
        run: dotnet restore AggregatorBackend.slnx
      - name: Format
        id: format
        run: dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore
      - name: Build
        id: build
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror
      - name: Test
        id: test
        run: dotnet test AggregatorBackend.slnx --no-build --logger 'console;verbosity=normal'
      - name: Contract artifacts
        id: contracts
        run: dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --verify
      - name: Publish status
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = [
              '${{ steps.restore.outcome }}',
              '${{ steps.format.outcome }}',
              '${{ steps.build.outcome }}',
              '${{ steps.test.outcome }}',
              '${{ steps.contracts.outcome }}'
            ];
            const success = outcomes.every(value => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Authoritative repository proof passed' : 'Authoritative repository proof failed',
              context: 'ci/final-repository-proof'
            });
