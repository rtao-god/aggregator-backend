name: final-repository-proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

concurrency:
  group: authoritative-aggregator-repository-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Normalize repository
        run: |
          python tools/repository_completion.py
          python tools/repository_completion_supplement.py
          python tools/repository_completion_catalog_verification.py
      - name: Remove duplicate Ingestion processing registrations
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/Ingestion/Ingestion.Api/Program.cs')
          source = path.read_text()
          source = source.replace(
              '        builder.Services.AddIngestionApplication();\n        builder.Services.AddIngestionProcessingApplication();',
              '        builder.Services.AddIngestionApplication();')
          path.write_text(source)
      - name: Synchronize all physical projects
        shell: bash
        run: |
          mapfile -t projects < <(find src tests tools -name '*.csproj' -type f | sort)
          solution_projects="$(dotnet sln AggregatorBackend.slnx list)"
          for project in "${projects[@]}"; do
            if ! grep -Fq "$project" <<<"$solution_projects"; then
              dotnet sln AggregatorBackend.slnx add "$project"
              solution_projects+=$'\n'"$project"
            fi
          done
      - name: Restore
        id: restore
        continue-on-error: true
        run: dotnet restore AggregatorBackend.slnx 2>&1 | tee .codex-final-restore.log
      - name: Format
        id: format
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: dotnet format AggregatorBackend.slnx --no-restore 2>&1 | tee .codex-final-format.log
      - name: Build
        id: build
        if: steps.restore.outcome == 'success' && steps.format.outcome == 'success'
        continue-on-error: true
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror 2>&1 | tee .codex-final-build.log
      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: dotnet test AggregatorBackend.slnx --no-build --logger 'console;verbosity=normal' 2>&1 | tee .codex-final-test.log
      - name: Contract artifacts
        id: contracts
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --write
          dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --verify
      - name: Persist exact proof report
        if: always()
        shell: python
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          import os
          import re
          from pathlib import Path

          output = Path('.codex/ci')
          codes = output / 'codes'
          output.mkdir(parents=True, exist_ok=True)
          codes.mkdir(parents=True, exist_ok=True)
          for marker in codes.iterdir():
              if marker.is_file():
                  marker.unlink()

          outcomes = {
              'restore': os.environ.get('RESTORE_OUTCOME', 'skipped'),
              'format': os.environ.get('FORMAT_OUTCOME', 'skipped'),
              'build': os.environ.get('BUILD_OUTCOME', 'skipped'),
              'test': os.environ.get('TEST_OUTCOME', 'skipped'),
              'contracts': os.environ.get('CONTRACTS_OUTCOME', 'skipped'),
          }
          sections = [
              f"source_sha={os.environ['SOURCE_SHA']}",
              f"run_id={os.environ['RUN_ID']}",
              '',
          ]
          patterns = (
              re.compile(r'\berror\s+([A-Z]+\d+)\b', re.I),
              re.compile(r'\b(NU\d{4})\b'),
              re.compile(r'\b(xUnit\d{4})\b', re.I),
          )
          found_codes = set()
          for name, outcome in outcomes.items():
              log = Path(f'.codex-final-{name}.log')
              lines = log.read_text(errors='replace').splitlines() if log.exists() else []
              important = [
                  line for line in lines
                  if 'error' in line.lower()
                  or 'fail' in line.lower()
                  or 'exception' in line.lower()
              ]
              selected = important[-300:] if important else lines[-100:]
              sections.append(f'## {name} outcome={outcome}')
              sections.extend(selected)
              sections.append('')
              for line in lines:
                  for pattern in patterns:
                      found_codes.update(value.upper() for value in pattern.findall(line))
          (output / 'last-errors.txt').write_text('\n'.join(sections) + '\n')
          for code in sorted(found_codes):
              (codes / code).write_text(code + '\n')
          green = all(value == 'success' for value in outcomes.values())
          green_path = output / 'completion-green.txt'
          if green:
              green_path.write_text(
                  f"source_sha={os.environ['SOURCE_SHA']}\n"
                  f"run_id={os.environ['RUN_ID']}\n"
                  "restore=success\nformat=success\nbuild=success\ntest=success\ncontracts=success\n")
          elif green_path.exists():
              green_path.unlink()
      - name: Commit normalized state and proof report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ '${{ steps.restore.outcome }}' = 'success' ] \
             && [ '${{ steps.format.outcome }}' = 'success' ] \
             && [ '${{ steps.build.outcome }}' = 'success' ] \
             && [ '${{ steps.test.outcome }}' = 'success' ] \
             && [ '${{ steps.contracts.outcome }}' = 'success' ]; then
            message='Complete authoritative repository proof [skip ci]'
          else
            message='Persist authoritative repository diagnostics [skip ci]'
          fi
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish status
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcomes = [
              '${{ steps.restore.outcome }}',
              '${{ steps.format.outcome }}',
              '${{ steps.build.outcome }}',
              '${{ steps.test.outcome }}',
              '${{ steps.contracts.outcome }}'
            ];
            const success = outcomes.every(value => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Authoritative repository proof passed' : 'Authoritative repository proof failed',
              context: 'ci/final-repository-proof'
            });
      - name: Require green proof
        if: steps.restore.outcome != 'success' || steps.format.outcome != 'success' || steps.build.outcome != 'success' || steps.test.outcome != 'success' || steps.contracts.outcome != 'success'
        run: exit 1
