name: Resume stabilization after proven static repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-after-static-repair.yml'
  workflow_run:
    workflows: ["Repair only known active static blocker patterns"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  resume:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch stabilization only from a clean proven state
        uses: actions/github-script@v9
        with:
          script: |
            async function exists(path) {
              try {
                await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: 'main'
                });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            if (await exists('.github/workflows/repair-active-static-blocker.yml')) {
              core.notice('The static repair workflow still exists; no downstream gate is dispatched.');
              return;
            }
            if (await exists('.codex/ci/active-blocker-errors.txt') ||
                await exists('.codex/ci/canonical-static-gate-blocker.md')) {
              core.notice('An active static blocker remains; no downstream gate is dispatched.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'stabilization-controller-v5.yml',
              ref: 'main'
            });
