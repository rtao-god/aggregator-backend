name: Extract exact active blocker diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-active-blocker.yml'
      - '.codex/ci/stabilization-controller-blocker.txt'
      - '.codex/ci/end-to-end-controller-blocker.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: extract-active-blocker
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract child-run errors into one repository diagnostic
        uses: actions/github-script@v9
        with:
          script: |
            const blockerPaths = [
              '.codex/ci/stabilization-controller-blocker.txt',
              '.codex/ci/end-to-end-controller-blocker.txt'
            ];
            async function readFile(path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: 'main'
                });
                if (Array.isArray(data)) return null;
                return Buffer.from(data.content, data.encoding).toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            let sourcePath = null;
            let blocker = null;
            for (const path of blockerPaths) {
              const content = await readFile(path);
              if (content) {
                sourcePath = path;
                blocker = content;
                break;
              }
            }
            if (!blocker) {
              core.notice('No active controller blocker exists.');
              return;
            }

            const childMatch = blocker.match(/child_run=https:\/\/github\.com\/[^/]+\/[^/]+\/actions\/runs\/(\d+)/);
            if (!childMatch) {
              core.notice(`Blocker '${sourcePath}' has no child_run URL yet.`);
              return;
            }
            const runId = Number(childMatch[1]);
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              filter: 'latest',
              per_page: 100
            });

            const collected = [];
            for (const job of jobs.jobs) {
              let logText = '';
              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id,
                    headers: { accept: 'application/vnd.github+json' }
                  });
                logText = Buffer.isBuffer(response.data)
                  ? response.data.toString('utf8')
                  : typeof response.data === 'string'
                    ? response.data
                    : Buffer.from(response.data).toString('utf8');
              } catch (error) {
                collected.push(`[${job.name}] log download failed: ${error.message}`);
                continue;
              }
              const lines = logText.split(/\r?\n/)
                .map(line => line.replace(/^\d{4}-\d{2}-\d{2}T[^Z]+Z\s*/, ''));
              const relevant = lines.filter(line =>
                /\berror\b|\bfailed\b|\bfailure\b|\bexception\b|\bCS\d{4}\b|\bCA\d{4}\b|Assert\.|Process completed with exit code/i.test(line));
              collected.push(`## ${job.name} (${job.conclusion ?? job.status})`);
              collected.push(...(relevant.length > 0 ? relevant.slice(-240) : lines.slice(-80)));
            }

            const text = [
              `source_blocker=${sourcePath}`,
              `child_run=https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
              '',
              ...collected.slice(-600),
              ''
            ].join('\n');
            const path = '.codex/ci/active-blocker-errors.txt';
            let existing = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              if (!Array.isArray(response.data)) existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Persist exact active blocker diagnostics [skip ci]',
              content: Buffer.from(text, 'utf8').toString('base64'),
              ...(existing ? { sha: existing.sha } : {})
            });
