name: Serialize backend stabilization with exact blocker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilization-controller-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  statuses: write

concurrency:
  group: backend-stabilization-controller
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Run causal gates and persist exact result
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const blockerPath = '.codex/ci/stabilization-controller-blocker.txt';
            const greenPath = '.codex/ci/stabilization-controller-green.txt';
            const branch = 'main';

            async function getFile(path) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: branch
                });
                return Array.isArray(response.data) ? null : response.data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function putFile(path, text, message) {
              const existing = await getFile(path);
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch,
                message,
                content: Buffer.from(text, 'utf8').toString('base64'),
                ...(existing ? { sha: existing.sha } : {})
              });
            }

            async function deleteFile(path, message) {
              const existing = await getFile(path);
              if (!existing) return;
              await github.rest.repos.deleteFile({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch,
                sha: existing.sha,
                message
              });
            }

            async function getWorkflowOrNull(workflow_id) {
              try {
                const { data } = await github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id
                });
                return data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function dispatchAndWait(workflow_id, label, required) {
              const workflow = await getWorkflowOrNull(workflow_id);
              if (!workflow) {
                if (required) {
                  throw new Error(`${label}: workflow '${workflow_id}' is missing.`);
                }
                core.info(`${label}: '${workflow_id}' already removed; downstream proof remains authoritative.`);
                return null;
              }
              if (workflow.state !== 'active') {
                throw new Error(`${label}: workflow '${workflow_id}' is ${workflow.state}.`);
              }

              const dispatchedAt = new Date();
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: branch
              });

              let run = null;
              for (let attempt = 0; attempt < 120; attempt++) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  branch,
                  event: 'workflow_dispatch',
                  per_page: 20
                });
                run = data.workflow_runs
                  .filter(candidate => new Date(candidate.created_at) >= dispatchedAt)
                  .sort((left, right) => right.id - left.id)[0] ?? null;
                if (run) break;
                await sleep(5000);
              }
              if (!run) {
                throw new Error(`${label}: dispatched run was not observed.`);
              }

              for (let attempt = 0; attempt < 720; attempt++) {
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                run = data;
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    throw new Error(
                      `${label}: ${run.conclusion}; child_run=${run.html_url}; child_sha=${run.head_sha}`);
                  }
                  core.info(`${label}: success; ${run.html_url}`);
                  return run;
                }
                await sleep(15000);
              }
              throw new Error(`${label}: timed out; child_run=${run.html_url}`);
            }

            let gate = 'initialization';
            try {
              for (const [workflow, label] of [
                ['repair-architecture-proof-v3.yml', 'Architecture semantic repair'],
                ['consolidate-ingestion-owner-v4.yml', 'Ingestion owner consolidation'],
                ['complete-promotion-owner-v2.yml', 'Promotion owner consolidation']
              ]) {
                gate = label;
                await dispatchAndWait(workflow, label, false);
              }

              gate = 'Canonical atomic static gate';
              await dispatchAndWait(
                'converge-static-gate-v2.yml',
                gate,
                true);

              gate = 'Read-only stabilized solution proof';
              await dispatchAndWait(
                'stabilized-solution-proof.yml',
                gate,
                true);

              gate = 'Contract artifacts and drift proof';
              await dispatchAndWait(
                'contract-artifacts.yml',
                gate,
                true);

              const { data: main } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch
              });
              await deleteFile(
                blockerPath,
                'Clear resolved stabilization blocker [skip ci]');
              await putFile(
                greenPath,
                [
                  `main_sha=${main.commit.sha}`,
                  `controller_run=${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `completed_at=${new Date().toISOString()}`,
                  ''
                ].join('\n'),
                'Persist green stabilization proof [skip ci]');
            } catch (error) {
              await deleteFile(
                greenPath,
                'Invalidate stale stabilization proof [skip ci]');
              const text = [
                `gate=${gate}`,
                `error=${error instanceof Error ? error.message : String(error)}`,
                `controller_run=${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `source_sha=${context.sha}`,
                `recorded_at=${new Date().toISOString()}`,
                ''
              ].join('\n');
              await putFile(
                blockerPath,
                text,
                'Persist exact stabilization blocker [skip ci]');
              throw error;
            }

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Stabilization gates passed' : 'Stabilization stopped at exact blocker',
              context: 'ci/stabilization-controller'
            });
