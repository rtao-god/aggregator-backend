name: analytics-canonical-owner-proof

on:
  push:
    branches: [main]
    paths:
      - 'src/Analytics/**'
      - 'tests/Analytics/**'
      - '.github/workflows/analytics-canonical-owner-proof.yml'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: analytics-canonical-owner-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore Analytics owner projects
        run: |
          set -euo pipefail
          projects=(
            src/Analytics/Analytics.Domain/Analytics.Domain.csproj
            src/Analytics/Analytics.Contracts/Analytics.Contracts.csproj
            src/Analytics/Analytics.Application/Analytics.Application.csproj
            src/Analytics/Analytics.Infrastructure/Analytics.Infrastructure.csproj
            src/Analytics/Analytics.Api/Analytics.Api.csproj
            src/Analytics/Analytics.Worker/Analytics.Worker.csproj
            src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Analytics/Analytics.Api.Tests/Analytics.Api.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done
      - name: Verify Analytics formatting and analyzers
        run: |
          set -euo pipefail
          projects=(
            src/Analytics/Analytics.Domain/Analytics.Domain.csproj
            src/Analytics/Analytics.Contracts/Analytics.Contracts.csproj
            src/Analytics/Analytics.Application/Analytics.Application.csproj
            src/Analytics/Analytics.Infrastructure/Analytics.Infrastructure.csproj
            src/Analytics/Analytics.Api/Analytics.Api.csproj
            src/Analytics/Analytics.Worker/Analytics.Worker.csproj
            src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Analytics/Analytics.Api.Tests/Analytics.Api.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet format "$project" --verify-no-changes --no-restore
          done
      - name: Build Analytics owner projects
        run: |
          set -euo pipefail
          projects=(
            src/Analytics/Analytics.Domain/Analytics.Domain.csproj
            src/Analytics/Analytics.Contracts/Analytics.Contracts.csproj
            src/Analytics/Analytics.Application/Analytics.Application.csproj
            src/Analytics/Analytics.Infrastructure/Analytics.Infrastructure.csproj
            src/Analytics/Analytics.Api/Analytics.Api.csproj
            src/Analytics/Analytics.Worker/Analytics.Worker.csproj
            src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Analytics/Analytics.Api.Tests/Analytics.Api.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror
          done
      - name: Test Analytics owner contracts
        run: |
          set -euo pipefail
          projects=(
            tests/Analytics/Analytics.Domain.Tests/Analytics.Domain.Tests.csproj
            tests/Analytics/Analytics.Application.Tests/Analytics.Application.Tests.csproj
            tests/Analytics/Analytics.Infrastructure.Tests/Analytics.Infrastructure.Tests.csproj
            tests/Analytics/Analytics.Api.Tests/Analytics.Api.Tests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet test "$project" --no-build --logger 'console;verbosity=normal'
          done
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Analytics canonical owner proof ${context.runId}: ${process.env.JOB_STATUS}`,
              context: 'ci/analytics-owner'
            });
