name: Repair diagnostics-backed analyzer blockers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-analyzer-blockers.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: canonical-static-convergence
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Apply only diagnostics-backed analyzer fixes
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/analyzer-source.log
          from pathlib import Path
          import re

          diagnostic_path = Path('.codex/ci/active-blocker-errors.txt')
          if not diagnostic_path.exists():
              print('No active blocker diagnostics exist.')
              raise SystemExit(0)
          diagnostic = diagnostic_path.read_text(encoding='utf-8', errors='replace')

          ca1062 = re.compile(
              r'(?P<path>(?:[A-Za-z]:)?[^\r\n]*?\.cs)\((?P<line>\d+),(?P<column>\d+)\):\s+(?:error|warning)\s+CA1062:.*?method\s+[\'\"](?P<method>[^\'\"]+)[\'\"].*?parameter\s+[\'\"](?P<parameter>[A-Za-z_][A-Za-z0-9_]*)[\'\"]',
              re.IGNORECASE)
          one_char_contains = re.compile(
              r'\.Contains\("(?P<char>[^"\\])",\s*StringComparison\.Ordinal\)')
          hex_lower = re.compile(
              r'Convert\.ToHexString\((?P<value>[^\n;]+)\)\.ToLowerInvariant\(\)')

          def repo_path(raw: str) -> Path | None:
              normalized = raw.replace('\\', '/')
              for marker in ('/src/', '/tests/', '/tools/'):
                  position = normalized.rfind(marker)
                  if position >= 0:
                      candidate = Path(normalized[position + 1:])
                      return candidate if candidate.exists() else None
              candidate = Path(normalized)
              return candidate if candidate.exists() else None

          def find_matching(text: str, start: int, opening: str, closing: str) -> int:
              depth = 0
              state = 'code'
              index = start
              while index < len(text):
                  current = text[index]
                  following = text[index + 1] if index + 1 < len(text) else ''
                  if state == 'code':
                      if current == '/' and following == '/':
                          state = 'line'; index += 2; continue
                      if current == '/' and following == '*':
                          state = 'block'; index += 2; continue
                      if current == '@' and following == '"':
                          state = 'verbatim'; index += 2; continue
                      if current == '"':
                          state = 'string'; index += 1; continue
                      if current == "'":
                          state = 'char'; index += 1; continue
                      if current == opening:
                          depth += 1
                      elif current == closing:
                          depth -= 1
                          if depth == 0:
                              return index
                  elif state == 'line':
                      if current == '\n': state = 'code'
                  elif state == 'block':
                      if current == '*' and following == '/':
                          state = 'code'; index += 2; continue
                  elif state == 'string':
                      if current == '\\': index += 2; continue
                      if current == '"': state = 'code'
                  elif state == 'verbatim':
                      if current == '"' and following == '"': index += 2; continue
                      if current == '"': state = 'code'
                  elif state == 'char':
                      if current == '\\': index += 2; continue
                      if current == "'": state = 'code'
                  index += 1
              return -1

          def add_guard(path: Path, method_identity: str, parameter: str) -> bool:
              text = path.read_text(encoding='utf-8')
              guard = f'ArgumentNullException.ThrowIfNull({parameter});'
              if guard in text:
                  return False
              method_name = method_identity.split('(', 1)[0].rsplit('.', 1)[-1]
              candidates = list(re.finditer(rf'\b{re.escape(method_name)}\s*\(', text))
              for candidate in candidates:
                  open_parenthesis = text.find('(', candidate.start())
                  close_parenthesis = find_matching(text, open_parenthesis, '(', ')')
                  if close_parenthesis < 0:
                      continue
                  parameters = text[open_parenthesis + 1:close_parenthesis]
                  if re.search(rf'\b{re.escape(parameter)}\b', parameters) is None:
                      continue
                  declaration_start = max(
                      text.rfind('\n', 0, candidate.start()) + 1,
                      text.rfind('}', 0, candidate.start()) + 1,
                      text.rfind(';', 0, candidate.start()) + 1)
                  declaration = text[declaration_start:candidate.start()]
                  if not any(
                      modifier in declaration
                      for modifier in ('public ', 'protected ', 'internal ')):
                      continue
                  next_nonspace = close_parenthesis + 1
                  while next_nonspace < len(text) and text[next_nonspace].isspace():
                      next_nonspace += 1
                  if text.startswith('=>', next_nonspace):
                      print(f'Skipping expression-bodied CA1062 target: {path}:{method_name}')
                      return False
                  if next_nonspace >= len(text) or text[next_nonspace] != '{':
                      continue
                  line_start = text.rfind('\n', 0, next_nonspace) + 1
                  indentation = re.match(r'[ \t]*', text[line_start:next_nonspace]).group(0)
                  insertion = f'\n{indentation}    {guard}'
                  path.write_text(
                      text[:next_nonspace + 1] + insertion + text[next_nonspace + 1:],
                      encoding='utf-8',
                      newline='\n')
                  print(f'Added {guard} to {path}:{method_name}')
                  return True
              raise RuntimeError(
                  f"Could not locate a block-bodied externally visible method '{method_identity}' for parameter '{parameter}' in {path}.")

          matched_guards = 0
          seen = set()
          for match in ca1062.finditer(diagnostic):
              path = repo_path(match.group('path'))
              if path is None:
                  continue
              key = (path.as_posix(), match.group('method'), match.group('parameter'))
              if key in seen:
                  continue
              seen.add(key)
              if add_guard(path, match.group('method'), match.group('parameter')):
                  matched_guards += 1

          mechanical = 0
          for root in (Path('src'), Path('tests'), Path('tools')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  original = path.read_text(encoding='utf-8')
                  rewritten = one_char_contains.sub(
                      lambda match: f".Contains('{match.group('char')}')",
                      original)
                  rewritten = hex_lower.sub(
                      lambda match: f"Convert.ToHexStringLower({match.group('value')})",
                      rewritten)
                  if rewritten != original:
                      path.write_text(rewritten, encoding='utf-8', newline='\n')
                      mechanical += 1

          print(f'CA1062 guards added: {matched_guards}')
          print(f'Mechanical analyzer files changed: {mechanical}')
          PY

      - name: Restore, format, build, and test canonical solution
        id: gate
        if: steps.source.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet restore AggregatorBackend.slnx 2>&1 | tee /tmp/analyzer-restore.log
          dotnet format AggregatorBackend.slnx --no-restore 2>&1 | tee /tmp/analyzer-format.log
          dotnet format AggregatorBackend.slnx --verify-no-changes --no-restore \
            2>&1 | tee -a /tmp/analyzer-format.log
          dotnet build AggregatorBackend.slnx --no-restore -warnaserror /m:1 /nr:false \
            2>&1 | tee /tmp/analyzer-build.log
          dotnet test AggregatorBackend.slnx --no-build -warnaserror \
            --logger 'console;verbosity=normal' /m:1 /nr:false \
            2>&1 | tee /tmp/analyzer-test.log

      - name: Commit only a fully green analyzer repair
        if: steps.source.outcome == 'success' && steps.gate.outcome == 'success'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          test "$base" = "$(git rev-parse HEAD)" || {
            echo 'main changed during analyzer proof; refusing a mixed-base commit.' >&2
            exit 1
          }
          rm -f \
            .codex/ci/active-blocker-errors.txt \
            .codex/ci/canonical-static-gate-blocker.md \
            .codex/ci/stabilization-controller-blocker.txt
          git rm .github/workflows/repair-analyzer-blockers.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Repair diagnostics-backed analyzer blockers' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Persist unresolved analyzer diagnostic
        if: steps.source.outcome != 'success' || steps.gate.outcome != 'success'
        uses: actions/github-script@v9
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const paths = [
              '/tmp/analyzer-source.log',
              '/tmp/analyzer-restore.log',
              '/tmp/analyzer-format.log',
              '/tmp/analyzer-build.log',
              '/tmp/analyzer-test.log'
            ];
            let text = `source_outcome=${process.env.SOURCE_OUTCOME}\ngate_outcome=${process.env.GATE_OUTCOME}\nrun=${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            for (const path of paths) {
              if (!fs.existsSync(path)) continue;
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
              const relevant = lines.filter(line =>
                /\berror\b|\bfailed\b|\bfailure\b|\bexception\b|\bCS\d{4}\b|\bCA\d{4}\b|Assert\./i.test(line));
              text += `\n${(relevant.length > 0 ? relevant : lines).slice(-260).join('\n')}\n`;
            }
            const path = '.codex/ci/active-blocker-errors.txt';
            let existing = null;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              if (!Array.isArray(response.data)) existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'Persist unresolved analyzer blocker [skip ci]',
              content: Buffer.from(text, 'utf8').toString('base64'),
              ...(existing ? { sha: existing.sha } : {})
            });

      - name: Publish status
        if: always()
        uses: actions/github-script@v9
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const passed = process.env.SOURCE_OUTCOME === 'success' &&
              process.env.GATE_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: passed ? 'Analyzer blocker repair passed' : 'Analyzer or semantic blocker remains',
              context: 'ci/analyzer-repair'
            });

      - name: Fail when blocker remains
        if: steps.source.outcome != 'success' || steps.gate.outcome != 'success'
        run: exit 1
