name: Materialize Catalog media owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-catalog-media.yml'
      - 'tools/completion/generate_catalog_media_core.py'
      - 'tools/completion/harden_catalog_media_generated.py'
      - 'tools/completion/finalize_catalog_media_generation.py'
      - 'tools/completion/write_catalog_media_deployment.py'
      - 'tools/CatalogMediaRuntimeGenerator/**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: materialize-catalog-media
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  generate-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Generate Catalog media owner core
        run: |
          python3 tools/completion/generate_catalog_media_core.py
          python3 tools/completion/harden_catalog_media_generated.py
          python3 tools/completion/finalize_catalog_media_generation.py

      - name: Generate Catalog media runtime and deployment artifacts
        run: |
          dotnet run --project tools/CatalogMediaRuntimeGenerator/CatalogMediaRuntimeGenerator.csproj --configuration Release
          python3 tools/completion/write_catalog_media_deployment.py
          python3 .tools/complete-backend.py

      - name: Restore complete physical solution
        run: dotnet restore AggregatorBackend.slnx

      - name: Apply canonical formatting
        run: dotnet format AggregatorBackend.slnx --no-restore

      - name: Build complete physical solution
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror /m:1 /nr:false

      - name: Test complete physical solution
        run: dotnet test AggregatorBackend.slnx --no-build --logger "console;verbosity=normal" /m:1 /nr:false

      - name: Verify owner inventory and generated source
        run: |
          python3 .tools/complete-backend.py --check
          test -f src/Catalog/Catalog.Media.Domain/Catalog.Media.Domain.csproj
          test -f src/Catalog/Catalog.Media.Contracts/Catalog.Media.Contracts.csproj
          test -f src/Catalog/Catalog.Media.Application/Catalog.Media.Application.csproj
          test -f src/Catalog/Catalog.Media.Infrastructure/Catalog.Media.Infrastructure.csproj
          test -f src/Catalog/Catalog.Media.Api/Catalog.Media.Api.csproj
          test -f src/Catalog/Catalog.Media.Worker/Catalog.Media.Worker.csproj
          test -f src/Catalog/Catalog.Media.Migrations/Catalog.Media.Migrations.csproj
          test -f src/Catalog/Catalog.Media.Api/Dockerfile
          test -f src/Catalog/Catalog.Media.Worker/Dockerfile
          git diff --check

      - name: Commit only the proven generated owner
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AggregatorBackend.slnx \
            docs/decisions/project-inventory.md \
            docs/generated/catalog-media-runtime-generation.md \
            deploy/compose.catalog-media.yaml \
            src/Catalog/Catalog.Media.Domain \
            src/Catalog/Catalog.Media.Contracts \
            src/Catalog/Catalog.Media.Application \
            src/Catalog/Catalog.Media.Infrastructure \
            src/Catalog/Catalog.Media.Api \
            src/Catalog/Catalog.Media.Worker \
            src/Catalog/Catalog.Media.Migrations \
            tests/Catalog/Catalog.Media.Domain.Tests \
            tests/Catalog/Catalog.Media.Application.Tests \
            tests/Catalog/Catalog.Media.Infrastructure.Tests
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Catalog media owner and runtime"
          git push origin HEAD:main

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Catalog media materialization: ${process.env.JOB_STATUS}`,
              context: 'ci/catalog-media-materialization'
            });
