name: Finalize Ingestion end-to-end flow

on:
  push:
    branches: [main]
    paths:
      - '.tools/finalize-ingestion-e2e.py'
      - '.tools/reconcile-composition.py'
      - '.tools/complete-backend.py'
      - '.github/workflows/finalize-ingestion-e2e.yml'
      - 'src/Ingestion/**'
      - 'tests/Ingestion/**'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: finalize-ingestion-e2e
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  normalize-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Finalize Ingestion source compatibility
        run: python3 .tools/finalize-ingestion-e2e.py

      - name: Reconcile owner composition and physical solution
        run: |
          python3 .tools/reconcile-composition.py
          python3 .tools/complete-backend.py

      - name: Restore
        run: dotnet restore AggregatorBackend.slnx

      - name: Format
        run: dotnet format AggregatorBackend.slnx --no-restore

      - name: Build all projects
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror

      - name: Test all projects
        run: dotnet test AggregatorBackend.slnx --no-build --logger "console;verbosity=normal"

      - name: Verify deterministic state
        run: |
          python3 .tools/finalize-ingestion-e2e.py --check
          python3 .tools/reconcile-composition.py --check
          python3 .tools/complete-backend.py --check
          git diff --check

      - name: Commit only the verified state
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Ingestion package-to-commit flow [completion-bot]"
          git push origin HEAD:main

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Ingestion E2E ${context.runId}: ${process.env.JOB_STATUS}`,
              context: 'ci/ingestion-e2e'
            });
