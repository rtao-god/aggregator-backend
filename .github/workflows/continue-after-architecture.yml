name: Continue stabilization after architecture proof

on:
  workflow_run:
    workflows: ["Harden semantic architecture repair"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-owner-proofs:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch remaining owner proofs from latest main
        uses: actions/github-script@v9
        with:
          script: |
            const workflows = [
              'consolidate-ingestion-owner-v4.yml',
              'complete-promotion-owner-v2.yml'
            ];
            for (const workflow_id of workflows) {
              try {
                await github.rest.actions.getWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id
                });
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  ref: 'main'
                });
                core.info(`Dispatched ${workflow_id}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`${workflow_id} is already removed after a proven owner commit.`);
                  continue;
                }
                throw error;
              }
            }
