name: runtime-solution-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: runtime-solution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ hashFiles('src/Analytics/Analytics.Api/Analytics.Api.csproj') != '' && hashFiles('src/Analytics/Analytics.Migrations/Analytics.Migrations.csproj') != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Restore runtime solution
        run: dotnet restore AggregatorBackend.Runtime.slnx
      - name: Verify runtime formatting and analyzers
        run: dotnet format AggregatorBackend.Runtime.slnx --verify-no-changes --no-restore
      - name: Build runtime solution
        run: dotnet build AggregatorBackend.Runtime.slnx --no-restore -warnaserror
      - name: Run runtime owner tests
        run: dotnet test AggregatorBackend.Runtime.slnx --no-build --logger "console;verbosity=normal"
      - name: Run architecture proof
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --no-build --logger "console;verbosity=normal"
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Runtime solution ${context.runId}: ${process.env.JOB_STATUS}`,
              context: 'ci/runtime-solution'
            });
