name: Finalize analyzer-safe architecture proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-architecture-proof-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repair-architecture-proof
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  repair-prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Install analyzer-safe semantic assertions
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path.cwd()

          def replace_method(source: str, method_name: str, replacement: str) -> str:
              signature = re.search(
                  rf'public\s+void\s+{re.escape(method_name)}\s*\(\s*\)',
                  source)
              if signature is None:
                  raise RuntimeError(f'Architecture method {method_name} was not found.')
              start = source.rfind('    [Fact]', 0, signature.start())
              opening = source.find('{', signature.end())
              if start < 0 or opening < 0:
                  raise RuntimeError(f'Architecture method boundary for {method_name} was not found.')

              index = opening
              depth = 0
              state = 'code'
              while index < len(source):
                  current = source[index]
                  following = source[index + 1] if index + 1 < len(source) else ''
                  if state == 'code':
                      if current == '/' and following == '/':
                          state = 'line_comment'; index += 2; continue
                      if current == '/' and following == '*':
                          state = 'block_comment'; index += 2; continue
                      if current == '@' and following == '"':
                          state = 'verbatim_string'; index += 2; continue
                      if current == '"':
                          state = 'string'; index += 1; continue
                      if current == "'":
                          state = 'char'; index += 1; continue
                      if current == '{':
                          depth += 1
                      elif current == '}':
                          depth -= 1
                          if depth == 0:
                              return source[:start] + replacement.rstrip() + source[index + 1:]
                  elif state == 'line_comment':
                      if current == '\n': state = 'code'
                  elif state == 'block_comment':
                      if current == '*' and following == '/':
                          state = 'code'; index += 2; continue
                  elif state == 'string':
                      if current == '\\': index += 2; continue
                      if current == '"': state = 'code'
                  elif state == 'verbatim_string':
                      if current == '"' and following == '"': index += 2; continue
                      if current == '"': state = 'code'
                  elif state == 'char':
                      if current == '\\': index += 2; continue
                      if current == "'": state = 'code'
                  index += 1
              raise RuntimeError(f'Closing brace for {method_name} was not found.')

          outbox_path = root / 'tests/Architecture.Tests/CatalogOutboxContractTests.cs'
          outbox = outbox_path.read_text(encoding='utf-8').replace('"lease_owner"', '"leased_by"')
          if '"leased_by"' not in outbox:
              raise RuntimeError('Catalog outbox proof does not assert leased_by.')
          outbox_path.write_text(outbox, encoding='utf-8', newline='\n')

          authorization_method = '''    [Fact]
              public void CommandControllersRequireExplicitAuthorization()
              {
                  // Semantic endpoint proof: attribute order is irrelevant, policy identity is mandatory.
                  var repositoryRoot = LocateRepositoryRoot();
                  var failures = new List<string>();
                  foreach (var path in Directory.EnumerateFiles(
                               Path.Combine(repositoryRoot, "src"),
                               "*Controller.cs",
                               SearchOption.AllDirectories))
                  {
                      var lines = File.ReadAllLines(path);
                      var classHasPolicy = HasExplicitClassPolicy(lines);
                      for (var lineIndex = 0; lineIndex < lines.Length; lineIndex++)
                      {
                          if (!IsMutatingEndpointAttribute(lines[lineIndex]))
                          {
                              continue;
                          }

                          var attributeStart = lineIndex;
                          while (attributeStart > 0)
                          {
                              var previous = lines[attributeStart - 1].Trim();
                              if (previous.Length == 0 || previous.StartsWith('['))
                              {
                                  attributeStart--;
                                  continue;
                              }

                              break;
                          }

                          var methodLine = lineIndex + 1;
                          while (methodLine < lines.Length &&
                                 !lines[methodLine].Contains("public ", StringComparison.Ordinal))
                          {
                              methodLine++;
                          }

                          if (methodLine >= lines.Length || methodLine - lineIndex > 40)
                          {
                              failures.Add(
                                  $"{Path.GetRelativePath(repositoryRoot, path)} has no bounded public method after a mutating endpoint near line {lineIndex + 1}.");
                              continue;
                          }

                          var attributes = string.Join(
                              Environment.NewLine,
                              lines[attributeStart..methodLine]);
                          if (!classHasPolicy && !HasExplicitPolicy(attributes))
                          {
                              failures.Add(
                                  $"{Path.GetRelativePath(repositoryRoot, path)} lacks explicit [Authorize(Policy = ...)] near line {lineIndex + 1}.");
                          }
                      }
                  }

                  Assert.True(failures.Count == 0, string.Join(Environment.NewLine, failures));

                  static bool IsMutatingEndpointAttribute(string line)
                  {
                      var value = line.TrimStart();
                      return value.StartsWith("[HttpPost", StringComparison.Ordinal) ||
                             value.StartsWith("[HttpPut", StringComparison.Ordinal) ||
                             value.StartsWith("[HttpPatch", StringComparison.Ordinal) ||
                             value.StartsWith("[HttpDelete", StringComparison.Ordinal);
                  }

                  static bool HasExplicitClassPolicy(IReadOnlyList<string> lines)
                  {
                      var classLine = -1;
                      for (var index = 0; index < lines.Count; index++)
                      {
                          if (lines[index].Contains(" class ", StringComparison.Ordinal) ||
                              lines[index].TrimStart().StartsWith("class ", StringComparison.Ordinal))
                          {
                              classLine = index;
                              break;
                          }
                      }

                      if (classLine < 0)
                      {
                          return false;
                      }

                      var start = classLine;
                      while (start > 0)
                      {
                          var previous = lines[start - 1].Trim();
                          if (previous.Length == 0 || previous.StartsWith('['))
                          {
                              start--;
                              continue;
                          }

                          break;
                      }

                      return HasExplicitPolicy(string.Join(Environment.NewLine, lines[start..classLine]));
                  }

                  static bool HasExplicitPolicy(string attributes) =>
                      attributes.Contains("[Authorize", StringComparison.Ordinal) &&
                      attributes.Contains("Policy", StringComparison.Ordinal) &&
                      attributes.Contains('=');

                  static string LocateRepositoryRoot()
                  {
                      var directory = new DirectoryInfo(AppContext.BaseDirectory);
                      while (directory is not null)
                      {
                          if (File.Exists(Path.Combine(directory.FullName, "AggregatorBackend.slnx")))
                          {
                              return directory.FullName;
                          }

                          directory = directory.Parent;
                      }

                      throw new InvalidOperationException("Repository root was not found.");
                  }
              }
          '''.replace('              ', '')

          credential_method = '''    [Fact]
              public void RepositoryDoesNotCommitCredentialValues()
              {
                  // Only deployable configuration values are credentials; Token/Password identifiers are not.
                  var repositoryRoot = LocateRepositoryRoot();
                  var candidates = new HashSet<string>(StringComparer.Ordinal);
                  foreach (var path in Directory.EnumerateFiles(repositoryRoot, "compose*.yml"))
                  {
                      candidates.Add(path);
                  }

                  foreach (var path in Directory.EnumerateFiles(repositoryRoot, "compose*.yaml"))
                  {
                      candidates.Add(path);
                  }

                  var deployRoot = Path.Combine(repositoryRoot, "deploy");
                  if (Directory.Exists(deployRoot))
                  {
                      foreach (var path in Directory.EnumerateFiles(
                                   deployRoot,
                                   "*",
                                   SearchOption.AllDirectories))
                      {
                          if (IsConfigurationFile(path))
                          {
                              candidates.Add(path);
                          }
                      }
                  }

                  foreach (var path in Directory.EnumerateFiles(
                               Path.Combine(repositoryRoot, "src"),
                               "appsettings*.json",
                               SearchOption.AllDirectories))
                  {
                      candidates.Add(path);
                  }

                  var assignmentPattern = new System.Text.RegularExpressions.Regex(
                      """(?ix)(?<key>["']?[A-Za-z0-9_.-]*(?:password|passwd|pwd|secret|token|access[_-]?key|secret[_-]?key|client[_-]?secret|private[_-]?key|signing[_-]?key)[A-Za-z0-9_.-]*["']?)\s*[:=]\s*(?<value>[^#\r\n,]+)""",
                      System.Text.RegularExpressions.RegexOptions.Compiled |
                      System.Text.RegularExpressions.RegexOptions.CultureInvariant,
                      TimeSpan.FromSeconds(1));
                  var connectionPattern = new System.Text.RegularExpressions.Regex(
                      """(?ix)\b(?<key>Password|Pwd|Secret|Token|AccessKey|SecretKey|ClientSecret)\s*=\s*(?<value>[^;\s]+)""",
                      System.Text.RegularExpressions.RegexOptions.Compiled |
                      System.Text.RegularExpressions.RegexOptions.CultureInvariant,
                      TimeSpan.FromSeconds(1));
                  var defaultPattern = new System.Text.RegularExpressions.Regex(
                      """\$\{[^}:]+:-(?<default>[^}]+)\}""",
                      System.Text.RegularExpressions.RegexOptions.Compiled |
                      System.Text.RegularExpressions.RegexOptions.CultureInvariant,
                      TimeSpan.FromSeconds(1));
                  var failures = new List<string>();
                  foreach (var path in candidates.Order(StringComparer.Ordinal))
                  {
                      var lines = File.ReadAllLines(path);
                      for (var lineIndex = 0; lineIndex < lines.Length; lineIndex++)
                      {
                          var line = lines[lineIndex].Trim();
                          if (line.Length == 0 || line.StartsWith('#'))
                          {
                              continue;
                          }

                          AddFailures(assignmentPattern.Matches(line), "credential");
                          AddFailures(connectionPattern.Matches(line), "connection-string credential");

                          void AddFailures(
                              System.Text.RegularExpressions.MatchCollection matches,
                              string kind)
                          {
                              foreach (System.Text.RegularExpressions.Match match in matches)
                              {
                                  if (IsForbiddenLiteralCredential(
                                          match.Groups["value"].Value,
                                          defaultPattern))
                                  {
                                      failures.Add(
                                          $"{Path.GetRelativePath(repositoryRoot, path)}:{lineIndex + 1} commits a literal {kind} for '{match.Groups["key"].Value}'.");
                                  }
                              }
                          }
                      }
                  }

                  Assert.True(
                      failures.Count == 0,
                      string.Join(Environment.NewLine, failures.Distinct(StringComparer.Ordinal)));

                  static bool IsConfigurationFile(string path)
                  {
                      var extension = Path.GetExtension(path);
                      return extension.Equals(".yml", StringComparison.OrdinalIgnoreCase) ||
                             extension.Equals(".yaml", StringComparison.OrdinalIgnoreCase) ||
                             extension.Equals(".json", StringComparison.OrdinalIgnoreCase) ||
                             extension.Equals(".env", StringComparison.OrdinalIgnoreCase) ||
                             extension.Equals(".sh", StringComparison.OrdinalIgnoreCase) ||
                             extension.Equals(".ps1", StringComparison.OrdinalIgnoreCase);
                  }

                  static bool IsForbiddenLiteralCredential(
                      string rawValue,
                      System.Text.RegularExpressions.Regex defaultPattern)
                  {
                      var value = rawValue.Trim().TrimEnd(',').Trim((char)34, (char)39);
                      if (value.Length == 0 ||
                          value.Equals("null", StringComparison.OrdinalIgnoreCase) ||
                          value.Equals("~", StringComparison.Ordinal))
                      {
                          return false;
                      }

                      var defaultMatch = defaultPattern.Match(value);
                      if (defaultMatch.Success)
                      {
                          return !IsKnownNonSecretFixture(defaultMatch.Groups["default"].Value);
                      }

                      if (value.Contains("${", StringComparison.Ordinal) ||
                          value.Contains("secrets.", StringComparison.OrdinalIgnoreCase) ||
                          value.Contains("env.", StringComparison.OrdinalIgnoreCase) ||
                          value.StartsWith('$') ||
                          value.StartsWith('<') ||
                          value.StartsWith('%'))
                      {
                          return false;
                      }

                      return !IsKnownNonSecretFixture(value);
                  }

                  static bool IsKnownNonSecretFixture(string rawValue)
                  {
                      var value = rawValue.Trim().Trim((char)34, (char)39);
                      return value.Equals("test", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("testing", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("example", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("dummy", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("guest", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("postgres", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("placeholder", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("required", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("not-a-secret", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("change-me", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("changeme", StringComparison.OrdinalIgnoreCase) ||
                             value.Equals("local-development-only", StringComparison.OrdinalIgnoreCase);
                  }

                  static string LocateRepositoryRoot()
                  {
                      var directory = new DirectoryInfo(AppContext.BaseDirectory);
                      while (directory is not null)
                      {
                          if (File.Exists(Path.Combine(directory.FullName, "AggregatorBackend.slnx")))
                          {
                              return directory.FullName;
                          }

                          directory = directory.Parent;
                      }

                      throw new InvalidOperationException("Repository root was not found.");
                  }
              }
          '''.replace('              ', '')

          security_path = root / 'tests/Architecture.Tests/RepositorySecurityRulesTests.cs'
          security = security_path.read_text(encoding='utf-8')
          security = replace_method(
              security,
              'CommandControllersRequireExplicitAuthorization',
              authorization_method)
          security = replace_method(
              security,
              'RepositoryDoesNotCommitCredentialValues',
              credential_method)
          security_path.write_text(security, encoding='utf-8', newline='\n')

          placeholder_pattern = re.compile(r'\$\{(?P<name>[A-Z0-9_]+):-(?P<default>[^}]+)\}')
          sensitive_names = {
              'PASSWORD', 'PASS', 'SECRET', 'TOKEN', 'ACCESS_KEY', 'SECRET_KEY',
              'PRIVATE_KEY', 'CLIENT_SECRET', 'SIGNING_KEY'
          }
          deployment_files = list(root.glob('compose*.yml')) + list(root.glob('compose*.yaml'))
          deploy_root = root / 'deploy'
          if deploy_root.exists():
              deployment_files.extend(deploy_root.rglob('*.yml'))
              deployment_files.extend(deploy_root.rglob('*.yaml'))

          def require_sensitive_placeholder(match: re.Match[str]) -> str:
              name = match.group('name')
              tokens = name.split('_')
              is_sensitive = any(token in sensitive_names for token in tokens) or any(
                  compound in name
                  for compound in ('ACCESS_KEY', 'SECRET_KEY', 'PRIVATE_KEY', 'CLIENT_SECRET', 'SIGNING_KEY'))
              if not is_sensitive:
                  return match.group(0)
              return '${' + name + ':?' + name + ' is required}'

          for path in sorted(set(deployment_files)):
              content = path.read_text(encoding='utf-8')
              rewritten = placeholder_pattern.sub(require_sensitive_placeholder, content)
              if rewritten != content:
                  path.write_text(rewritten, encoding='utf-8', newline='\n')

      - name: Restore, format, and build architecture proof
        run: |
          dotnet restore tests/Architecture.Tests/Architecture.Tests.csproj
          dotnet format tests/Architecture.Tests/Architecture.Tests.csproj --no-restore
          dotnet format tests/Architecture.Tests/Architecture.Tests.csproj --verify-no-changes --no-restore
          dotnet build tests/Architecture.Tests/Architecture.Tests.csproj --no-restore -warnaserror /m:1 /nr:false

      - name: Run analyzer-safe architecture proof
        run: |
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-build -warnaserror --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Commit proven architecture repair and remove repair workflows
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- \
              tests/Architecture.Tests compose.yml compose.*.yml compose.*.yaml deploy)
            test -z "$affected" || {
              printf 'Architecture-owned files changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          for workflow in \
            .github/workflows/repair-architecture-proof.yml \
            .github/workflows/repair-architecture-proof-v2.yml \
            .github/workflows/repair-architecture-proof-v3.yml; do
            if [ -e "$workflow" ]; then git rm "$workflow"; fi
          done
          paths=(tests/Architecture.Tests deploy .github/workflows/repair-architecture-proof.yml .github/workflows/repair-architecture-proof-v2.yml .github/workflows/repair-architecture-proof-v3.yml)
          while IFS= read -r path; do paths+=("$path"); done < <(find . -maxdepth 1 -type f \( -name 'compose*.yml' -o -name 'compose*.yaml' \) -printf '%P\n' | sort)
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          for path in "${paths[@]}"; do
            if [ -e "$path" ] || git cat-file -e "$base:$path" 2>/dev/null; then
              GIT_INDEX_FILE="$index" git add -A -- "$path"
            fi
          done
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Repair semantic architecture proof' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Semantic architecture proof: ${process.env.JOB_STATUS}`,
              context: 'ci/architecture-proof'
            });
