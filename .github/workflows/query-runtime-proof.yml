name: query-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - 'src/Query/**'
      - 'src/Catalog/Catalog.Contracts/**'
      - 'tests/Query/**'
      - 'tools/QueryProjectionAdapterGenerator/**'
      - 'tools/QueryWorkerCompositionGenerator/**'
      - 'tools/repository_completion*.py'
      - 'AggregatorBackend.slnx'
      - '.github/workflows/query-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

concurrency:
  group: query-runtime-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Normalize repository and Query generators
        shell: bash
        run: |
          python tools/repository_completion.py
          python tools/repository_completion_supplement.py
          python tools/repository_completion_catalog_verification.py
          python tools/repository_completion_query.py
          python - <<'PY'
          from pathlib import Path
          for relative in [
              'src/Query/Query.Infrastructure/Query.Infrastructure.csproj',
          ]:
              path = Path(relative)
              source = path.read_text()
              marker = '<PackageReference Include="Microsoft.Extensions.DependencyInjection.Abstractions" />'
              if marker not in source:
                  source = source.replace(
                      '</Project>',
                      f'  <ItemGroup>\n    {marker}\n  </ItemGroup>\n</Project>')
                  path.write_text(source)
          program = Path('src/Ingestion/Ingestion.Api/Program.cs')
          source = program.read_text().replace(
              '        builder.Services.AddIngestionApplication();\n        builder.Services.AddIngestionProcessingApplication();',
              '        builder.Services.AddIngestionApplication();')
          program.write_text(source)
          PY
      - name: Synchronize physical projects
        shell: bash
        run: |
          mapfile -t projects < <(find src tests tools -name '*.csproj' -type f | sort)
          solution_projects="$(dotnet sln AggregatorBackend.slnx list)"
          for project in "${projects[@]}"; do
            if ! grep -Fq "$project" <<<"$solution_projects"; then
              dotnet sln AggregatorBackend.slnx add "$project"
              solution_projects+=$'\n'"$project"
            fi
          done
      - name: Restore generator dependencies
        run: |
          dotnet restore tools/QueryProjectionAdapterGenerator/QueryProjectionAdapterGenerator.csproj
          dotnet restore tools/QueryWorkerCompositionGenerator/QueryWorkerCompositionGenerator.csproj
      - name: Build Query application and adapter generator
        run: |
          dotnet build src/Query/Query.Application/Query.Application.csproj --no-restore -warnaserror
          dotnet build tools/QueryProjectionAdapterGenerator/QueryProjectionAdapterGenerator.csproj --no-restore -warnaserror
      - name: Generate Catalog publication adapter
        run: dotnet run --project tools/QueryProjectionAdapterGenerator/QueryProjectionAdapterGenerator.csproj --no-build -- --write
      - name: Build Query infrastructure and composition generator
        run: |
          dotnet restore src/Query/Query.Infrastructure/Query.Infrastructure.csproj
          dotnet build src/Query/Query.Infrastructure/Query.Infrastructure.csproj --no-restore -warnaserror
          dotnet restore tools/QueryWorkerCompositionGenerator/QueryWorkerCompositionGenerator.csproj
          dotnet build tools/QueryWorkerCompositionGenerator/QueryWorkerCompositionGenerator.csproj --no-restore -warnaserror
      - name: Generate Query worker composition
        run: dotnet run --project tools/QueryWorkerCompositionGenerator/QueryWorkerCompositionGenerator.csproj --no-build -- --write
      - name: Restore complete solution
        run: dotnet restore AggregatorBackend.slnx
      - name: Normalize formatting
        run: dotnet format AggregatorBackend.slnx --no-restore
      - name: Build complete solution
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror
      - name: Execute complete test suite
        run: dotnet test AggregatorBackend.slnx --no-build --logger 'console;verbosity=normal'
      - name: Verify generated Query sources
        run: |
          dotnet run --project tools/QueryProjectionAdapterGenerator/QueryProjectionAdapterGenerator.csproj --no-build -- --verify
          dotnet run --project tools/QueryWorkerCompositionGenerator/QueryWorkerCompositionGenerator.csproj --no-build -- --verify
      - name: Generate producer-owned contracts
        run: |
          dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --write
          dotnet run --project tools/ContractArtifacts/ContractArtifacts.csproj --no-build -- --verify
      - name: Commit proven Query runtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Complete generated Query publication worker [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Generated Query runtime proof passed' : 'Generated Query runtime proof failed',
              context: 'ci/query-runtime-proof'
            });
