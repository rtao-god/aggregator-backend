name: query-runtime-proof

on:
  push:
    branches: [main]
    paths:
      - 'src/Query/**'
      - 'src/Catalog/Catalog.Contracts/**'
      - 'tests/Query/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/query-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

concurrency:
  group: query-runtime-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore Query owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Query tests/Query -name '*.csproj' -type f | sort)
          test "${#projects[@]}" -gt 0
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done

      - name: Verify Query formatting and analyzers
        shell: bash
        run: |
          mapfile -t projects < <(find src/Query tests/Query -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Build Query production graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Query -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror /m:1 /nr:false
          done

      - name: Test Query owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find tests/Query -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet test "$project" --no-restore -warnaserror \
              --logger 'console;verbosity=normal' /m:1 /nr:false
          done

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: success ? 'Query owner proof passed' : 'Query owner proof failed',
              context: 'ci/query-runtime-proof'
            });
