name: Finalize Ingestion review and commit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ingestion-review-commit.yml'
      - 'src/Ingestion/**'
      - 'tests/Ingestion/Ingestion.Application.Tests/IngestionReviewCommitWorkflowTests.cs'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: finalize-ingestion-review-commit
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  finalize-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Normalize C# argument ordering in the workflow proof
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/Ingestion/Ingestion.Application.Tests/IngestionReviewCommitWorkflowTests.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '            expectedItemCount: 3,\n            new string(\'b\', 64),',
              '            3,\n            new string(\'b\', 64),')
          text = text.replace(
              '                        CatalogListingRevisionId: null,\n                        "catalog.validation_failed"),',
              '                        CatalogListingRevisionId: null,\n                        FailureCode: "catalog.validation_failed"),')
          text = text.replace(
              '            rejectedItemCount: 1,\n            batch.AggregateRevision,\n            timestamp);',
              '            rejectedItemCount: 1,\n            expectedAggregateRevision: batch.AggregateRevision,\n            changedAtUtc: timestamp);')
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Reconcile owner registrations and solution inventory
        run: |
          python3 .tools/reconcile-composition.py
          python3 .tools/complete-backend.py

      - name: Restore
        run: dotnet restore AggregatorBackend.slnx

      - name: Format
        run: dotnet format AggregatorBackend.slnx --no-restore

      - name: Build
        run: dotnet build AggregatorBackend.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test AggregatorBackend.slnx --no-build --logger "console;verbosity=normal"

      - name: Verify deterministic repository state
        run: |
          python3 .tools/reconcile-composition.py --check
          python3 .tools/complete-backend.py --check
          git diff --check

      - name: Commit verified slice
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Ingestion review and commit workflow [completion-bot]"
          git push origin HEAD:main

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Ingestion review/commit ${context.runId}: ${process.env.JOB_STATUS}`,
              context: 'ci/ingestion-review-commit'
            });
