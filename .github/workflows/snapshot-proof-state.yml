name: Snapshot current proof state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-proof-state.yml'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  statuses: read

concurrency:
  group: snapshot-proof-state
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Capture exact proof state for this SHA
        uses: actions/github-script@v9
        env:
          SNAPSHOT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.SNAPSHOT_SHA;
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: sha, per_page: 100 }
            );
            const statuses = await github.rest.repos.getCombinedStatusForRef({
              owner, repo, ref: sha, per_page: 100
            });
            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, branch: 'main', per_page: 100 }
            );
            const sameShaRuns = workflowRuns
              .filter(run => run.head_sha === sha)
              .map(run => ({
                id: run.id,
                name: run.name,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                html_url: run.html_url,
                created_at: run.created_at,
                updated_at: run.updated_at
              }))
              .sort((left, right) => left.name.localeCompare(right.name));
            const payload = {
              sha,
              captured_at_utc: new Date().toISOString(),
              combined_status: statuses.data.state,
              statuses: statuses.data.statuses.map(status => ({
                context: status.context,
                state: status.state,
                description: status.description,
                target_url: status.target_url
              })).sort((left, right) => left.context.localeCompare(right.context)),
              check_runs: checkRuns.map(run => ({
                id: run.id,
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
                html_url: run.html_url
              })).sort((left, right) => left.name.localeCompare(right.name)),
              workflow_runs: sameShaRuns
            };
            fs.mkdirSync('.codex/ci', { recursive: true });
            fs.writeFileSync(
              '.codex/ci/current-proof-state.json',
              `${JSON.stringify(payload, null, 2)}\n`,
              'utf8');

      - name: Commit snapshot and remove this workflow
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          test "$base" = "$(git rev-parse HEAD)" || {
            echo 'Main advanced while proof state was captured.' >&2
            exit 1
          }
          git rm .github/workflows/snapshot-proof-state.yml
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- \
            .codex/ci/current-proof-state.json \
            .github/workflows/snapshot-proof-state.yml
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Record current proof state' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"
