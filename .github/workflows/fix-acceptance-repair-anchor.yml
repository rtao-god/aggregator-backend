name: Fix Acceptance repair anchor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-acceptance-repair-anchor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-acceptance-repair-anchor
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace the fragile AcceptanceHttp block anchor
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/repair-acceptance-analytics-owner.yml')
          source = path.read_text(encoding='utf-8')
          start_marker = "          old_get = '''    public static async Task<TResponse> GetAsync<TResponse>("
          end_marker = "          http.write_text(source, encoding='utf-8', newline='\\n')"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Fragile AcceptanceHttp replacement block was not found.')
          end += len(end_marker)

          replacement = r'''          get_start = source.find(
              '    public static async Task<TResponse> GetAsync<TResponse>(\n')
          get_end = source.find(
              '    public static async Task<JsonDocument> GetDocumentAsync(\n',
              get_start)
          if get_start < 0 or get_end < 0:
              raise SystemExit('Acceptance GET method boundaries are missing.')
          new_get = (
              '    public static Task<TResponse> GetAsync<TResponse>(\n'
              '        HttpClient client,\n'
              '        string relativePath,\n'
              '        IReadOnlyDictionary<string, string>? headers,\n'
              '        CancellationToken cancellationToken) =>\n'
              '        GetAsync<TResponse>(\n'
              '            client,\n'
              '            relativePath,\n'
              '            bearerToken: null,\n'
              '            headers,\n'
              '            cancellationToken);\n'
              '\n'
              '    public static async Task<TResponse> GetAsync<TResponse>(\n'
              '        HttpClient client,\n'
              '        string relativePath,\n'
              '        string? bearerToken,\n'
              '        IReadOnlyDictionary<string, string>? headers,\n'
              '        CancellationToken cancellationToken)\n'
              '    {\n'
              '        ArgumentNullException.ThrowIfNull(client);\n'
              '        ArgumentException.ThrowIfNullOrWhiteSpace(relativePath);\n'
              '        using var request = new HttpRequestMessage(HttpMethod.Get, relativePath);\n'
              '        AddHeaders(request, bearerToken, headers);\n'
              '        using var response = await client.SendAsync(request, cancellationToken);\n'
              '        return await ReadRequiredAsync<TResponse>(response, cancellationToken);\n'
              '    }\n'
              '\n')
          source = source[:get_start] + new_get + source[get_end:]
          http.write_text(source, encoding='utf-8', newline='\n')'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8', newline='\n')

      - name: Commit corrected one-shot repair workflow
        run: |
          rm -f .github/workflows/fix-acceptance-repair-anchor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Acceptance repair source anchor [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
