name: normalize-analytics-worker-generator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/completion/normalize_analytics_worker_generator.py"
      - ".github/workflows/normalize-analytics-worker-generator.yml"

permissions:
  contents: write
  statuses: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Normalize generator source
        run: python3 tools/completion/normalize_analytics_worker_generator.py
      - name: Format and compile generator
        run: |
          dotnet format tools/AnalyticsWorkerGenerator/AnalyticsWorkerGenerator.csproj
          dotnet build tools/AnalyticsWorkerGenerator/AnalyticsWorkerGenerator.csproj -warnaserror
      - name: Commit normalized generator
        run: |
          if git diff --quiet -- tools/AnalyticsWorkerGenerator; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/AnalyticsWorkerGenerator
          git commit -m "Normalize Analytics worker generator"
          git push origin HEAD:main
      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Analytics worker generator: ${process.env.JOB_STATUS}`,
              context: 'ci/analytics-worker-generator'
            });
