name: Finalize canonical Promotion owner consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-promotion-owner-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: complete-promotion-owner
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  prove-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Apply the reviewed Promotion owner consolidation
        shell: bash
        run: |
          python3 - <<'BOOTSTRAP'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/complete-promotion-owner-v2.yml').read_text(
              encoding='utf-8')
          marker = "        run: |\n          from pathlib import Path\n"
          start = source.index(marker) + len("        run: |\n")
          end = source.index(
              '\n\n      - name: Prove the duplicate campaign owner is unreachable',
              start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'complete-promotion-owner.py', 'exec'))

          overlay_store_path = Path(
              'src/Promotion/Promotion.Overlay.Infrastructure/PostgresPromotionOverlayStore.cs')
          overlay_store = overlay_store_path.read_text(encoding='utf-8')

          old_lease_guard = (
              '        if (leaseDuration is < TimeSpan.FromSeconds(5) or > TimeSpan.FromMinutes(5))\n'
              '        {\n'
          )
          new_lease_guard = (
              '        if (leaseDuration < TimeSpan.FromSeconds(5) ||\n'
              '            leaseDuration > TimeSpan.FromMinutes(5))\n'
              '        {\n'
          )
          if overlay_store.count(old_lease_guard) != 1:
              raise RuntimeError(
                  'Expected exactly one Promotion overlay lease-duration guard.')
          overlay_store = overlay_store.replace(old_lease_guard, new_lease_guard)

          if overlay_store.count('        string error,\n') != 2:
              raise RuntimeError(
                  'Expected the Promotion overlay failure parameter in the interface and implementation.')
          overlay_store = overlay_store.replace(
              '        string error,\n',
              '        string failureMessage,\n')

          old_failure_use = (
              '        ArgumentException.ThrowIfNullOrWhiteSpace(error);\n'
              '        await using var command = _dataSource.CreateCommand("""\n'
          )
          new_failure_use = (
              '        ArgumentException.ThrowIfNullOrWhiteSpace(failureMessage);\n'
              '        await using var command = _dataSource.CreateCommand("""\n'
          )
          if overlay_store.count(old_failure_use) != 1:
              raise RuntimeError(
                  'Expected exactly one Promotion overlay failure-message guard.')
          overlay_store = overlay_store.replace(old_failure_use, new_failure_use)

          old_parameter = (
              '        command.Parameters.AddWithValue("last_error", NpgsqlDbType.Varchar, error);\n'
          )
          new_parameter = (
              '        command.Parameters.AddWithValue(\n'
              '            "last_error",\n'
              '            NpgsqlDbType.Varchar,\n'
              '            failureMessage);\n'
          )
          if overlay_store.count(old_parameter) != 1:
              raise RuntimeError(
                  'Expected exactly one Promotion overlay failure SQL parameter.')
          overlay_store = overlay_store.replace(old_parameter, new_parameter)
          overlay_store_path.write_text(
              overlay_store,
              encoding='utf-8',
              newline='\n')
          BOOTSTRAP

      - name: Prove the duplicate campaign owner is unreachable
        shell: bash
        run: |
          if grep -R --line-number --include='*.cs' --include='*.sql' \
            -E 'PromotionCampaign|PromotionRuntimeDbContext|PromotionCampaignService|CreatePromotionCampaignRequest|promotion\.campaign|promotion_operations\.command_result' \
            src/Promotion tests/Promotion; then
            echo 'A duplicate Promotion campaign owner remains reachable.' >&2
            exit 1
          fi
          test ! -d tests/Promotion/Promotion.Runtime.Tests || \
            test -z "$(find tests/Promotion/Promotion.Runtime.Tests -type f -print -quit)"

      - name: Restore Promotion owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Promotion tests/Promotion -name '*.csproj' -type f | sort)
          test "${#projects[@]}" -gt 0
          for project in "${projects[@]}"; do
            dotnet restore "$project"
          done
          dotnet restore tests/Architecture.Tests/Architecture.Tests.csproj

      - name: Format and verify Promotion owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Promotion tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet format "$project" --no-restore
            dotnet format "$project" --verify-no-changes --no-restore
          done

      - name: Build Promotion production graph
        shell: bash
        run: |
          mapfile -t projects < <(find src/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet build "$project" --no-restore -warnaserror /m:1 /nr:false
          done

      - name: Test Promotion owner graph
        shell: bash
        run: |
          mapfile -t projects < <(find tests/Promotion -name '*.csproj' -type f | sort)
          for project in "${projects[@]}"; do
            dotnet test "$project" --no-restore -warnaserror \
              --logger 'console;verbosity=normal' /m:1 /nr:false
          done

      - name: Prove affected architecture boundaries
        shell: bash
        run: |
          filter='FullyQualifiedName~Architecture.Tests.DependencyRulesTests|FullyQualifiedName=Architecture.Tests.RepositorySecurityRulesTests.ApiAndWorkerStartupNeverOwnBusinessMigrations|FullyQualifiedName=Architecture.Tests.RepositorySecurityRulesTests.CrossContextProjectReferencesTargetOnlyProducerContracts'
          dotnet test tests/Architecture.Tests/Architecture.Tests.csproj \
            --no-restore -warnaserror --filter "$filter" \
            --logger 'console;verbosity=normal' /m:1 /nr:false

      - name: Commit proven Promotion consolidation and remove one-shot workflows
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          if [ "$base" != "$(git rev-parse HEAD)" ]; then
            affected=$(git diff --name-only HEAD..origin/main -- \
              src/Promotion tests/Promotion .codex/modules/promotion.md \
              AggregatorBackend.slnx AggregatorBackend.All.slnx AggregatorBackend.Runtime.slnx)
            test -z "$affected" || {
              printf 'Promotion owner changed during proof:\n%s\n' "$affected" >&2
              exit 1
            }
          fi
          git rm \
            .github/workflows/fix-promotion-campaign-owner.yml \
            .github/workflows/complete-promotion-owner.yml \
            .github/workflows/complete-promotion-owner-v2.yml \
            .github/workflows/complete-promotion-owner-v3.yml \
            .github/workflows/fix-promotion-mapper-null-guard.yml
          paths=(
            src/Promotion
            tests/Promotion
            .codex/modules/promotion.md
            AggregatorBackend.slnx
            AggregatorBackend.All.slnx
            AggregatorBackend.Runtime.slnx
            .github/workflows/fix-promotion-campaign-owner.yml
            .github/workflows/complete-promotion-owner.yml
            .github/workflows/complete-promotion-owner-v2.yml
            .github/workflows/complete-promotion-owner-v3.yml
            .github/workflows/fix-promotion-mapper-null-guard.yml
          )
          index=$(mktemp)
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree "$base"
          GIT_INDEX_FILE="$index" git add -A -- "${paths[@]}"
          GIT_INDEX_FILE="$index" git diff --cached --check
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          base_tree=$(git rev-parse "$base^{tree}")
          test "$tree" != "$base_tree" || exit 0
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf '%s\n' 'Remove duplicate Promotion campaign owner' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/main"

      - name: Publish connector-readable status
        if: always()
        uses: actions/github-script@v9
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Promotion owner proof: ${process.env.JOB_STATUS}`,
              context: 'ci/promotion-owner'
            });
