services:
  catalog-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Catalog/Catalog.Worker/Catalog.Worker.csproj
        ENTRY_DLL: Catalog.Worker.dll
    environment:
      ConnectionStrings__Catalog: Host=catalog-db;Port=5432;Database=catalog;Username=catalog_owner;Password=${CATALOG_DB_PASSWORD:-catalog-local-password}
      CatalogWorker__BrokerUri: amqp://${RABBITMQ_USER:-aggregator}:${RABBITMQ_PASSWORD:-aggregator-local-password}@rabbitmq:5672
      CatalogWorker__Exchange: aggregator.events
      CatalogWorker__DispatcherIdentity: catalog-worker
      CatalogWorker__BatchSize: "50"
      CatalogWorker__MaximumDeliveryAttempts: "8"
      CatalogWorker__LeaseDurationSeconds: "120"
      CatalogWorker__EmptyDelayMilliseconds: "500"
    depends_on:
      catalog-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  query-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Query/Query.Worker/Query.Worker.csproj
        ENTRY_DLL: Query.Worker.dll
    environment:
      ConnectionStrings__Query: Host=query-db;Port=5432;Database=query;Username=query_owner;Password=${QUERY_DB_PASSWORD:-query-local-password}
      Query__Worker__BrokerUri: amqp://${RABBITMQ_USER:-aggregator}:${RABBITMQ_PASSWORD:-aggregator-local-password}@rabbitmq:5672
      Query__Worker__Exchange: aggregator.events
      Query__Worker__Queue: query.catalog-publication-projection
      Query__Worker__DeadLetterExchange: aggregator.dead-letter
      Query__Worker__DeadLetterQueue: query.catalog-publication-projection.dead-letter
      Query__Worker__RoutingKey: catalog.publication.activated
      Query__Worker__PrefetchCount: "8"
      Query__PromotionWorker__BrokerUri: amqp://${RABBITMQ_USER:-aggregator}:${RABBITMQ_PASSWORD:-aggregator-local-password}@rabbitmq:5672
      Query__PromotionWorker__Exchange: aggregator.events
      Query__PromotionWorker__Queue: query.promotion-placement-projection
      Query__PromotionWorker__DeadLetterExchange: aggregator.dead-letter
      Query__PromotionWorker__DeadLetterQueue: query.promotion-placement-projection.dead-letter
      Query__PromotionWorker__RoutingKey: promotion.placement.changed
      Query__PromotionWorker__PrefetchCount: "8"
      Query__PromotionWorker__DeliveryLimit: "8"
      Query__PromotionWorker__RetryDelayMilliseconds: "500"
      Query__ObjectStorage__ServiceUrl: http://object-storage:9000
      Query__ObjectStorage__Region: us-east-1
      Query__ObjectStorage__Bucket: aggregator
      Query__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:-aggregator}
      Query__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:-aggregator-local-secret-key}
      Query__ObjectStorage__ForcePathStyle: "true"
      Query__PublicationArtifact__AllowedObjectPrefix: catalog/
      Query__PublicationArtifact__MaximumArtifactBytes: "67108864"
    depends_on:
      query-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]

  promotion-overlay-migrations:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Promotion/Promotion.Overlay.Migrations/Promotion.Overlay.Migrations.csproj
        ENTRY_DLL: Promotion.Overlay.Migrations.dll
    environment:
      ConnectionStrings__Promotion: Host=promotion-db;Port=5432;Database=promotion;Username=promotion_owner;Password=${PROMOTION_DB_PASSWORD:-promotion-local-password}
    depends_on:
      promotion-db:
        condition: service_healthy
    profiles: [migrate]
    restart: "no"
    networks: [backend]

  promotion-overlay-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Promotion/Promotion.Overlay.Api/Promotion.Overlay.Api.csproj
        ENTRY_DLL: Promotion.Overlay.Api.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Promotion: Host=promotion-db;Port=5432;Database=promotion;Username=promotion_owner;Password=${PROMOTION_DB_PASSWORD:-promotion-local-password}
      Authentication__Issuer: ${OIDC_ISSUER:-https://identity.invalid.local}
      Authentication__Audience: aggregator-promotion
      PromotionOverlay__Dispatch__BrokerUri: amqp://${RABBITMQ_USER:-aggregator}:${RABBITMQ_PASSWORD:-aggregator-local-password}@rabbitmq:5672
      PromotionOverlay__Dispatch__Exchange: aggregator.events
      PromotionOverlay__Dispatch__OutboxTable: promotion.overlay_outbox_message
      PromotionOverlay__Dispatch__BatchSize: "50"
      PromotionOverlay__Dispatch__MaximumAttempts: "8"
      PromotionOverlay__Dispatch__LeaseDurationSeconds: "120"
      PromotionOverlay__Dispatch__PollIntervalMilliseconds: "500"
    depends_on:
      promotion-overlay-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  catalog-media-migrations:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Catalog/Catalog.Media.Migrations/Catalog.Media.Migrations.csproj
        ENTRY_DLL: Catalog.Media.Migrations.dll
    environment:
      ConnectionStrings__Catalog: Host=catalog-db;Port=5432;Database=catalog;Username=catalog_owner;Password=${CATALOG_DB_PASSWORD:-catalog-local-password}
    depends_on:
      catalog-db:
        condition: service_healthy
    profiles: [migrate]
    restart: "no"
    networks: [backend]

  catalog-media-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/Catalog/Catalog.Media.Worker/Catalog.Media.Worker.csproj
        ENTRY_DLL: Catalog.Media.Worker.dll
    environment:
      ConnectionStrings__Catalog: Host=catalog-db;Port=5432;Database=catalog;Username=catalog_owner;Password=${CATALOG_DB_PASSWORD:-catalog-local-password}
      CatalogMedia__Worker__WorkerIdentity: catalog-media-worker
      CatalogMedia__Worker__BatchSize: "8"
      CatalogMedia__Worker__MaximumAttempts: "5"
      CatalogMedia__Worker__LeaseDurationSeconds: "120"
      CatalogMedia__Worker__PollIntervalMilliseconds: "1000"
      CatalogMedia__Worker__BrokerUri: amqp://${RABBITMQ_USER:-aggregator}:${RABBITMQ_PASSWORD:-aggregator-local-password}@rabbitmq:5672
      CatalogMedia__Worker__Exchange: aggregator.events
      CatalogMedia__ObjectStorage__ServiceUrl: http://object-storage:9000
      CatalogMedia__ObjectStorage__Region: us-east-1
      CatalogMedia__ObjectStorage__Bucket: aggregator
      CatalogMedia__ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:-aggregator}
      CatalogMedia__ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:-aggregator-local-secret-key}
      CatalogMedia__ObjectStorage__ForcePathStyle: "true"
      CatalogMedia__ObjectStorage__QuarantinePrefix: catalog/media/quarantine/
      CatalogMedia__ObjectStorage__PublicPrefix: catalog/media/public/
      CatalogMedia__ClamAv__Host: clamav
      CatalogMedia__ClamAv__Port: "3310"
    depends_on:
      catalog-media-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]
